er":1},{"id":397,"q":"依規定需強制投保「強制汽車責任保險」之車輛為那些?","options":["腳踏車","機車及汽車","以上皆是"],"answer":2},{"id":398,"q":"環保駕駛對個人的好處有哪些？甲、減少汽油消耗 乙、增進交通安全 丙、減少車輛維修成本 丁、降低駕駛者及乘客搭乘壓力","options":["甲、乙、丙、丁","甲、乙","丙、丁"],"answer":1},{"id":399,"q":"下列何種駕駛行為，可以減少車輛維修成本?","options":["經常急加油加速","定速行駛","經常急煞車減速"],"answer":2},{"id":400,"q":"胎壓不足、載重越重等耗油的主要因素為?","options":["輪胎與地面的磨擦阻力增加","油門控制不當","暖車較久"],"answer":1},{"id":401,"q":"車輛啟動時，環保駕駛的動作不包括下列何者?","options":["暖車 3-5 分鐘","緩慢地加速，5 秒中達到時速 20 公里","引擎發動後輕加油門行駛"],"answer":1},{"id":402,"q":"下列何者不是環保駕駛的好處?","options":["增加行車時間","降低二氧化碳的排放量","減少汽油消耗"],"answer":1},{"id":403,"q":"雨天騎乘機車行經標線、人孔蓋或鐵板路面時，應如何操控車輛？","options":["快速通過以減少輪胎在濕滑處停留時間","避免在上方急煞或急轉彎，儘量直線減速通過","標線與人孔蓋設計有防滑功能，正常騎乘即可"],"answer":2},{"id":404,"q":"騎乘機車行經學校、醫院等行人較多區域時，下列何種騎乘方式最適當？","options":["行人應注意來車，騎士依正常速度通過即可","減速慢行並隨時注意兩側，預判行人可能突然穿越","按喇叭提醒行人注意後快速通過"],"answer":2},{"id":481,"q":"下列何者不是機車駕駛人在交岔路口轉彎前必要做的動作?","options":["減速、禮讓","開亮頭燈","顯示方向燈"],"answer":2},{"id":482,"q":"行車管制號誌顯示紅燈時：","options":["禁止通行","右轉車可以繼續通行","交通狀況許可時，可以左轉彎"],"answer":1},{"id":484,"q":"駕駛人駕車行駛人行道，或經行人穿越道不依規定讓行人優先通行，因而致人受傷或死亡，依法應負刑事責任者加重其刑至","options":["一倍","二倍","二分之一"],"answer":3},{"id":485,"q":"機車駕駛人行經有燈光號誌管制之交岔路口闖紅燈，經當場舉發者，除罰鍰外，並予記違規點數","options":["1 點","2 點","3 點"],"answer":3},{"id":486,"q":"駕駛機車有闖紅燈行為，經當場舉發之處罰是","options":["罰鍰新臺幣 1,200 元至 3,600 元","吊扣駕駛執照 1 個月","罰鍰新臺幣 1,800 元至 5,400 元並記違規點數 3 點"],"answer":3},{"id":487,"q":"行近行人穿越道時，","options":["應減速慢行，遇有行人穿越，應暫停讓行人先行","鳴喇叭穿越通過","應加速通過"],"answer":1},{"id":488,"q":"在鐵路平交道、交岔路口、快車道、行人穿越道","options":["可以停車","可以臨時停車","不得臨時停車"],"answer":3},{"id":489,"q":"行人穿越道上","options":["可以停車","不得臨時停車","無規定"],"answer":2},{"id":490,"q":"行駛至交岔路口，如未設標誌、標線或號誌劃分幹、支線道者，","options":["多線道車應暫停讓少線道先行","少線道車應暫停讓多線道先行","以上皆可"],"answer":2},{"id":491,"q":"行駛至交岔路口，其左(右)轉彎時應距交岔路口多少公尺前顯示方向燈或手勢？","options":["10 公尺","20 公尺","30 公尺"],"answer":3},{"id":492,"q":"行近未設行車管制號誌之行人穿越道前，應","options":["加速通行","減速慢行","無規定"],"answer":2},{"id":493,"q":"騎乘機車時，下列何種行為屬違規行為？","options":["快接近交岔路口停止線前燈光號誌已轉為紅燈，趕緊加速通過","紅燈右轉","以上皆是"],"answer":3},{"id":494,"q":"行至無號誌或號誌故障而無交通指揮人員指揮之交岔路口","options":["支線道車應暫停讓幹線道車先行","幹線道車應暫停讓支線道車先行","以上均可"],"answer":1},{"id":495,"q":"駕駛汽車行經行人穿越道有行人穿越時，不暫停讓行人先行通過者，處分為","options":["罰鍰","吊扣駕照 1 個月","施以道路交通安全講習 1 小時"],"answer":1},{"id":496,"q":"車身顏色變更需要向何者申請變更登記？","options":["原購買機車廠商","監理機關","環保機關"],"answer":2},{"id":497,"q":"行車遇有行人穿越時，下列何者不正確？","options":["行近未設行車管制號誌之行人穿越道前，應減速慢行","行經行人穿越道，遇有行人穿越時，無論有無交通指揮人員指揮或號誌指示，均應暫停讓行人先行通過","未劃設行人穿越道之交岔路口，無需禮讓行人先行通過"],"answer":3},{"id":498,"q":"行經交岔路口，行車管制號誌為綠燈時，","options":["通行權在我，應加速通過","應停車，再重新起步行駛通過","應減速並小心行駛通過"],"answer":3},{"id":499,"q":"機車駕駛人行經無號誌交岔路口，何者非正確行為?","options":["接近無號誌交岔路口時，減速慢行","同時抵達無號誌交岔路口時，幹道車輛優先通行","同時抵達無號誌交岔路口時，若兩車皆為直行，右方車讓左方車優先通行"],"answer":3},{"id":500,"q":"機車駕駛人行經閃黃燈交岔路口","options":["停車再開","減速慢行","僅供參考"],"answer":2},{"id":501,"q":"機車駕駛人行經閃紅燈交岔路口，","options":["停車再開","減速慢行","僅供參考"],"answer":1},{"id":502,"q":"交岔路口一方為閃黃燈、另一方為閃紅燈","options":["閃紅燈者優先行駛","閃黃燈者優先行駛","左方車優先通行"],"answer":2},{"id":503,"q":"機車駕駛人行經交岔路口，黃燈亮起時已越行人穿越道，應","options":["立即停車","退回機車停等區","繼續前進"],"answer":3},{"id":504,"q":"騎乘機車在路口停等紅燈時，應","options":["儘量避免停於快車道前","隨時從照後鏡觀察後方車輛動態","以上皆是"],"answer":3},{"id":505,"q":"機車行駛至有大眾捷運系統車輛共用通行，但聲光號誌故障而無交通指揮人員指揮之交岔路口時，駕駛人應","options":["直接加速通過","暫停、看、聽兩方無大眾捷運系統車輛駛來，始得通過","按鳴喇叭通過"],"answer":2},{"id":507,"q":"下列哪種駕駛行為有誤？","options":["輕軌軌道黃線區禁止停留並儘速通過","輕軌聲光號誌警示音聲響時，不用停看聽，趕快加速通過","行經輕軌捷運共用通行交岔路口時，要遵守交通號誌"],"answer":2},{"id":508,"q":"有關微型電動二輪車以下敘述何者正確？","options":["擅自改裝微型電動二輪車，將處以罰鍰，並須改回原有規格","微型電動二輪車最大行駛速率為每小時 25 公里以下，若超速行駛，將處以罰鍰","以上皆是"],"answer":3},{"id":543,"q":"機車行經無號誌之交岔路口，行車速度應該如何?","options":["加速通過","減速慢行","維持原速"],"answer":2},{"id":544,"q":"行近交叉路口前，見到遠方行車管制號誌燈已轉為黃燈，且尚未通過停止線，機車駕駛人應如何行駛？","options":["為趕時間可以加速繼續行駛，以免浪費時間空等紅燈","應維持原速通過路口，以免影響後方車流","應適當減速慢行，並於停止線前等候紅燈"],"answer":3},{"id":545,"q":"駕駛人為了趕時間而闖紅燈，如遭當場舉發者，依法將處罰？","options":["僅處罰鍰","應處罰鍰，並上道安講習 3 小時","應處罰鍰，並記違規點數 3 點"],"answer":3},{"id":546,"q":"機車駕駛人行經有燈光號誌管制之交叉路口，搶快闖紅燈者，依規定將處罰多少金額之罰鍰？","options":["處新臺幣 1,800～5,400 元罰鍰","處新臺幣 1,200～3,600 元罰鍰","處新臺幣 900～1,800 元罰鍰"],"answer":1},{"id":547,"q":"駕駛人行經有燈光號誌管制之交叉路口，紅燈右轉者？","options":["處新臺幣 600～1,800 元罰鍰","處新臺幣 1,200～2,400 元罰鍰","處新臺幣 1,200～1,800 元罰鍰"],"answer":1},{"id":548,"q":"兩輛機車從不同方向，同時抵達一個未設有任何交通號誌或停（讓）標誌（線）且進入路口行向車道數相同的交叉路口，若兩車皆為直行，關於通行的優先權，下列何者正確？","options":["右方車應讓左方車輛優先通行","左方車應讓右方車輛優先通行","應由車速較快的車輛優先通行"],"answer":2},{"id":549,"q":"機車駕駛人行經設有行人穿越道的路口時，若看到行人正在穿越道路，下列哪項處置方式是正確的？","options":["只要保持足夠距離，從行人前後空隙緩慢通過","靠近行人，按鳴喇叭示意行人加速通過","停車，讓行人優先通過"],"answer":3},{"id":550,"q":"機車行駛至交叉路口，遇綠燈時應如何通過路口？","options":["綠燈時有絕對路權，可加速通過","放慢車速，小心通過","綠燈時有絕對路權，可保持原速通過"],"answer":2},{"id":551,"q":"機車行駛至交叉路口時，關於安全通過之方式，下列敘述何者正確？","options":["號誌為綠燈時即可直接通過，無須再行觀察路口動態","應注意前方及兩側動態路況，並依號誌、標誌、標線指示行駛","跟隨前車行進並保持安全距離，即可安全通過路口"],"answer":2},{"id":552,"q":"機車行駛至劃設有「機慢車停等區」之交叉路口遇紅燈時，關於停車位置，下列敘述何者正確？","options":["機慢車停等區與左轉待轉區均為機車專用，可視當時空間擇一停入","應依標線指示停於機慢車停等區內或停止線後，不得停入左轉待轉區","若待轉區有空間，可直接進入，以縮短等候時間"],"answer":2},{"id":553,"q":"機車行經行人穿越道時，遇行人違規闖紅燈穿越，關於駕駛人之處置方式，下列敘述何者正確？","options":["行人違規在先，駕駛人依號誌行駛具有路權，按鳴喇叭警示後得逕行通過","行人違規時駕駛人雖應減速，但若發生碰撞，肇事責任歸屬於違規之行人","行人違規要受罰，駕駛人仍應注意停讓行人先行通過"],"answer":3},{"id":554,"q":"車輛行至無號誌之圓環路口時，關於通行優先順序，下列敘述何者正確？","options":["應依「左方車讓右方車先行」原則，右側欲進入圓環之車輛優先","應讓已在圓環內行駛之車輛先行，再依序駛入","由較寬或車流量較大道路駛來之車輛，優先進入圓環"],"answer":2},{"id":555,"q":"行車遇閃光紅燈號誌時，關於其交通意義及駕駛人應有之行為，下列敘述何者正確？","options":["閃光紅燈表示警告，車輛應減速接近，注意安全後通過","閃光紅燈視同「停車再開」，車輛應先停車，確認安全後方可通行","閃光紅燈表示前方為次要道路，確認幹道無來車後即可通過"],"answer":2},{"id":556,"q":"機車行駛至交叉路口遇綠燈亮起時，關於通過路口之方式，下列敘述何者較為正確？","options":["綠燈表示允許通行，確認前方無車輛阻擋後即可直接通過","綠燈時行人依規定不得穿越，故駕駛人可依號誌指示正常通過","綠燈時仍應注意路口動態，如有行人穿越應讓其先行"],"answer":3},{"id":557,"q":"在交叉路口，交通指揮人員之指揮手勢與燈光號誌同時存在且不一致時，應依何者為準？","options":["燈光號誌","交通標誌或標線","交通指揮人員之指揮"],"answer":3},{"id":558,"q":"機車駕駛人行至號誌化路口時，見紅燈亮起，應於何處停車？","options":["應於行人穿越道線前停車","不得超越停止線或進入路口","應於路口中央等待"],"answer":2},{"id":559,"q":"機車行近未設行車管制號誌之行人穿越道時，關於駕駛人應有之行為，下列敘述何者正確？","options":["目視確認穿越道上無行人時，得維持原速通過","無論穿越道上有無行人，均應減速慢行接近","行人尚未踏入穿越道前，車輛具有優先通行權"],"answer":2},{"id":560,"q":"汽車轉彎時，軸距愈長則內外輪差也愈大，也就是所需路面的寬度也","options":["愈小","愈大","不變"],"answer":2},{"id":561,"q":"執行任務完畢的消防車、救護車、警備車其行車速度應","options":["不受限制","每小時 50 公里","依道路速限規定行駛"],"answer":3},{"id":562,"q":"車輛內輪差觀念，下列何者不正確？","options":["小客車沒有內輪差","軸距愈長車輛內輪差愈大","聯結車、砂石車等大型車，轉彎時會出現較大之內輪差"],"answer":1},{"id":563,"q":"在轉彎處發生車禍的原因，常是駕駛人","options":["疏忽視野死角","疏忽大型車輛內輪差","以上皆是"],"answer":3},{"id":566,"q":"機車在道路行駛時，發現有大型車跟在後方時，應怎麼做較為適當？","options":["加速，保持車距","靠右減速行駛或適當禮讓，讓大型車超車","立刻停車"],"answer":2},{"id":567,"q":"機車行駛在大型車輛旁，應如何駕駛？","options":["應緊貼大型車輛，保持並行","應避免與大型車輛並行，並保持足夠間隔","因車體較小，可於大小車兩側並行行駛"],"answer":2},{"id":568,"q":"下列關於執行緊急任務的特種車輛行車速度限制，何者敘述正確？","options":["所有執行緊急任務的特種車輛，其行車速度仍必須完全遵守一般道路速限","執行任務中的消防車、救護車、警備車及毒性化學物質災害事故應變車等，其行車速度不受一般規定限制","執行任務中的警備車及工程救險車雖可略微超速，但仍需比照高速公路最高速限行駛"],"answer":2},{"id":569,"q":"執行緊急任務中的消防車、救護車及警備車等，在行駛時可以使用哪些車道？","options":["僅限行駛內側車道，以便快速抵達現場","僅限行駛外側車道，避免影響正常車流","內、外側車道均可行駛，不受車道及行車方向限制"],"answer":3},{"id":570,"q":"發現有執行任務之救護車行駛時，機車駕駛人應如何處置？","options":["加速超越該車輛，立即超車","緊跟車後追行","應避讓該車，不得超越"],"answer":3},{"id":571,"q":"下列何種車輛，機車駕駛人不須禮讓？","options":["身心障礙者用特製車、警備車","幼童專用車、教練車","垃圾車、郵務車"],"answer":3},{"id":572,"q":"行駛中發現前方大型車輛開啟右轉方向燈準備右轉，騎士應如何因應？","options":["趁大型車輛減速時從其右側加速超越","減速並保持距離在大型車輛後方，避免進入其右側內輪差範圍","緊靠大型車輛右後方跟隨轉彎"],"answer":2},{"id":573,"q":"在轉彎時發生車禍的原因為機車駕駛人","options":["僅疏忽視野死角","僅疏忽內輪差","以上皆是"],"answer":3},{"id":574,"q":"設有劃分島劃分快慢車道之道路，在慢車道上行駛之車輛不得","options":["左轉","右轉","左右轉"],"answer":1},{"id":575,"q":"設有劃分島劃分快慢車道之道路，在快車道行駛之車輛不得","options":["左轉","右轉","左右轉"],"answer":2},{"id":576,"q":"路口轉彎時顯示方向燈應在幾公尺前提醒其他用路人？","options":["100 公尺","30 公尺","10 公尺"],"answer":2},{"id":577,"q":"機車行駛至交岔路口，其轉彎，應依標誌或標線之規定行駛，無標誌或標線者，內側車道設有禁行機車標誌或標線者，應","options":["兩段方式進行左轉","可以由內側左轉","由其他車道左轉"],"answer":1},{"id":578,"q":"未設機慢車左(右)轉待轉路段，對向行駛之左右轉彎車輛，已轉彎進入同一車道時應讓：","options":["右轉彎車輛先行","左轉彎車輛先行","同時前進"],"answer":2},{"id":579,"q":"機車進入彎道前","options":["不須減速","須適當減速","須適當加速"],"answer":2},{"id":580,"q":"下列何者非機車彎道行駛安全事項?","options":["彎道前應確實減速","彎道中配合彎道加速以保持車身平衡","出彎確認安全後再適度加速回復原速度"],"answer":2},{"id":581,"q":"下列何者非機車駕駛人轉彎前應做動作","options":["顯示方向燈","讓大型車先行","開亮頭燈"],"answer":3},{"id":599,"q":"機車駕駛人依規定變換車道或轉彎時，應在距離交叉路口或轉彎地點多少公尺前顯示方向燈？","options":["10 公尺前","20 公尺前","30 公尺前"],"answer":3},{"id":600,"q":"在禁止左轉路段是否可實施迴車？","options":["可以，但應注意後方來車","不可以，違者，經當場舉發，除罰鍰外並記違規點數 1 點","可以，但須先打左轉燈"],"answer":2},{"id":601,"q":"有關迴車規定，下列何者正確？","options":["行經圓環路口可直接迴車","行經分向限制線可以直接迴車","禁止左轉路段，不得迴車"],"answer":3},{"id":602,"q":"機車行駛於三快車道以上之單行道道路，關於轉彎方式之規定，下列敘述何者正確？","options":["行駛於右側車道或慢車道欲左轉時，應先變換至左側車道後再行左轉","行駛於左側車道欲右轉時，應先變換至右側車道後再行右轉","行駛於右側車道欲左轉，或行駛於左側車道欲右轉，均應以兩段方式轉彎"],"answer":3},{"id":603,"q":"機車行至設有「機慢車兩段左轉」標誌之路口，遇深夜時段車流稀少，關於左轉方式，下列敘述何者正確？","options":["深夜離峰時段車流量低，確認安全無虞後得直接左轉","無論車流量多寡或時段，均應依規定進行兩段式左轉","該標誌屬建議性質，駕駛人得視現場車流狀況自行判斷左轉方式"],"answer":2},{"id":604,"q":"機車行駛至交通號誌路口欲左轉彎時，若需須進行兩段式左轉，應如何操作？","options":["應先駛入右前方待轉區等待號誌","應在停止線後等待號誌並直接左轉","應直接依車道行進方向行駛"],"answer":1},{"id":605,"q":"機車行駛道路時，若遇內側車道為「禁行機車」路段，欲左轉彎時應依何種方式左轉？","options":["直接左轉","兩段式左轉","任意選擇轉彎方式"],"answer":2},{"id":606,"q":"機車行駛至不須兩段式左轉之交岔路口，左轉彎時應依規定使用方向燈，以下敘述何者正確？","options":["應距交岔路口 30 公尺前顯示方向燈，換入內側車道或左轉車道","機車轉彎時，不需顯示方向燈","機車轉彎只要看見路口淨空就可變更方向"],"answer":1},{"id":607,"q":"騎乘機車時，看見前方路邊有球滾動出來，應","options":["減速注意路況，做好隨時煞停之準備，因預期將有小朋友會衝出來撿球","臨時閃避，快速通過","鳴按喇叭，騎至對向車道"],"answer":1},{"id":608,"q":"騎乘機車經過煙塵路段時，應該如何駕駛？","options":["緊跟在大型車後方，其尾燈有助看清路況","減速慢行，開亮頭燈，與前車保持更長之行車安全距離","加速通過"],"answer":2},{"id":609,"q":"夜間騎車，駕駛人不易發現的目標是","options":["移動中的行人","站立的人物","移動中的車輛"],"answer":2},{"id":610,"q":"騎車時應注意","options":["路旁的商家","前方的號誌、標誌指示及前車的行車動向","以上皆是"],"answer":2},{"id":612,"q":"大型車輛通過時猶如唧筒吸走空氣，隨後會產生強力之吸力，故與大型車輛併行或會車時應","options":["握穩把手","身體放鬆","無所謂"],"answer":1},{"id":613,"q":"在狹路與他車交會時應：","options":["搶先前進使對方讓路","預先估計有足夠位置，儘量靠邊停讓他車先行","大鳴喇叭，警告對方避讓"],"answer":2},{"id":614,"q":"因所駕駛之機車車速較慢，聞後方按喇叭請求讓路時應：","options":["立即停車，讓其超越","仍依原行駛路線行車，不予理會","略靠右側行車，並亮方向燈號或手勢表示允讓"],"answer":3},{"id":615,"q":"在深夜郊外道路上，空曠無車無人的情況下：","options":["可以用高速練習開快車","仍應按規定速限內行駛","可以隨便開車"],"answer":2},{"id":616,"q":"車輛行駛速度愈高，所產生的衝擊力：","options":["愈小","愈大","不變"],"answer":2},{"id":617,"q":"機車附載坐人","options":["可以側坐","為求安全不得側坐","無規定"],"answer":2},{"id":618,"q":"後車超越前車時，應該","options":["由前車右側超車","由前車左側超越","任意超越"],"answer":2},{"id":619,"q":"機車在已劃分快慢車道之雙向道路行駛，而無標誌、標線規定者，應於","options":["最內側車道行駛","在最外側快車道及慢車道行駛","無規定"],"answer":2},{"id":620,"q":"機車行車速度，依速限標誌或標線之規定，無速限標誌或標線者，在未劃設車道線或行車分向線之道路，行車速度每小時","options":["不得超過 20 公里","不得超過 30 公里","不得超過 40 公里"],"answer":2},{"id":621,"q":"機車行車速度，依速限標誌或標線之規定，無速限標誌或標線者，行車時速不得超過","options":["50 公里","40 公里","30 公里"],"answer":1},{"id":622,"q":"機車同一方向行駛時，後車與前車","options":["應保持隨時可以煞停之距離","不需保持距離","應平行前進"],"answer":1},{"id":623,"q":"機車在未劃分快慢車道之單行道行駛，應在","options":["最左、右車道行駛","只能在最右車道行駛","任何車道均可行駛"],"answer":1},{"id":624,"q":"機車在道路行駛","options":["不受交通標誌之限制","應遵守道路交通標誌、標線、號誌之指示","標誌等與機車無關，不必理會"],"answer":2},{"id":625,"q":"機車行車速度，依標誌之規定行駛，無速限標誌或標線者，在設有快慢車道分隔線之慢車道上行駛，時速不得超過","options":["40 公里","50 公里","60 公里"],"answer":1},{"id":626,"q":"按鳴喇叭的時間，每次","options":["不得超過二秒鐘","不得超過一秒鐘","不得超過半秒鐘"],"answer":3},{"id":627,"q":"無標誌或標線指示，機車在未劃分快慢車道之道路，應行駛","options":["內側車道","最外側 2 車道","內側車道中央"],"answer":2},{"id":628,"q":"行車時兩車交會，其相互間隔不得少於","options":["半公尺","1 公尺","2 公尺"],"answer":1},{"id":629,"q":"駕車行經彎道、陡坡、狹橋、隧道、交岔路口標誌之路段或鐵路平交道、道路施工地段時，","options":["不得超車","可以超車","無規定"],"answer":1},{"id":630,"q":"關於行車間距的控制，下列何者不正確？","options":["行車時兩車交會，其左右相互間隔不得少於半公尺","經過路邊臨停的車輛，應保持 1 公尺(約 1 個車門)以上安全間隔","以能通過為原則，不必考慮行車間隔"],"answer":3},{"id":631,"q":"機車在同一車道行駛時，與前車之間應保持","options":["隨時可以煞停之距離","5 公尺距離","10 公尺距離"],"answer":1},{"id":632,"q":"在同向二車道行車時，如遇汽車或機車行駛於與你同一車道的前方，你應","options":["鳴按喇叭促其駛至慢車道","直接併行超越之","跟隨其後不得隨意超車"],"answer":3},{"id":633,"q":"由同向二車道進入一車道，應讓直行車道之車輛先行，無直行車道者，","options":["內車道之車輛先行","外車道之車輛先行","搶快者先行"],"answer":1},{"id":634,"q":"機車與汽車或其他機車會車時，相互之間隔，不得少於","options":["2 公尺","1 公尺","半公尺"],"answer":3},{"id":635,"q":"機車行駛之車道，應依標誌或標線之規定行駛；無標誌或標線者，","options":["得在人行道行駛","不得在人行道行駛","無規定"],"answer":2},{"id":636,"q":"駕駛人行車速度，低於規定之最低時速，經當場舉發者","options":["罰鍰並記違規點數 1 點","吊扣駕照 1 個月","無規定"],"answer":1},{"id":637,"q":"駕駛人行經設有彎道、坡路、狹路、狹橋或隧道標誌之路段或道路施工路段，不減速慢行者","options":["罰鍰","記違規點數 1 點","吊扣駕照 1 個月"],"answer":1},{"id":638,"q":"駕駛人行經設有學校、醫院標誌之路段，不減速慢行，經逕行舉發者","options":["罰鍰","記違規點數 1 點","吊扣駕照 1 個月"],"answer":1},{"id":639,"q":"機車不在規定車道行駛，經當場舉發者","options":["吊扣駕照 1 個月","罰鍰並記違規點數 1 點","施以道路交通安全講習"],"answer":2},{"id":640,"q":"下列何項設施設置之目的在於提供車輛駕駛人及行人有關道路路況之警告、禁制、指示等資訊，以便利行旅及促進交通安全？","options":["標誌、標線","號誌","以上皆是"],"answer":3},{"id":641,"q":"機車行駛之車道，無標誌或標線者，在未劃分快慢車道之道路，應在最外側 2 車道行駛，單行道應在","options":["最左側車道行駛","最右側車道行駛","以上均可"],"answer":3},{"id":642,"q":"機車行駛之車道，應依標誌或標線之規定行駛，無標誌或標線者，由同向 2 車道進入 1 車道，應讓直行車道之車輛先行，無直行車道者，","options":["外車道之車輛應讓內車道之車輛先行","內車道之車輛應讓外車道之車輛先行","以上均可"],"answer":1},{"id":643,"q":"行經設有彎道、陡坡、狹橋、隧道、交岔路口標誌之路段或鐵路平交道、道路施工地段","options":["可以超車","須先按鳴喇叭示警並獲允讓方可超車","不得超車"],"answer":3},{"id":644,"q":"在設有學校、醫院標誌或其他設有禁止超車標誌、標線之處所、地段或對面有來車交會或前行車連貫 2 輛以上者，","options":["可以超車","須先按鳴喇叭示警並獲允讓方可超車","不得超車"],"answer":3},{"id":646,"q":"聞消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號，不避讓者，除罰鍰外，並","options":["違規記點","吊扣駕駛執照 3 個月","吊銷駕照"],"answer":3},{"id":647,"q":"行車最高指導原則，絕對是","options":["車速越慢越好","與前車保持安全車距","緊跟前車較不易出錯"],"answer":2},{"id":648,"q":"遇有特殊情況，必須行駛道路左側時，應該","options":["加速快行","減速慢行並注意前方來車及路旁行人","多按鳴喇叭，使對面來車知道"],"answer":2},{"id":649,"q":"變換車道時，應先","options":["按鳴喇叭","變換燈光","顯示方向燈"],"answer":3},{"id":650,"q":"在雙向 2 車道上「欲」超越前行車，發現對向有來車，你應該","options":["立即減速放棄超車","馬上加速搶先超越","按鳴喇叭，促來車減速或避讓"],"answer":1},{"id":651,"q":"在市區交通頻繁之道路","options":["按鳴喇叭兩長聲後，可以超車","按鳴喇叭兩短聲後，可以超車","不可按鳴喇叭或超車"],"answer":3},{"id":652,"q":"行車中，駕駛人看到鐵路平交道標誌或標線後，應即將車速減低至時速","options":["15 公里以下","20 公里以下","30 公里以下"],"answer":1},{"id":653,"q":"禁止停車路段，其禁止時間為每日之","options":["上午 7 時至晚間 8 時","下午 7 時至上午 8 時","全天 24 小時。如有延長或縮短之必要時，應以標誌及附牌標示之"],"answer":1},{"id":654,"q":"禁止停車路段","options":["禁止臨時停車，但可以停車","禁止停車，但可以臨時停車","不得停車也不得臨時停車"],"answer":2},{"id":655,"q":"禁止臨時停車路段","options":["禁止臨時停車，但可以停車","禁止停車，但可以臨時停車","不得臨時停車也不得停車"],"answer":3},{"id":657,"q":"變換車道時，應：","options":["讓直行車先行","讓轉彎車先行","不須禮讓"],"answer":1},{"id":658,"q":"號誌是管制：","options":["警告、行進","禁制、行進","注意、行進、停止等之指示訊號"],"answer":3},{"id":659,"q":"除行駛在單行道或指定行駛於左側車道外，在未劃行車分向線或分向限制線之道路，應：","options":["靠右行駛","靠左行駛","在道路中間行駛"],"answer":1},{"id":660,"q":"在未劃有分向標線之道路，或鐵路平交道，或不良道路會車時，應該：","options":["加速快行","減速慢行","照常行駛"],"answer":2},{"id":661,"q":"在峻狹坡道會車時，應該：","options":["下坡車讓上坡車先行","上坡車讓下坡車先行","不須相讓"],"answer":1},{"id":662,"q":"在設有彎道、坡路、狹橋、隧道標誌路段或鐵路平交道處：","options":["可以迴車","減速至 5 公里左右始可迴車","不得迴車"],"answer":3},{"id":663,"q":"交岔路口、公共汽車招呼站多少公尺內不得臨時停車：","options":["10 公尺","20 公尺","30 公尺"],"answer":1},{"id":664,"q":"行經設有學校、醫院標誌之路段，應該：","options":["減速慢行，作隨時停車之準備","多按鳴喇叭，使行人注意","加速通過，以免人車擁塞"],"answer":1},{"id":665,"q":"行駛在設有彎道、坡路、狹路標誌之路段，應該：","options":["加速通過，以免車輛擁塞","前車行駛速度太慢時，應按鳴喇叭使前車加速前進","均應減速慢行，作隨時停車之準備"],"answer":3},{"id":666,"q":"駛近學校、醫院等處時：","options":["多按鳴喇叭，使學生或病人等注意","除遇有緊急或危險情況外，不得按鳴喇叭","只能按喇叭 1 短聲"],"answer":2},{"id":667,"q":"駕駛人有下列情形之一者，應施以道路交通安全講習：","options":["闖越鐵路平交道","於交岔路口 10 公尺內臨時停車","變換車道時，未注意安全距離"],"answer":1},{"id":668,"q":"駕駛人駕車，違反道路交通安全規則，因而肇事致人死亡者：","options":["吊扣行車執照","吊扣駕駛執照","吊銷駕駛執照"],"answer":3},{"id":669,"q":"兩輛以上之機車在道路上競駛或競技者，除處罰駕駛人新臺幣 30,000~90,000 元罰鍰，及當場禁止其駕駛，並應：","options":["吊扣其駕駛執照","吊銷其牌照","吊銷其駕駛執照"],"answer":3},{"id":670,"q":"遇幼童專用車、校車不依規定禮讓，或減速慢行，經當場舉發者，除記違規點數外，並處：","options":["罰鍰","吊銷駕照","吊扣駕照"],"answer":1},{"id":671,"q":"長時間連續使用煞車會使煞車來令片過熱，造成煞車效果","options":["提升","減弱","無差別"],"answer":2},{"id":672,"q":"發動機車引擎時，必先","options":["開啟頭燈","打開危險警示燈","握住煞車拉桿"],"answer":3},{"id":673,"q":"行車安全指導原則：","options":["車速愈慢愈安全","與前車、旁車保持安全車距","緊跟前車較不易出錯"],"answer":2},{"id":674,"q":"機車行車時與旁車應保持之安全距離間隔為","options":["0.5 公尺以上","1 公尺以上","隨時可以超車之間隔"],"answer":1},{"id":675,"q":"機車行經路邊停車之汽車旁，應保持之安全間隔為","options":["隨時可以煞停之距離","1 公尺以上(約 1 個車門)","0.5 公尺以上"],"answer":2},{"id":676,"q":"良好之騎乘姿勢是騎乘安全的保障之一，眼睛要","options":["保持直視","不時注意速度表以免超速","注意四周"],"answer":3},{"id":677,"q":"良好之騎乘姿勢是騎乘安全的保障之一，腳掌要","options":["保持自然下垂","平放踏板上","一腳保持自然下垂、一腳平放踏板上"],"answer":2},{"id":678,"q":"行車速率愈高，駕駛人之反應距離：","options":["愈長","愈短","不變"],"answer":1},{"id":679,"q":"最小安全跟車距離必須","options":["大於","小於","等於 停車距離"],"answer":1},{"id":680,"q":"適當的跟車距離可以預防肇事，因為","options":["有摩擦力","有牽引力","有足夠反應時間與空間"],"answer":3},{"id":681,"q":"行經無號誌管制之交岔路口，比較安全的做法：","options":["先看右、後看左、再看右","先看左、後看右、再看左","先看哪邊無差別"],"answer":2},{"id":682,"q":"緊急煞車時易致車輪鎖死，煞車距離會","options":["變長","變短","不變"],"answer":1},{"id":683,"q":"下列何者不是機車正確的煞車方法?","options":["同時使用前後輪煞車","將油門保持在加油狀況","依煞車特性逐漸加強煞車力至最大"],"answer":2},{"id":684,"q":"下列何種行為不利於行車安全?","options":["夜間市區行車使用近光燈","彎道行車加速以保持車身平衡","低速行駛時以控制油門取得平衡"],"answer":2},{"id":685,"q":"機車超車十分危險，下列何者為錯誤行為?","options":["應確定該行駛路段允許超車","輕按喇叭警示前車、顯示左方向燈警示後方來車","以適當速度，由前方機車右側超越"],"answer":3},{"id":686,"q":"下列何者非騎乘機車正確行為?","options":["行經圓環應讓環外車輛優先通行","加油站出口大多無號誌管制，駕駛人應減速慢行並注意車輛動向","行駛於巷道應放慢速度，並利用反射鏡查看有無來車"],"answer":1},{"id":687,"q":"騎乘機車如遇強風從左側吹來，應","options":["加速行駛通過","向左側傾斜車身","雙手握穩機車把手"],"answer":3},{"id":688,"q":"騎乘機車如遇蚊蟲飛進眼睛，最適切之第一反應動作為","options":["在原車道立刻煞車處理","減速安全停靠路邊處理","開亮頭燈"],"answer":2},{"id":689,"q":"騎乘機車遇前方有人孔蓋時，應","options":["騎至對向車道","通過時握穩把手","加速通過"],"answer":2},{"id":690,"q":"騎乘機車經過崎嶇路段時，應","options":["握穩把手避免車輛偏移","減速慢行，隨時準備停車","以上皆是"],"answer":3},{"id":691,"q":"騎乘機車經過施工路段，見地面鋪有鐵板時，應","options":["減速通過","加速通過","臨時閃避"],"answer":1},{"id":692,"q":"騎乘機車時，看見前方有脫落之輪胎皮，何者為錯誤之處置?","options":["快速通過","緊握機車把手","減速慢行"],"answer":1},{"id":693,"q":"機車行駛一般道路時，除擬超越同一車道前車外，後車與前車之間應保持多少距離？","options":["隨時可以煞停","1 個車身","2 個車身"],"answer":1},{"id":694,"q":"騎乘機車行經路邊攤販、招牌、大型障礙物或停放之汽車時，應","options":["減速慢行","保持適當距離","以上皆是"],"answer":3},{"id":695,"q":"騎乘機車至山區道路發現山壁已有落石","options":["停止前進或改道","機車體積小、機動性高，可以閃避前進","戴全罩式安全帽者可繼續前進"],"answer":1},{"id":696,"q":"駕駛人在高速行駛狀況下，生理上對於緊急事件之處理","options":["反應較平常遲鈍，應變能力減退","和平常狀況相同","較平常狀況，應變能力加強"],"answer":1},{"id":697,"q":"在深夜郊區道路上空曠無車，騎乘機車","options":["可以超速行車","仍應按照速限行駛","在安全限度內稍微超速行駛，但不宜太快"],"answer":2},{"id":698,"q":"排檔機車行進時，拉離合器拉桿：","options":["車輛會慣性滑行","車輪空滑","以上皆是"],"answer":3},{"id":750,"q":"機車行駛彎路時，關於安全駕駛之操作方式，下列敘述何者正確？","options":["應於進入彎道前充分減速，並於彎道中保持穩定速度通過","彎道中若發現車速過快，應壓低車身即可，不必減速","通過彎道期間時應持續輕含煞車，以便隨時控制車速應變突發狀況"],"answer":1},{"id":751,"q":"機車行駛時應保持隨時可以煞停之安全距離，其距離判斷，下列何者正確？","options":["與前車保持適當的距離，以能隨時煞停為準","與前車保持一個輪胎之距離","與前車保持一個車身長度"],"answer":1},{"id":752,"q":"在同向三車道的道路上，如無標誌或標線規定者，大型重型機車以外的機車如何行駛?","options":["應行駛於最外側二車道","應行駛於最內側快車道","可以隨意行駛任一車道"],"answer":1},{"id":753,"q":"在雙向二車道道路，對面有來車交會時，應採何種方式超車？","options":["應加速超車","不得超車","依據來車車種決定是否超車"],"answer":2},{"id":754,"q":"於設有行車分向線之雙向二車道超車時，滯留對向車道時間與肇事危險機率是否有關？","options":["無關","滯留時間越久，肇事危險的機率越大","滯留時間越久，肇事危險的機率越小"],"answer":2},{"id":755,"q":"在平坦筆直路段，雖劃有雙實黃線，但遇對向車道無來車時，可否超車？","options":["仍不可跨越或駛入對向車道超車","只要注意安全，仍可暫時駛入對向車道超車","可超車，但必須加速通過"],"answer":1},{"id":756,"q":"後車跟隨前車行駛時，應如何保持最小安全跟車距離？","options":["應大於停車距離","應小於停車距離","不一定，但是與停車距離無關"],"answer":1},{"id":757,"q":"關於機車行駛時防止追撞前車之措施，下列敘述何者正確？","options":["保持適當安全跟車距離與車速是防止追撞前車最有效的措施","隨時注意前車煞車燈號變化，較保持安全距離更能有效防止追撞","機車煞車性能良好者，得縮短跟車距離以提升道路通行效率"],"answer":1},{"id":758,"q":"機車駕駛人行進間應隨時注意後照鏡（例如每隔 5 秒），且不得長時間（例如超過 2 秒）盯住前方或單一目標。此敘述：","options":["正確","錯誤","只需看左後鏡即可"],"answer":1},{"id":759,"q":"機車行駛於劃有分向限制線（雙黃實線）之路段，關於跨越該標線之規定，下列敘述何者正確？","options":["分向限制線禁止車輛跨越，不得駛入對向車道","確認對向車道無來車且安全無虞時，得暫時跨越進行超車","前方同向車輛行駛緩慢或暫停時，得跨越至對向車道繞行通過"],"answer":1},{"id":760,"q":"機車在行駛中遇有障礙物時，應與障礙物保持最少的橫向安全距離間隔？","options":["30 公分","40 公分","50 公分"],"answer":3},{"id":761,"q":"機車行駛於劃設行車分向線之雙向道路，關於行駛位置之敘述，下列何者正確？","options":["為便利後方汽車超越，機車應盡量靠車道右側路緣行駛","機車應保持於所行駛車道之中央位置行駛","機車車身較窄，可於同一車道內左右變換位置以保持靈活"],"answer":2},{"id":762,"q":"機車行駛於已劃分快慢車道之道路，應在","options":["只能在慢車道行駛","最外側快車道及慢車道行駛","所有快車道及慢車道都可以行駛"],"answer":2},{"id":763,"q":"未設立標誌或標線規定機車行駛車道時，普通重型機車不得行駛於以下哪一個車道？","options":["最外側車道（由外側算起）","第二車道（由外側算起）","最內側車道"],"answer":3},{"id":764,"q":"行駛於未劃設分向限制線或行車分向線之道路，與對向來車交會時，下列何種駕駛行為正確？","options":["道路寬度足夠兩車通行時，得維持原速通過以保持車流順暢","無論道路寬度或路況條件，均應減速慢行","若對向來車已減速禮讓，本車得維持原速優先通過"],"answer":2},{"id":765,"q":"跟隨前車行駛時，前後兩車之距離應如何保持？","options":["應保持固定一個車身距離","應保持隨時可煞停之安全距離","緊跟前車以免被其他車輛超越"],"answer":2},{"id":766,"q":"欲超越前車時，下列駕駛行為何者正確？","options":["應由右方加速超車","應由左方超車","左右方皆可超車"],"answer":2},{"id":767,"q":"車輛與對向車輛交會時，相互之間應離多少距離較為安全？","options":["30 公分以上","50 公分以上","緊貼邊緣即可"],"answer":2},{"id":768,"q":"機車行駛時，與左右相鄰車輛之間應保持多少公分以上間隔？","options":["20 公分","30 公分","50 公分"],"answer":3},{"id":769,"q":"關於分向限制線（雙黃實線）之交通規範，下列敘述何者錯誤？","options":["車輛不得跨越雙黃實線超車","車輛不得於雙黃實線路段迴轉","對向車道淨空無來車時，得暫時跨越雙黃實線行駛"],"answer":3},{"id":770,"q":"機車行駛於劃設雙黃實線之雙向二車道公路，關於超車之規定，下列敘述何者正確？","options":["前車速度明顯低於速限且妨礙交通時，得跨越雙黃實線超車","確認對向車道淨空且能於安全距離內完成時，得暫時跨越雙黃實線超車","雙黃實線路段禁止超車，不得跨越或駛入對向車道超車"],"answer":3},{"id":771,"q":"在道路上劃設有黃色虛線，欲超越前車應？","options":["由前方車輛左側超越","由前方車輛右側超越","視情況而由左側或右側超越"],"answer":1},{"id":772,"q":"避免碰撞發生的準則，下列何者適當？","options":["不論車速多少，與前車均保持 1 個車身距離","與前車應保持安全跟車距離","與前車保持速度一致"],"answer":2},{"id":773,"q":"關於行車安全距離與變換車道之觀念，下列敘述何者正確？","options":["跟車過近、任意變換車道及搶道轉彎皆為常見肇事主因，駕駛人應隨時保持安全距離並避免任意變換車道","保持安全距離主要適用於高速公路及快速道路，一般市區道路因車速較慢，可縮短跟車距離以維持車流順暢","駕駛技術純熟者可依經驗判斷適當跟車距離，不受安全距離規範之限制"],"answer":1},{"id":774,"q":"騎乘機車行駛時，應與路邊停放之車輛保持多少安全間隔，以避免突發狀況（如車門開啟）？","options":["保持隨時可煞停的距離","至少 1 公尺（約 1 個車門）以上","50 公分以上"],"answer":2},{"id":775,"q":"機車駕駛人行經交叉路口、彎道或遇有視線不良之處時，應如何行駛？","options":["應減速慢行，並隨時注意路況與左右來車，確保行車安全","應加速通過，避免在路口或彎道處逗留","只要保持原速，專注於前方視野，不必注意兩側動態"],"answer":1},{"id":776,"q":"機車在未劃設車道線、行車分向線或分向限制線的道路上，行車時速應為多少？","options":["不得超過 30 公里","不得超過 40 公里","不得超過 50 公里"],"answer":1},{"id":777,"q":"機車行駛於「已劃分快慢車道分隔線」之道路，行駛於慢車道，在未設有道路速限路段，此時最高行車時速限制為何？","options":["不得超過 30 公里","不得超過 40 公里","不得超過 50 公里"],"answer":2},{"id":778,"q":"機車行駛於未設有速限標誌或標線之一般道路時，其最高行車時速為多少？","options":["不得超過 40 公里","不得超過 50 公里","不得超過 60 公里"],"answer":2},{"id":779,"q":"夜間行駛，應使用燈光，如市區照明清楚時，","options":["戴有色眼鏡","使用遠光燈","使用近光燈"],"answer":3},{"id":780,"q":"變換車道時，為預防因自己的駕駛死角而發生危險，應","options":["提前顯示方向燈，觀看照後鏡並擺頭察看","緊盯前方注意路況","與前方車輛保持安全距離"],"answer":1},{"id":781,"q":"夜間行車遙見對向有來車時應：","options":["使用遠光燈及大鳴喇叭警告來車，並加速前進","立即就地停車，並熄滅全部燈光，以待來車通過","使用近光燈，並減速交會"],"answer":3},{"id":782,"q":"夜間跟隨他車行駛之車輛：","options":["用近光燈","用遠光燈","不必開燈"],"answer":1},{"id":783,"q":"機車在隧道內行駛時：","options":["不得開燈","應開燈快行","應開燈慢行"],"answer":3},{"id":784,"q":"在紅燈亮時，行人穿越道上無人穿越，且交叉路口車輛不擁擠時：","options":["可以向前行駛","可以右轉行駛","禁止行駛"],"answer":3},{"id":785,"q":"夜間會車時應","options":["使用近光燈","使用遠光燈","無規定"],"answer":1},{"id":786,"q":"機車夜間在照明清楚之市區行駛","options":["使用近光燈","可用遠光燈","可以關燈"],"answer":1},{"id":787,"q":"下列何者並非機車行駛時應開亮頭燈之情形？","options":["夜間或行經隧道","遇濃霧、雨、雪、天色昏暗或視線不清時","行經市區道路"],"answer":3},{"id":788,"q":"機車之車燈","options":["不可噴色","不可黏貼膠紙","以上皆是"],"answer":3},{"id":789,"q":"使用燈光規定下列何者不正確？","options":["夜間應開亮頭燈","行經隧道、調撥車道應開亮頭燈","天色昏暗或視線不清時，得使用霧燈"],"answer":3},{"id":790,"q":"夜間行車交會，來車不變換近光燈時應如何處置?","options":["以眼還眼，也用遠光燈報復","不和對方一般見識，以近光燈減速行駛","按喇叭警告"],"answer":2},{"id":791,"q":"機車行駛於最外側車道要進入待轉區時，方向燈的使用方式何者正確？","options":["需打右轉方向燈","需打左轉方向燈","無須打方向燈"],"answer":3},{"id":793,"q":"機車駕駛人行駛至交叉路口，右轉彎之操作順序，下列何者為正確?","options":["檢查照後鏡→打方向燈→確認安全→換入外側車道、右轉車道或慢車道，駛至路口後再行右轉","打方向燈→檢查照後鏡→確認安全→換入外側車道、右轉車道或慢車道，駛至路口後再行右轉","打方向燈→換入外側車道、右轉車道或慢車道，駛至路口後再行右轉→檢查照後鏡→確認安全"],"answer":2},{"id":794,"q":"為增加車輛辨識度，機車駕駛人行駛於道路時，頭燈於何時開啟？","options":["僅在夜間、隧道或視線不良時應開啟","僅行經郊區或山區道路時應開啟","全日均可開啟（白天可開啟頭燈或日間行車燈）"],"answer":3},{"id":795,"q":"雖然是白天，有濃霧時，應如何使用燈號？","options":["僅需開霧燈","應開啟頭燈及霧燈","僅需開頭燈"],"answer":2},{"id":796,"q":"為免對向車輛駕駛人目眩，夜間會車時，機車駕駛人應如何使用燈光？","options":["使用近光燈","使用遠光燈","交互使用遠光燈和近光燈"],"answer":1},{"id":797,"q":"機車夜間跟車行駛於照明不足之道路時，關於燈光使用方式，下列敘述何者正確？","options":["應開啟頭燈並使用近光燈，以利辨識前方路況並避免影響前車駕駛人視線","應開啟遠光燈以獲得較遠照明範圍，確保充分掌握前方道路狀況","跟隨前車行駛時可借助前車燈光照明，僅需開啟定位燈標示車輛位置即可"],"answer":1},{"id":798,"q":"機車於夜間或視線不清之路段臨時停車時，關於燈光顯示之規定，下列敘述何者正確？","options":["停放於路燈照明範圍內或有反光設施處，得免開啟停車燈光","應顯示停車燈光或反光標示，以利其他用路人辨識","已放置車輛故障標誌或反光三角牌者，得免開啟停車燈光"],"answer":2},{"id":799,"q":"依道路交通安全規則，除夜間外，車輛行經下列何種情況時應開啟頭燈？","options":["僅於無照明設施之隧道或涵洞時須開啟頭燈，有照明設施者得免開燈","行經隧道、涵洞、調撥車道或遇濃霧、大雨致視線不清時，應開啟頭燈","行經設有完善照明之地下道時，因環境亮度充足，得免開啟頭燈"],"answer":2},{"id":800,"q":"機車駕駛人，警員現場攔查舉發不依規定使用燈光者，將會有何種處罰？","options":["僅處以罰鍰","處以罰鍰加記違規點數","吊扣駕駛執照"],"answer":2},{"id":801,"q":"機車於路邊停車起駛時，駕駛人應如何處置？","options":["因速度慢，不須顯示方向燈","應顯示方向燈，並注意前後左右來車，確認安全後始得起駛","應顯示方向燈即可起駛"],"answer":2},{"id":802,"q":"夜間騎乘機車，下列何種行為最能提高行車安全？","options":["開啟遠光燈以獲得最佳照明","穿著淺色或反光衣物，並確認車燈及反光裝置功能正常","夜間車少，可加快車速以縮短行駛時間"],"answer":2},{"id":803,"q":"電動機車起步時，駕駛人應特別注意下列何項特性？","options":["起步加速較慢，需多催油門","扭力輸出直接快速，應謹慎控制電門","需預熱引擎後才能起步"],"answer":2},{"id":804,"q":"騎乘電動機車行經住宅區巷弄時，下列何種做法最為適當？","options":["因車輛安靜，可快速通過以減少干擾","應減速慢行並提高警覺，因行人可能未察覺車輛接近","持續按喇叭提醒行人注意後快速通過"],"answer":2}],"car":[{"id":4,"q":"當開車進入國道施工路段時，最能有效預防事故發生？","options":["在施工縮減車道處加速超車","開啟駕駛輔助系統後便放心地看手機","提早變換至未施工車道，並保持隨時準備煞車的安全距離與專注力"],"answer":3},{"id":5,"q":"駕駛配備有 Level 2 等級先進駕駛輔助系統(ADAS)的新車行駛於國道，下列哪一項最符合安全規範？","options":["認知到目前的系統對靜止工程車辨識有限制，行經施工路段時應主動介入駕駛，而非依賴系統","系統會自動跟車與修正方向盤，可以趁機滑手機或閉目養神","因為系統能辨識車道線，所以行駛於大雨或大霧路段時，交給電腦操作比人工駕駛更安全"],"answer":1},{"id":6,"q":"下列關於變換車道的行為，何者錯誤？","options":["變換車道時，應讓直行車先行，並注意安全距離","在雙白實線上可雙邊變換車道","顯示方向燈、轉頭察看照後鏡、檢查視野死角並注意有無障礙或車輛行人"],"answer":2},{"id":7,"q":"駕駛人行駛至交岔路口，其行進、轉彎時，下列規定何者正確？","options":["由慢車道右轉彎時應於距交岔路口 20 至 40 公尺處，換入慢車道","右轉彎時，應距交岔路口 50 公尺前顯示方向燈","於外側車道右轉彎時，應距交岔路口 30 公尺前顯示方向燈"],"answer":3},{"id":8,"q":"汽車行駛中變換車道時，若未依規定全程顯示方向燈，其規定為何？","options":["不論一般道路或高速公路，均屬違規行為，應依法裁罰","行駛於高速公路時，才屬違規行為","只要確認後方無來車，未顯示方向燈亦不具罰責"],"answer":1},{"id":9,"q":"汽車在同向二車道以上之道路，除應依標誌或標線之指示行駛外，下列何種行為正確？","options":["變換車道時，應讓直行車先行並注意安全距離","小型汽車行駛速度較慢時，應在外側車道行駛，但可任意變換車道","執行任務中之救護車，應行駛內側車道"],"answer":1},{"id":10,"q":"汽車駕駛人於車流中利用空隙頻繁變換車道超車，下列何者正確？","options":["屬合理駕駛行為","未影響他人可接受","不得任意以迫近，驟然變換車道或其他不當方式，迫使他車讓道"],"answer":3},{"id":11,"q":"汽車駕駛人行駛於高速公路、快速公路，以變換燈光、連續密集按鳴喇叭迫使前車讓道，下列何者正確？","options":["提醒前車讓路並無違規","處新臺幣 3,000 元以上 6,000 元以下罰鍰","只要未發生事故不處罰"],"answer":2},{"id":12,"q":"關於車輛配置之先進駕駛輔助系統(ADAS)，如自動車距保持系統(ACC)、車道維持輔助系統(LKA)，下列敘述何者正確？","options":["開啟系統後，駕駛人可以滑手機或短暫閉眼休息","系統能辨識前方靜止障礙物，不必擔心追撞","屬輔助功能，駕駛人應隨時注意前方路況，並雙手握持方向盤主動監控"],"answer":3},{"id":13,"q":"汽車駕駛人在道路上任意以迫近、驟然變換車道方式迫使他車讓道：","options":["有顯示方向燈即為正當行為","屬於不當駕駛行為","只要不發生事故即可"],"answer":2},{"id":14,"q":"汽車駕駛人行經路口，遇有交通警察指揮與燈號顯示不一致時，應如何行駛？","options":["以燈號顯示為準","聽從交通警察指揮行駛","視當時交通狀況，跟隨前車行駛"],"answer":2},{"id":15,"q":"曾因酒駕經吊銷駕駛執照，於重新考照後，必須加裝何種設備於車上始得行駛？","options":["行車紀錄器","車用滅火器","車輛點火自動鎖定裝置(酒精鎖)"],"answer":3},{"id":16,"q":"完成酒駕防制教育或酒癮治療並經考驗合格後，拿到的駕照僅能開裝設有酒精鎖之汽車且強制使用時間為？","options":["半年","1 年","3 年"],"answer":2},{"id":17,"q":"關於酒駕之規定，下列何者正確？","options":["酒測值標準是吐氣所含酒精濃度達每公升 0.25 毫克或血液中酒精濃度達 0.10%以上","12 年內再犯酒駕，處新臺幣 120,000 元罰鍰","酒駕拒測處新臺幣 180,000 元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照"],"answer":3},{"id":18,"q":"汽車駕駛人經測試檢定吐氣所含酒精濃度達每公升 0.25 毫克或血液中酒精濃度達 0.05%以上，18 歲以上未滿 70 歲之同車乘客，倘無特殊原因，下列敘述何者正確？","options":["同車乘客應受處罰","同車乘客無處罰機制","同車乘客只要無飲酒即無須受處罰"],"answer":1},{"id":19,"q":"汽車駕駛人飲酒後已間隔一段時間，自認酒精已代謝且無不適，下列何者正確？","options":["可依自身感覺駕駛","只要身體未出現不適，即可駕駛","喝酒後不得駕車"],"answer":3},{"id":20,"q":"汽車駕駛人酒後駕車初犯，酒精濃度測試超過法規標準，下列何者正確？","options":["處新臺幣 1 萬 5 千至 9 萬元罰鍰","處新臺幣 3 萬元至 12 萬元罰鍰，並吊扣駕照","僅警告"],"answer":2},{"id":21,"q":"汽車駕駛人 10 年內第 3 次以上酒駕，下列何者正確？","options":["僅增加罰鍰","按前次處罰鍰金額加罰新臺幣 9 萬元並吊銷駕照，公布其姓名","僅記違規點數"],"answer":2},{"id":22,"q":"若駕駛人遭遇警察攔檢並明確表示拒絕接受酒精濃度測試，其初次違規的處罰為何？","options":["視酒精濃度決定罰鍰金額高低，當場移置保管該汽機車及吊扣其駕駛執照，接受道路交通安全講習","處新臺幣 9 萬元罰鍰，當場移置保管該汽機車及吊銷其駕駛執照，接受道路交通安全講習","處新臺幣 18 萬元罰鍰，當場移置保管該汽機車及吊銷其駕駛執照，接受道路交通安全講習"],"answer":3},{"id":23,"q":"關於酒駕累犯的加重處罰規定，若駕駛人在幾年內第二次違反酒駕規定，將被視為累犯並處以最高額罰鍰，且其後每次違規都會按次加罰 9 萬元？","options":["5 年內","10 年內","終身計算，無期限限制"],"answer":2},{"id":24,"q":"關於代駕服務的觀念，下列哪一項敘述最能正確體現安全保障？","options":["若叫不到代駕，可以先休息一下再慢慢開車回家","代駕只需負責把車開走，乘客不需在意代駕是否有專業執照","代駕服務雖然需付費，但比起酒駕產生的罰鍰、刑事責任與人命損失，是成本最低的選擇"],"answer":3},{"id":25,"q":"汽車駕駛人有酒駕毒駕之情形，除處罰鍰及吊扣銷駕照處分外，所駕駛之該車輛尚須？","options":["該車汽車所有人如非駕駛人，須接受口頭警告並參加講習","吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照","吊銷該汽機車牌照六個月，並於移置保管時，扣繳其牌照"],"answer":2},{"id":26,"q":"關於汽機車駕駛人酒測值超標時，針對同車乘客之連坐處分，下列何種情況免予處罰？","options":["乘客聲稱並不知道駕駛人有飲酒者","乘客為未滿 18 歲、或年滿 70 歲者","乘客與駕駛人並無親屬關係者"],"answer":2},{"id":27,"q":"駕駛人酒精濃度超過規定標準，駕車肇事致人重傷或死亡者，除依刑法處置外，其行政處分為何？","options":["吊扣駕駛執照 2 年，並參加道路交通安全講習","吊銷駕駛執照，並 3 年內不得考領","吊銷駕駛執照，並終身不得再考領"],"answer":3},{"id":28,"q":"汽車駕駛人酒精濃度超過規定標準，且同車附載未滿 12 歲兒童，依規定其處罰為何？","options":["處新臺幣 3 萬元以上至 12 萬元以下罰鍰，並吊扣其駕駛執照 2 年至 4 年","處新臺幣 3 萬元以上至 12 萬元以下罰鍰，並吊扣其駕駛執照 1 年至 2 年","處最高新臺幣 12 萬元罰鍰並吊銷駕駛執照"],"answer":1},{"id":29,"q":"若駕駛人拒絕接受酒精濃度測試檢定，依現行法規應處以：","options":["新臺幣 18 萬元罰鍰，且當場移置保管該車及吊銷駕照","新臺幣 6 萬元罰鍰及吊扣汽車牌照 6 個月","新臺幣 9 萬元罰鍰，並記違規點數 3 點"],"answer":1},{"id":30,"q":"酒駕防制教育訓練課程總時數共：","options":["10 小時","12 小時","15 小時"],"answer":3},{"id":31,"q":"汽車駕駛人申請參加酒駕防制教育訓練之費用由誰負擔？","options":["汽車駕駛人","衛生福利部","訓練辦理機關"],"answer":1},{"id":32,"q":"駕駛他人車輛酒駕違規是否須受吊扣牌照處分？","options":["仍須吊扣牌照","只要不是自己的車就不用吊扣","無特別規定"],"answer":1},{"id":33,"q":"汽車駕駛人於幾年內第 2 次違反酒精濃度超過規定標準規定，依其駕駛車輛所定罰鍰最高額處罰之？","options":["5 年","10 年","15 年"],"answer":2},{"id":34,"q":"汽車所有人明知駕駛人有酒精濃度超過規定標準、吸食毒品等情形而不予禁止駕駛者，除處罰鍰外，將對該汽車採取何種處分？","options":["吊扣該汽車牌照 6 個月","吊扣該汽車牌照 1 年","吊扣該汽車牌照 2 年"],"answer":3},{"id":35,"q":"汽車駕駛人酒後駕車經抽血檢測，血液中酒精濃度超過 0.05%，下列何者為錯誤？","options":["同車年滿 18 歲乘客應受罰鍰","同車年逾 70 歲或公車乘客不必受罰","只有汽車駕駛人受罰"],"answer":3},{"id":36,"q":"裝設酒精鎖之車輛，駕駛人啟動前須符合何種條件？","options":["插入鑰匙即可啟動","吐氣酒精濃度檢測為 0","經車主同意"],"answer":2},{"id":37,"q":"汽車駕駛人行車時，遇前方道路壅塞情況下應？","options":["緊貼前車，避免後車超車","與前車維持適當安全距離，依序前進","於車流間蛇行穿梭"],"answer":2},{"id":38,"q":"汽車駕駛人在道路上蛇行，或以其他危險方式駕車，下列處罰何者正確？","options":["處以罰鍰，並不禁止其駕駛","處以罰鍰，因而肇事者，並吊銷其駕駛執照，當場禁止駕駛","處以罰鍰，並吊銷其駕駛執照"],"answer":2},{"id":40,"q":"汽車駕駛人於行駛道路時，手持香菸、吸食、點燃，有影響他人安全者，下列何者正確？","options":["個人嗜好不處罰","違反道路交通管理處罰條例處新臺幣 1,200 元罰鍰","屬於違反環保法規問題"],"answer":2},{"id":41,"q":"關於汽車裝載貨物之規定，下列何者屬於不當行為且會受罰？","options":["裝載貨物綑紮牢固，堆置穩妥","裝載貨物超過規定的長度、寬度、高度，或未覆蓋嚴密致散落物掉落路面","裝載物品重量未超過核定總重量"],"answer":2},{"id":42,"q":"汽車駕駛人拒絕接受酒精濃度測試檢定者，應處罰鍰新臺幣多少？","options":["6 萬元","9 萬元","18 萬元"],"answer":3},{"id":43,"q":"關於路側劃設之紅色實線，其禁止臨時停車之時間原則為何？","options":["僅限於每日上午 7 時至晚間 8 時","除另有規定外，原則上為全天 24 小時","僅限於夜間時段以維護交通安全"],"answer":2},{"id":44,"q":"駕駛人酒精濃度超過規定標準，駕車肇事致人重傷或死亡者，其處分為何？","options":["吊銷駕駛執照，1 年內不得考領","吊銷駕駛執照，2 年內不得考領","吊銷駕駛執照，終身不得再考領"],"answer":3},{"id":45,"q":"汽車行駛下長坡時，正確的駕駛方式為何？","options":["儘量使用腳煞車控制速度","完全不使用任何煞車，讓車輛自然滑行","善用低速檔引擎煞車，避免過度使用腳煞車"],"answer":3},{"id":46,"q":"下列哪一項敘述是錯誤的？","options":["設有禁止停車之標誌路段，可以臨時停車","設有禁止停車之標誌路段，不可以臨時停車","設有禁止停車之標線路段，如無其他標誌標線規定，夜間 8 時以後至隔日清晨 7 時以前可以停車臨時停車"],"answer":2},{"id":47,"q":"汽車駕駛人於 10 年內第 2 次違反酒駕規定，其罰鍰金額為新臺幣？","options":["6 萬元","9 萬元","12 萬元"],"answer":3},{"id":48,"q":"汽車駕駛人連續駕車超過 8 小時，如應歸責於汽車所有人者，應受到何種處分？","options":["吊銷汽車牌照","吊扣汽車牌照 3 個月","罰鍰 3 萬元"],"answer":2},{"id":49,"q":"在設有禁止停車標誌、標線的路段，停車規定為何？","options":["禁止臨時停車","可以臨時停車","可以停車"],"answer":2},{"id":50,"q":"小型車在設有彎道、狹路、坡路、單行道標誌之路段，因讓車、停車或起駛有必要者，是否可以倒車？","options":["可以","不可以","須有人在車後指引才可以"],"answer":1},{"id":51,"q":"汽車駕駛人將駕照借供他人駕車者，應處罰：","options":["吊扣其駕照","吊銷其駕照","吊扣其車輛牌照"],"answer":1},{"id":52,"q":"汽車駕駛人在 1 年內違規記點每達 12 點者，除施以道安講習，並處：","options":["吊銷駕照","罰鍰","吊扣駕照"],"answer":3},{"id":53,"q":"汽車駕駛人酒精濃度超過規定標準者，處新臺幣多少元罰鍰？","options":["1,200 元~2,400 元","6,000 元~1 萬 2,000 元","3 萬元~12 萬元"],"answer":3},{"id":54,"q":"在設有彎道、坡路、狹路、狹橋、隧道標誌之路段或鐵路平交道可否迴車？","options":["可以","不可以","無特別規定"],"answer":2},{"id":56,"q":"汽車駕駛人行駛道路下列何者為對？","options":["遇有急事要聯絡，可以使用行動電話","以手持方式使用行動電話等裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為，均為禁止之行為","只要不妨礙他人安寧都可以使用撥接通話"],"answer":2},{"id":57,"q":"關於汽車載人規定，下列何者正確？","options":["車廂外可視情況載人","只要車速低即可於車外載人","汽車車廂以外不得載人"],"answer":3},{"id":58,"q":"小型汽車在同向二車道以上道路行駛時，下列何者敘述正確？","options":["內外側車道均可行駛","行駛速度較慢時，應靠內側車道行駛","可任意變換車道"],"answer":1},{"id":61,"q":"汽車行駛時，駕駛人對於視線範圍內顯示設備之使用，下列何者正確？","options":["行車時可使用車內影音設備，只要關閉聲音即可","娛樂性顯示設備應關閉，但導航或倒車影像等行車輔助顯示可使用","所有顯示設備均不得開啟"],"answer":2},{"id":62,"q":"汽車駕駛人吸食毒品、迷幻藥、麻醉藥品或酒類後駕駛汽車，下列何者錯誤？","options":["若因而肇事致人死亡者，處罰鍰並當場移置保管車輛、吊銷駕駛執照，終身不得再考領","僅處罰鍰","處罰鍰並當場移置保管車輛、吊扣駕照"],"answer":2},{"id":63,"q":"駕駛人將車輛駛入加油站準備加油，下列做法何者正確？","options":["熄火並關閉電氣設備，加油全程不使用行動電話，加油完畢後再啟動引擎駛離","加油時間短暫，可維持引擎怠速運轉並開啟空調","加油過程中為節省時間，可在車內使用打火機點菸或檢查行李廂內物品"],"answer":1},{"id":64,"q":"駕駛人行車中發現後座孩童將手伸出車窗外，下列做法何者正確？","options":["車速不快且路旁無來車時，短暫伸出並無大礙，提醒孩童注意即可","行駛中乘客不得將頭手伸出車外，駕駛人應立即制止並關閉車窗或開啟車窗安全鎖","乘客自身行為由乘客負責，駕駛人專心駕駛不宜分心處理"],"answer":2},{"id":66,"q":"在行車途中，精神疲勞稍有睡意，你應該怎麼辦：","options":["提起精神，並減速慢行","擦抹或服食藥物助長精神，照常行駛","在最近適當路邊停車，下車稍作休息，恢復精神再開車"],"answer":3},{"id":67,"q":"行駛市區道路時，後方有消防車鳴笛駛近，而駕駛人恰好與消防車同方向同路線，下列做法何者正確？","options":["跟隨消防車行駛可通過壅塞路段，只要保持安全距離即可","應靠右讓路待消防車通過後，依正常速限行駛，不得尾隨急駛","消防車通過後路面已無障礙，應加速跟上以儘快通過該路段避免回堵"],"answer":2},{"id":68,"q":"駕駛人赴宴飲酒後，自覺僅喝了一點且頭腦清醒，下列觀念何者正確？","options":["飲酒後即使自覺清醒，酒精仍會影響反應與判斷能力，應改搭計程車或代駕","經同行友人觀察確認並無異狀，且自覺意識清楚，可自行駕車返家","先在車內休息 30 分鐘待酒精消退後，即可安全駕車上路"],"answer":1},{"id":69,"q":"依道路交通安全規則規定，下列何者不得參加汽車駕駛執照考驗？","options":["已戒除酒癮並取得醫師證明、體檢合格者","酒精、麻醉藥品、鴉片類或其代用品成癮者","曾因酒後駕車被吊銷駕照，禁考期間已屆滿者"],"answer":2},{"id":70,"q":"汽機車駕駛人酒後駕車，其吐氣酒精濃度超過規定標準但未涉刑事處罰者，應處：","options":["移送法院依刑法判刑","罰鍰並當場移置保管該汽車及吊扣其駕駛執照 1 至 2 年、吊扣牌照 2 年","吊銷駕駛執照"],"answer":2},{"id":71,"q":"汽車駕駛人，行車速度超過規定之最高時速 40 公里以上者，處罰鍰新臺幣：","options":["1,200～2,400 元","2,400～6,000 元","6,000～36,000 元"],"answer":3},{"id":72,"q":"酒醉駕車或行經行人穿越道不讓行人優先通行因而致人傷亡，如應負刑責者：","options":["加重其刑至二分之一","不須處罰","仍按原來刑度處罰"],"answer":1},{"id":73,"q":"汽車駕駛人於行駛道路時，以手持方式使用行動電話等裝置進行撥接、通話等有礙駕駛安全之行為者，處罰鍰新臺幣：","options":["3,000 元","2,000 元","1,000 元"],"answer":1},{"id":79,"q":"汽車駕駛人無照駕駛或酒醉駕車因而致人受傷或死亡，依法應負刑事責任者，加重其刑至：","options":["三分之一","二分之一","一倍"],"answer":2},{"id":84,"q":"酒後開車，對駕駛人會產生視覺之隧道效應，故酒後駕車：","options":["視野不變","視野變廣","視野變窄"],"answer":3},{"id":85,"q":"汽車駕駛人經測試檢定，其吐氣所含酒精濃度不得達每公升：","options":["0.15 毫克","0.25 毫克","0.55 毫克"],"answer":1},{"id":86,"q":"小客車附載幼童未依規定安置於安全椅者，應處駕駛人：","options":["吊扣駕駛執照","吊銷駕駛執照","罰鍰"],"answer":3},{"id":88,"q":"汽車駕駛人對幾歲以下或需要特別看護之兒童，單獨留置於車內者，處駕駛人新臺幣 3,000 元罰鍰，並施以 4 小時道路交通安全講習：","options":["4 歲","5 歲","6 歲"],"answer":3},{"id":89,"q":"汽車駕駛人行車速度，超過規定之最高時速多少公里以上者，處新臺幣 6,000～36,000 元罰鍰，並當場禁止其駕駛：","options":["40 公里","50 公里","60 公里"],"answer":1},{"id":90,"q":"汽車駕駛人駕駛營業大客車，因酒後駕駛應吊銷其駕駛執照，並：","options":["2 年內不得考領","3 年內不得考領","4 年內不得考領"],"answer":3},{"id":91,"q":"駕車於上坡路段使用二檔時，下坡應使用：","options":["四檔","三檔","二檔"],"answer":3},{"id":92,"q":"汽車下長坡時，最安全控制速度的方法，是使用：","options":["腳煞車","手煞車","低速檔適時配合引擎煞車"],"answer":3},{"id":93,"q":"下列敍述何者正確：","options":["駕駛人、前座及小型車後座乘客均應繫妥安全帶","起駛後才應顯示方向燈","兒童須乘坐於小客車之前座"],"answer":1},{"id":96,"q":"禁止臨時停車路段：","options":["禁止臨時停車，但可以停車","禁止停車，但可以臨時停車","不得臨時停車也不得停車"],"answer":3},{"id":98,"q":"汽車可停車路段，若無停車位時:","options":["可以併排停車","可任意併排停車","不得併排停車"],"answer":3},{"id":99,"q":"汽車行駛至設有禁止迴車標誌、禁止左轉標誌，劃有分向限制線、禁止超車線或禁止變換車道線之路段：","options":["不得迴車","可以倒車","無來車時可迴車"],"answer":1},{"id":100,"q":"汽車駕駛人拆除消音器造成噪音，處罰鍰、當場禁止其行駛、吊扣汽車牌照 6 個月，於 1 年內再犯者，處：","options":["吊銷駕照","吊扣駕照 1 個月","吊扣駕照 6 個月"],"answer":3},{"id":447,"q":"行經路口發現有攜帶白手杖或導盲犬之行人正在穿越道路時，應如何行駛？","options":["不論有無號誌，均應暫停讓其優先通過，並保持較寬之安全距離","繞過他們直接通過","靠近時按鳴喇叭提醒行人小心通過"],"answer":1},{"id":448,"q":"綠燈時，開車行經行人穿越道，若遇行人不依號誌擅自穿越，下列敘述何者錯誤？","options":["行人處新臺幣 500 元罰鍰","駕駛人若未停讓處新臺幣 1200 元罰鍰","若導致駕駛人來不及反應而發生車禍，行人仍有責任"],"answer":2},{"id":449,"q":"為消除 A 柱視野死角並落實行人優先，汽車轉彎行近行人穿越道前，最安全的作法是：","options":["減速後暫停並擺頭察看 A 柱後方是否有行人，確認無人始得通過","只要沒看到行人就直接轉彎","按鳴喇叭示警行人即直接轉彎"],"answer":1},{"id":450,"q":"所謂二段式開門方法，是：","options":["將車門分兩次開，不必確認前後方有無來車及行人","先打開車門少許，並確認前後方無來車及行人後再打開","以上皆是"],"answer":2},{"id":455,"q":"汽車駕駛人行至設有右轉彎專用車道的交岔路口，準備執行右轉，下列哪一項行為最符合法規並能體現主動停讓精神？","options":["若前方直行車道回堵，可以先占用右轉專用車道直行，再切回主線","應依規定進入右轉專用車道，並在轉彎時減速，並暫停讓行人穿越道線上的行人先行","只要右轉燈號亮起，轉彎車即擁有優先路權，不須理會已進入路口的行人"],"answer":2},{"id":456,"q":"大型車接近行人穿越道，行人尚未踏入但有通行意圖時，下列何者正確？","options":["行人未進入可先行通過","鳴喇叭提醒行人後再行通過","應減速並準備隨時停車，禮讓行人優先"],"answer":3},{"id":458,"q":"汽車駕駛人在路口看到綠燈亮起準備左轉，此時行人穿越道線上仍有行人正緩慢過馬路，下列行為何項正確？","options":["在行人前方約 3 公尺處停車，保持完全靜止直到行人通過","緩慢滑行靠近行人，趁行人過到分向線，可從行人後方加速穿越","只要行人還沒走進自己的行車路徑，就可以維持車速轉彎"],"answer":1},{"id":459,"q":"行經無號誌且未劃分支幹道的路口時，若汽車駕駛人要左轉，而對向有一輛右轉車同時要進入同一個車道，以下敘述何者正確？","options":["體積較大的車輛優先通行，體積小的應禮讓","左轉彎車應禮讓右轉彎車先行","右轉彎車應禮讓左轉彎車先行"],"answer":3},{"id":461,"q":"夜間遇到前方有行人穿越時，應該怎麼做？","options":["切換遠光燈提醒行人，減速確認安全後再通過","維持近光燈，減速確認安全後再通過","維持近光燈並保持速度通過"],"answer":2},{"id":462,"q":"汽車駕駛人在多車道路段行駛，準備在路口左轉，下列哪一種駕駛行為是錯誤且具有危險性？","options":["進入路口中心點處再行轉彎，不占用對向車道","從外側第二車道直接大迴轉或橫跨車道左轉","在設有左轉專用道時，提早切換進入專用道等候"],"answer":2},{"id":463,"q":"汽車駕駛人行至交岔路口，遇前車停等禮讓行人時，以下何者正確？","options":["自後方變換車道，繞過前車直接通過路口","猛按喇叭催促前車","依序停等，禮讓行人先通過"],"answer":3},{"id":464,"q":"汽車駕駛人，駕駛汽車行近行人穿越道或其他依法可供行人穿越之交岔路口，不暫停讓行人先行通過，因而肇事致人受傷者，處新臺幣 18,000～36,000 元罰鍰，且其駕駛執照：","options":["吊銷","吊扣 6 個月～1 年","吊扣 1～2 年"],"answer":3},{"id":465,"q":"汽車行經未劃設行人穿越道之交岔路口，遇有行人穿越時，應如何處理？","options":["按鳴喇叭示意行人快速通過","減速慢行，並視情況保持距離通過","無論有無交通指揮人員指揮或號誌指示，均應暫停讓行人優先通過"],"answer":3},{"id":466,"q":"行至路口遇閃光紅燈號誌時，駕駛人應：","options":["減速接近，確認安全後，小心通過","應先停止於停止線前，觀察左右無來車或行人後，方得起步","閃光紅燈與閃光黃燈路權相同，不須停讓"],"answer":2},{"id":468,"q":"汽車行近行人穿越道前，應如何落實停讓觀念？","options":["應減速慢行，遇有行人穿越時應暫停","若行人還在路邊等待，就儘速通過","當行人距離車輛一條車道寬時，可以不減速通過"],"answer":1},{"id":470,"q":"駕駛人行近行人穿越道未依規定停讓行人，導致行人受傷或死亡，其法律責任為何？","options":["須繳納罰鍰並參加講習","罰鍰並吊扣駕駛執照 1 至 2 年","罰鍰、吊扣或吊銷其駕駛執照，依法負刑事責任，並加重其刑至二分之一"],"answer":3},{"id":471,"q":"轉彎車行經路口遇有行人時，正確的防禦駕駛觀念是：","options":["減速先轉過去，再讓車頭前的行人先通過","暫停並確認 A 柱及照後鏡死角後，讓行人完全通過後再起步","按鳴喇叭，提醒行人注意來車"],"answer":2},{"id":474,"q":"接近設有行人穿越道的路口時，駕駛人應如何處置？","options":["行人尚未踏入穿越道即可加速通過","只要號誌綠燈即可通行","應減速並隨時準備停車讓行人優先"],"answer":3},{"id":477,"q":"防禦駕駛在路口最重要的觀念是？","options":["爭取優先路權","預測他人可能違規","速度越快越安全"],"answer":2},{"id":478,"q":"汽車準備右轉彎前，應於多少距離前換入最右側車道並顯示方向燈？","options":["10 公尺","30 公尺","到達路口再換"],"answer":2},{"id":481,"q":"在路口遇大型車輛右轉時，小型車應如何應對？","options":["從右側快速通過","靠近大型車行駛避免被插隊","行駛大型車後方並保持距離，避免進入內輪差範圍"],"answer":3},{"id":482,"q":"在無號誌、無標誌且路權相同的路口，兩車均為直行車且同時到達，應如何通行？","options":["先按鳴喇叭者優先","大型車優先通行","左方來車讓右方來車先行"],"answer":3},{"id":484,"q":"兩輛汽車從不同方向，同時抵達無號誌路口且進入路口行向車道數相同，關於通行的優先權，下列何者正確？","options":["左方為直行車，右方為轉彎車，左方車應讓右方車先行","兩車均為直行車，左方車應讓右方車先行","兩車均為直行車，右方車應讓左方車先行"],"answer":2},{"id":485,"q":"駕駛人在路口進行擺頭察看動作，其主要目的是：","options":["舒緩頸部疲勞","避免車輛 A 柱遮蔽視線所造成視覺死角，確認有無行人","讓警察知道我有看路，避免罰單"],"answer":2},{"id":486,"q":"接近路口時號誌由綠轉黃，最安全且合法的作法為何？","options":["加速通過路口避免紅燈","前輪如尚未通過停止線，停止通過路口","一律緊急煞車停車"],"answer":2},{"id":487,"q":"下列哪一種情形在交通法規中不屬於闖紅燈的定義？","options":["號誌剛轉為紅燈，仍加速穿越路口","紅燈亮起時，汽車穿越停止線至行人穿越道上停等","黃燈亮起時，車身已完全通過停止線"],"answer":3},{"id":488,"q":"汽車駕駛行經交岔路口遇紅燈亮起時，前輪通過停止線煞停在行人穿越道上，是否屬闖紅燈行為？","options":["只要沒有把車開過路口就不算","雖然前輪越過停止線，但只要停住就不算","視為闖紅燈"],"answer":3},{"id":493,"q":"號誌故障之路口，經現場依法令執行指揮交通之人員指揮前進時，其效力為何？","options":["指揮人員手勢優於號誌，聽從指揮前行合法","應以燈號顯示紅燈為準，否則視同闖紅燈","駕駛人應根據車流自行判斷，手勢僅具建議性質"],"answer":1},{"id":496,"q":"汽車行至無號誌路口，支線道車輛遇幹線道車輛時，其通行權規定下列何者正確？","options":["支線道車應禮讓幹線道車先行","視雙方車速而定，車速較快者先行","只要幹線道車輛尚遠，支線道車可直接通過路口"],"answer":1},{"id":499,"q":"在設有號誌路口，紅燈亮起時，直接右轉，係屬何種違規行為？","options":["屬闖紅燈行為","不屬闖紅燈行為，屬紅燈右轉行為","只要沒肇事就不屬闖紅燈行為"],"answer":1},{"id":504,"q":"汽車駕駛人行駛至交岔路口轉彎時應：","options":["多車道路口可以由外側車道直接左轉","左轉彎時，距交岔路口 30 公尺前顯示方向燈，換入內車道或左轉車道","多車道路口內側車道車輛，可以直接右轉"],"answer":2},{"id":507,"q":"當汽車行近行人穿越道，行人穿越道上已有行人通行，汽車應與行人保持多少距離才不違規？","options":["應至少保持 3 公尺之距離","應保持 1 公尺之安全避讓距離","只要車輛不與行人發生碰撞，並無特定距離限制"],"answer":1},{"id":509,"q":"關於閃光紅燈與閃光黃燈之區別，下列敘述何者正確？","options":["閃光紅燈表示車輛應停車再開；閃光黃燈表示車輛應減速接近，注意安全，小心通過","兩者皆只需放慢油門即可通過","閃光黃燈必須完全停止後再開；閃光紅燈則只需減速"],"answer":1},{"id":510,"q":"車輛行至無號誌之圓環路口時，關於通行優先順序，下列敘述何者正確？","options":["應依左方車讓右方車先行原則，右側欲進入圓環之車輛優先","應讓已在圓環內行駛之車輛先行，再依序駛入","由較寬或車流量較大道路駛來之車輛，優先進入圓環"],"answer":2},{"id":516,"q":"汽車行至無號誌路口，未劃分幹、支線道且車道數相同時，下列敘述何者錯誤？","options":["轉彎車應暫停讓直行車先行","同為直行車或轉彎車者，左方車應暫停讓右方車先行","優先進入路口之車輛先行"],"answer":3},{"id":521,"q":"行車管制號誌由綠燈轉為紅燈之前，會先顯示黃燈。關於黃燈之意義，下列何者正確？","options":["黃燈表示注意，車輛應減速慢行，可繼續通過路口","黃燈表示警告車輛駕駛人及行人，紅色燈號即將顯示，屆時將失去通行路權，已過停止線者應迅速通過，未過者應停等","黃燈為紅綠燈轉換之過場燈號，無法律上管制效力"],"answer":2},{"id":525,"q":"駕駛人行經路口時，發現交通指揮人員之手勢與行車管制號誌指示不一致，應如何遵行？","options":["以行車管制號誌為準，因號誌具有法律效力，手勢僅供參考","以交通指揮人員之手勢為準，指揮手勢優先於號誌指示","駕駛人得自行判斷路口狀況，擇一遵行即可"],"answer":2},{"id":533,"q":"駕駛人行經路口見路面繪有白色倒三角形讓路線標線，下列何種駕駛行為符合規定？","options":["須在標線前完全停車，確認安全後方可再行駛","應減速慢行，注意幹道來車動態，禮讓幹道車輛優先通行","標線僅提醒前方有路口，駕駛人可維持原速通過"],"answer":2},{"id":539,"q":"駕駛人行經無號誌路段之斑馬紋行人穿越道時，遇有行人正在穿越，應如何處置？","options":["減速並鳴按喇叭示警，提醒行人加速通過","暫停讓行人優先通過，不得強行搶道","行人應注意來車自行避讓，駕駛人可維持車速通過"],"answer":2},{"id":541,"q":"行車管制號誌顯示綠燈時，駕駛人應如何行駛？","options":["綠燈即享有絕對通行權，加速通過路口以避免號誌轉換","可以通行，但轉彎時仍應禮讓直行車及行進中之行人優先通過","綠燈僅表示建議通行，駕駛人仍須停車觀察後再起步"],"answer":2},{"id":557,"q":"汽車行至號誌故障而無交通指揮人員指揮之交岔路口：","options":["支線道車應讓幹線道車先行","幹線道車讓支線道車","可以不相讓"],"answer":1},{"id":563,"q":"汽車行經無號誌管制之交岔路口，比較安全的做法是：","options":["先看右，後看左","先看左，後看右","先看哪邊都無所謂"],"answer":2},{"id":583,"q":"設有劃分島劃分快慢車道之道路，大型車駕駛行駛時，其轉彎規定何者正確？","options":["慢車道可左轉、快車道亦可右轉，只需注意來車","慢車道不得左轉、快車道不得右轉，但有標誌、標線或號誌指示者從其規定","大型車可依車流狀況自行選擇轉彎方式"],"answer":2},{"id":584,"q":"有關汽車行至無號誌或號誌故障而無交通指揮人員指揮之交岔路口，下列敘述何者錯誤？","options":["支線道車應暫停讓幹線道車先行","未設標誌、標線或號誌劃分幹、支線道者，少線道車應暫停讓多線道車先行","同為直行車或轉彎車者，右方車應暫停讓左方車先行"],"answer":3},{"id":586,"q":"車輛轉彎時，下列何者不正確：","options":["汽車在同向二車道以上之道路，除準備左轉彎外，不得在內側車道行駛","設有左右轉彎專用車道之交岔路口，直行車不得占用轉彎專用車道","於無號誌管制路口且車道數相同時，轉彎車應暫停讓直行車先行"],"answer":1},{"id":588,"q":"汽車駕駛人於路口左轉時，未禮讓對向直行車先行，應受何種處罰？","options":["處罰鍰並吊扣牌照","處新臺幣 600～1,800 元罰鍰","處罰鍰並吊銷駕照"],"answer":2},{"id":589,"q":"車輛左右轉彎時，應先顯示車輛前後之左右邊方向燈光；變換車道時，應先顯示欲變換車道方向之燈光，何者正確？","options":["顯示之方向燈應為 5 秒鐘","顯示之方向燈光，應至完成轉彎或變換車道之行為","顯示之方向燈，只要有顯示即可"],"answer":2},{"id":590,"q":"以下何種車輛轉彎時，會造成內輪差：","options":["小型車","大型車","兩者皆會"],"answer":3},{"id":597,"q":"汽車行駛至無號誌交岔路口時，下列敘述何者正確？","options":["直行車應讓轉彎車先行","直行車尚未進入路口時轉彎車先行","對向轉彎車應讓直行車先行"],"answer":3},{"id":611,"q":"汽車行駛至交岔路口，右轉彎時，應先：","options":["顯示方向燈或手勢","變換車道","轉彎"],"answer":1},{"id":612,"q":"汽車向右轉彎時：","options":["應先顯示車輛前後之右邊方向燈","應先顯示車輛前後之左邊方向燈","右臂平伸向右表示向右轉彎"],"answer":1},{"id":614,"q":"在內側車道行駛之車輛，欲在交岔路口左轉彎時，應該：","options":["在交岔路口 30 公尺前顯示方向燈，行至交岔路口中心處左轉","行至交岔路口處即行左轉","顯示右方向燈左轉"],"answer":1},{"id":615,"q":"在設有彎道、坡路、狹橋、隧道標誌路段或鐵路平交道處：","options":["可以迴車","減速至 5 公里左右始可迴車","不得迴車"],"answer":3},{"id":617,"q":"車輛於交岔路口左轉，以下何者為錯：","options":["等左轉燈號亮才可左轉前進","等直行車通過後才可左轉前進","綠燈亮即可搶先左轉"],"answer":3},{"id":621,"q":"汽車行駛彎道時速度愈快，所產生的離心力：","options":["愈大","愈小","不變"],"answer":1},{"id":622,"q":"汽車轉彎或變換車道時，駕駛人要養成將頭左右擺動察看的習性，是因為要：","options":["察看前方來車","注意照後鏡的視野死角","避開擋風玻璃的反光"],"answer":2},{"id":623,"q":"當你開車停在路口，大型車停在你左前方準備右轉，下列何者最合理？","options":["轉彎車要禮讓直行車，所以應儘速通過","若看得到大型車後視鏡，即代表對方一定看得到你","應避免靠近其右側與轉彎內側範圍禮讓大型車先行右轉，避免陷入其內輪差與視野死角"],"answer":3},{"id":636,"q":"小型汽車跟隨大型車行駛時，應如何確保安全？","options":["貼近行駛以便超車","保持安全距離並注意前車動態","瞬間加速超車"],"answer":2},{"id":643,"q":"避免與大型車發生事故，以下何者為正確觀念？","options":["盡量靠近大型車行駛","避免進入死角並保持安全距離","從右側快速通過"],"answer":2},{"id":649,"q":"下列何者為大型車視野死角之正確意義？","options":["駕駛人透過照後鏡即可完全看見之範圍","駕駛人無法直接或間接觀察之區域","僅限車輛後方看不到之區域"],"answer":2},{"id":650,"q":"關於大型車視野死角，下列何者為錯誤觀念？","options":["死角可能存在於車輛側方","只要看見駕駛人即可確保被看見","死角範圍可能隨車型不同而改變"],"answer":2},{"id":652,"q":"在轉彎時發生車禍的原因為駕駛人：","options":["僅疏忽視野死角","僅疏忽內輪差","既疏忽視野死角也疏忽內輪差"],"answer":3},{"id":653,"q":"大型車輛通過時猶如唧筒吸走空氣，隨後會產生強大之吸力，故與大型車併行或會車時應：","options":["握緊方向盤","放鬆方向盤","左右晃動方向盤"],"answer":1},{"id":654,"q":"汽車轉彎時，軸距愈長則內外輪差也愈大，也就是所需路面的寬度也：","options":["愈小","愈大","不變"],"answer":2},{"id":692,"q":"行經積水路面時，若感覺車輛產生水漂現象(輪胎失去抓地力浮於水面)，應如何處置？","options":["立即用力踩下煞車，試圖增加阻力","握穩方向盤維持直線，並緩慢鬆開油門，切勿急踩煞車","大力踩下油門，衝出積水區"],"answer":2},{"id":693,"q":"行車時若發現輪胎突然爆胎，下列哪一種反應是錯誤的？","options":["緊握方向盤並維持直線行駛","應立即猛踩煞車，務求在最短距離內停下車輛","緩慢鬆開油門，並尋求安全地點靠邊停放"],"answer":2},{"id":694,"q":"汽車行駛於道路上時，保持安全距離，如遇前車突然減速或煞車時，此時最小安全跟車距離為？","options":["供駕駛人反應距離及煞車距離","供駕駛人反應距離","供駕駛人煞車距離"],"answer":1},{"id":695,"q":"汽車駕駛人駕駛車輛，行駛於道路時，應避免發生下列何種行為？","options":["與前車保持適當安全距離","注意車前狀況","任意變換車道"],"answer":3},{"id":696,"q":"汽車駕駛人於雨天行駛，遇地面濕滑且前方車輛行駛不穩時，應如何駕駛？","options":["加速超越前車","緊跟前車避免後方車輛超車","增加安全距離並隨時注意前方車輛"],"answer":3},{"id":697,"q":"汽車駕駛人決定是否超車時，最重要之判斷因素為何？","options":["車速是否較快","是否具備足夠安全距離與視線","是否能快速完成動作"],"answer":2},{"id":699,"q":"汽車行駛中，欲超越同一車道之前車時應顯示左方向燈並與前車左側保持多少距離以上之間隔超過，行至安全距離後，再顯示右方向燈駛入原行路線：","options":["0.5 公尺","1 公尺","2 公尺"],"answer":1},{"id":700,"q":"在未設有快慢車道分隔島之道路，四輪以上汽車及大型重型機車在劃有快慢車道分隔線之道路行駛，下列何種行為不得行駛慢車道？","options":["起駛","準備轉彎","超車"],"answer":3},{"id":701,"q":"汽車行駛中，遇到下列車種，何者須禮讓：","options":["教練車","幼童專用車","以上皆是"],"answer":3},{"id":702,"q":"行駛中遇到救護車、消防車、警備車等執行勤務時，應如何避讓？","options":["在原地立即緊急煞車","向左右兩側避讓，讓出中間通道供其通行","尾隨救護車後方行駛，以利快速通過路口"],"answer":2},{"id":706,"q":"關於預防水漂現象的駕駛行為，下列敘述何者最正確？","options":["水漂現象主要與路面積水深度有關，只要積水未超過輪胎胎面高度，維持正常速度行駛即可安全通過","雨天行經積水路段前應提前減速，因為車速愈高，輪胎排水能力愈不足，水漂風險隨車速顯著增加；同時應確保胎紋深度足夠以維持排水功能","現代車輛普遍配備 ABS 防鎖死煞車系統，已能有效防止水漂現象，駕駛人只需正常行駛"],"answer":2},{"id":707,"q":"夜間行駛於無照明設備之郊區道路，且對向無來車或前方無前車時，應使用何種燈光？","options":["開啟霧燈","適時使用遠光燈，以增加視距","開啟近光燈，以免耗電"],"answer":2},{"id":708,"q":"行駛中若發現儀表板之水溫警示燈亮起紅燈，代表引擎溫度過高，應如何處理？","options":["加速趕往最近的加油站","儘速找安全處停車熄火，待引擎冷卻後再檢查，切勿立即開啟水箱蓋","不須理會，只要車輛還能行駛就代表沒有壞"],"answer":2},{"id":710,"q":"行車速度，無標誌或標線者，在設有快慢車道分隔線之慢車道行駛，其最高時速限制為何？","options":["行車時速不得超過 30 公里","行車時速不得超過 40 公里","行車時速不得超過 50 公里"],"answer":2},{"id":711,"q":"下列關於行車分向線與分向限制線的法規定義差異，何者正確？","options":["行車分向線為黃虛線，准許跨越超車；分向限制線為雙黃實線，禁止跨越、迴轉","兩者皆為白實線，僅用於區分快慢車道","行車分向線僅設置於國道，一般道路僅有分向限制線"],"answer":1},{"id":712,"q":"關於路面上劃設之黃色虛線行車分向線，其在法規上的主要功能為何？","options":["用以分隔對向車道，禁止變換車道","用以分隔對向車道，在安全情況下准許超車","用以標示路邊停車範圍，禁止臨時停車"],"answer":2},{"id":719,"q":"道路入口處設有禁止任何車輛進入標誌，下列何種車輛之通行方式符合規定？","options":["機車體積較小，可減速慢行進入該路段","任何車輛均不得進入，但執行緊急任務之消防車、救護車等不受限制","該標誌僅禁止汽車進入，自行車與機車不在管制範圍內"],"answer":2},{"id":726,"q":"汽車欲自交流道、服務區或休息站進入高速公路主線車道時，應在加速車道中如何行駛？","options":["加速後即可進入","逐漸加速行駛至末端停等後進入","逐漸加速並判明交通情況確達安全距離後進入"],"answer":3},{"id":729,"q":"高速公路速限 90 公里以上路段，時速低於 80 公里的小型車應行駛於？","options":["內側車道","外側車道","以上均可"],"answer":2},{"id":737,"q":"欲超越同一車道之前車時，應如何處理？","options":["只要有足夠安全距離，就可以直接加速超車","先鳴喇叭 2 單響或變換燈光 1 次，俟前車減速靠邊或以手勢表示允讓後，始得超越","只需靠近前車並閃大燈告知即可超車"],"answer":2},{"id":741,"q":"依速限標誌或標線之規定，在無標誌或標線下，行車速度不得超過多少公里？","options":["70 公里","60 公里","50 公里"],"answer":3},{"id":745,"q":"開車起駛時，駕駛人眼睛的視距應如何調整才符合安全駕駛原則？","options":["視距應保持很近，不須隨車速改變","視距保持固定不變即可","應隨車速增加，而將視距加遠"],"answer":3},{"id":746,"q":"汽車倒車時，應如何警告其他車輛或行人？","options":["應按鳴喇叭 3 長聲","應顯示倒車燈光，或由駕駛人表示左臂平伸，手掌向後並前後擺動之手勢","應連續按鳴喇叭"],"answer":2},{"id":748,"q":"反應距離加煞車距離，即為?","options":["會車間隔距離","行駛距離","停車距離"],"answer":3},{"id":749,"q":"在正常天候狀況下，汽車行駛於高速或快速公路時，小型車車速為每小時 90 公里，前後兩車之間應保持之最小行車安全距離為何？","options":["30 公尺以上","45 公尺以上","60 公尺以上"],"answer":2},{"id":750,"q":"在高速公路或快速公路行駛時，汽車是否可以在加速車道、減速車道或單車道匝道上超越前車？","options":["可以，在這些車道上可自由超車","可以，但僅限於車速很慢時","不可以，這些車道不得用於超車"],"answer":3},{"id":751,"q":"小型車行駛高速公路及快速公路，前後兩車間之行車安全距離，在正常天候狀況下，下列何者正確？","options":["車輛速率之每小時公里數值除以 2(單位為公尺)","車輛速率之每小時公里數值減 20(單位公尺)","安全距離靠自己衡量，沒有規定"],"answer":1},{"id":753,"q":"在設置有最低速限標誌之道路行車時，下列何者正確？","options":["以低於最低速限之速度行駛者，處罰鍰","只要未影響交通安全即可低於速限","低速行駛較安全，並未違規"],"answer":1},{"id":761,"q":"汽車急速起駛對車輛及油耗之影響，下列何者正確？","options":["可提升燃油效率，使車輛更省油","會增加燃油消耗，降低行車效率","對油耗無明顯影響，僅影響行車速度"],"answer":2},{"id":762,"q":"汽車在劃有分向限制線雙向二車道之路段行駛？","options":["對向車道無車時，可駛入對向車道超車","禁止駛入對向車道","可任意行駛於任何車道"],"answer":2},{"id":765,"q":"駕駛人行經設有禁止超車標誌之路段，下列何種行為仍屬違規？","options":["在不跨越道路中心線之情況下，利用同向車道超越前方慢車","前方車輛因故障停於路邊，駕駛人由其左側繞越通過","以高於前車之速度，自同向左側車道超越前車後隨即駛回原車道"],"answer":3},{"id":771,"q":"防衛駕駛觀念中，所謂的安全邊際意指為何？","options":["道路兩側用以區分車道與人行道的物理邊界","駕駛人對各種行車因素，因疏忽而發生危險時可供緩衝的限度","車輛安全氣囊展開時的最大保護半徑"],"answer":2},{"id":775,"q":"駕駛人遇紅燈應在停止線前停車等候，關於正確停車位置之敘述，下列何者正確？","options":["車輛前輪應對齊停止線停放，使駕駛人保有最佳路口視野","車輛全部應停於停止線後方，車身任何部分不得超越停止線","僅需車輛後軸不超越停止線即可，車頭超出停止線不構成違規"],"answer":2},{"id":778,"q":"在高速行車狀況下，駕駛人的動態視覺會有何種變化？","options":["視覺與平時怠速時一樣，無任何影響","車速愈快，駕駛人的視野愈寬廣，遠方景色愈清晰","車速愈快，駕駛人的視角會變窄(隧道效應)，對於兩側事物的敏感度大幅降低"],"answer":3},{"id":781,"q":"汽車在隧道內行駛時：","options":["白天不須開燈，晚上才開燈，以節省電力","應開燈、減速慢行，以策安全","應開亮頭燈並依規定速限行駛"],"answer":3},{"id":782,"q":"在內側車道行駛之汽車，利用外側車道超車：","options":["不可以","可以","沒有規定"],"answer":1},{"id":783,"q":"在狹路與他車交會時應：","options":["搶先前進迫使對方讓路","減速，尋找路幅較寬處停車避讓","大鳴喇叭，警告對方避讓"],"answer":2},{"id":784,"q":"在雙向二車道上欲超越前行車，發現對向有來車，你應該：","options":["立即減速放棄超車","馬上加速搶先超越","按鳴喇叭，促來車減速或避讓"],"answer":1},{"id":786,"q":"在深夜郊外道路上，空曠無車無人的情況下：","options":["可以超速行車","仍應按規定速限內行駛","可以稍微超過限制，但不宜太快"],"answer":2},{"id":787,"q":"行車速度，無標誌或標線者，行車時速不得超過 50 公里。但在未劃設車道線、行車分向線或分向限制線之道路，時速不得超過：","options":["40 公里","50 公里","30 公里"],"answer":3},{"id":789,"q":"行車中，駕駛人看到鐵路平交道標誌或標線後，應即將車速減低至時速：","options":["15 公里以下","20 公里以下","30 公里以下"],"answer":1},{"id":790,"q":"汽車在同向二車道以上道路，速度較慢之小型汽車，應行駛：","options":["內側車道","外側車道","慢車道"],"answer":2},{"id":791,"q":"在同向二車道以上之道路，小型車應行駛於：","options":["內側車道","外側車道","內外側車道均可，但不得任意變換車道"],"answer":3},{"id":793,"q":"汽車按鳴喇叭時間，每次：","options":["不得超過 2 秒","不得超過 1 秒","不得超過半秒"],"answer":3},{"id":794,"q":"汽車在同一車道行駛時，後車與前車之間，應保持：","options":["1 公尺以上","5 公尺以上","隨時可以煞停之距離"],"answer":3},{"id":795,"q":"汽車除行駛在單行道或指定行駛於左側車道外，在未劃行車分向線或分向限制線之道路，應：","options":["靠右行駛","靠左行駛","在道路中間行駛"],"answer":1},{"id":797,"q":"汽車在峻狹坡道路會車時，應該：","options":["下坡車讓上坡車先行","上坡車讓下坡車先行","不須相讓"],"answer":1},{"id":798,"q":"在未劃有分向標線之道路，或鐵路平交道，或不良道路會車時，應該：","options":["加速快行","減速慢行","照常行駛"],"answer":2},{"id":800,"q":"汽車在雙向二車道並劃有分向限制線之路段：","options":["不得駛入來車之車道內","可以駛入來車之車道內","如前無來車，即可駛入來車之車道內"],"answer":1},{"id":801,"q":"汽車會車時，相互之間隔，不得少於：","options":["2 公尺","1 公尺","半公尺"],"answer":3},{"id":802,"q":"汽車變換車道時，應先：","options":["按鳴喇叭","變換燈光","顯示方向燈或手勢"],"answer":3},{"id":803,"q":"交岔路口、公共汽車招呼站多少公尺內不得臨時停車：","options":["10 公尺","20 公尺","30 公尺"],"answer":1},{"id":807,"q":"行駛高速或快速公路欲變換車道時，除顯示方向燈外，最重要的是：","options":["有空位立即插入","僅須注意前車之安全距離即可","應注意前車及後方來車之安全距離"],"answer":3},{"id":809,"q":"行駛高速或快速公路駛入主線：","options":["先在加速車道減速，確認安全後才可駛入","開啟左方向燈即可駛入","先在加速車道加速，確認安全後才可駛入"],"answer":3},{"id":810,"q":"行駛高速或快速公路駛離主線：","options":["可隨意轉出","應先靠右行駛，逐漸減速駛出","開啟右方向燈，即可駛出"],"answer":2},{"id":812,"q":"適當的跟車距離，為什麼可以防止肇事，因為：","options":["跟著前車走，才不至於偏離主要幹道","有足夠的反應時間與空間","才跟得上前車，不至於脫隊"],"answer":2},{"id":813,"q":"最小安全跟車距離，必須：","options":["大於","小於","等於。停車距離"],"answer":1},{"id":816,"q":"夜間駕車，駕駛人不易發現的目標是：","options":["移動中的行人","站立的人物","移動中的車輛"],"answer":2},{"id":817,"q":"緊急煞車致使車輪鎖死時，煞車距離會：","options":["縮短","變長","不變"],"answer":2},{"id":818,"q":"行車最高指導原則，絕對是：","options":["車速越慢越好","與前車保持安全車距","緊跟前車較不易出錯"],"answer":2},{"id":822,"q":"小型車行駛高速公路或快速公路，前後兩車間之行車安全距離為，在正常天候狀況下，依車輛速率之每小時公里數值：","options":["除以二","除以三","除以四。所得之數值，其單位為公尺"],"answer":1},{"id":823,"q":"汽車駕駛人行駛高速公路，未保持安全距離因而肇事致人死亡者，處罰：","options":["吊扣駕駛執照","吊銷駕駛執照","吊銷車輛牌照"],"answer":2},{"id":827,"q":"夜間行車遇濃霧、雨、天色昏暗或視線不清時，應：","options":["開亮頭燈","注意號誌","按鳴喇叭"],"answer":1},{"id":829,"q":"關於變換車道與轉彎時的燈光使用，下列哪一種行為最符合法規要求並能體現防禦駕駛精神？","options":["變換車道時，只要轉動方向盤的瞬間閃兩下方向燈即可，不必提早顯示","應先顯示欲變換方向的方向燈，並保持閃爍至完成轉彎或變換車道，讓後車有足夠反應時間","在超車時，應連續閃爍遠近光燈直到前車讓路為止"],"answer":2},{"id":830,"q":"汽車行駛於道路時，若前方車輛開啟方向燈時，後車應如何應對以預防事故？","options":["加速趕在對方變換車道或轉彎前通過","應減速慢行，並保持安全距離","持續按鳴喇叭警告對方不得變換車道或轉彎"],"answer":2},{"id":833,"q":"車輛行駛於外側車道欲右轉彎時，應距交岔路口幾公尺前顯示方向燈或手勢？","options":["30 公尺","50 公尺","40 公尺"],"answer":1},{"id":834,"q":"汽車駕駛人變換車道前，應該：","options":["不顯示方向燈，急加速後變換車道","先顯示方向燈，並確認安全距離","打開方向燈並立即切換車道"],"answer":2},{"id":835,"q":"變換車道或轉彎前，依規定應如何使用燈光？","options":["不需使用燈光","開啟遠光燈警示","應先顯示方向燈至完成轉彎或變換車道之行為"],"answer":3},{"id":837,"q":"遇到前車緊急煞車，最佳反應是：","options":["立即加速超越","保持安全車距並立即踩煞車","打遠光燈提醒"],"answer":2},{"id":838,"q":"汽車駕駛人欲變換車道時，依法應先顯示方向燈，其主要目的為何？","options":["提醒周邊車輛並爭取反應時間，以維護變換車道安全","表示自己取得絕對優先變換車道之權利","僅為避免遭科技執法舉發，與行車安全無直接關聯"],"answer":1},{"id":839,"q":"行車欲超越前方車輛，除顯示方向燈外，應如何行駛才正確?","options":["與前車右側保持半公尺以上之間隔","與前車左側保持半公尺以上之間隔","與前車左側保持 1 公尺以上之間隔"],"answer":2},{"id":843,"q":"於夜間駕車時，遇對向車輛會車時，駕駛人應如何使用燈光？","options":["為看清對向來車，應全程使用遠光燈","應切換使用霧燈","應切換為近光燈，以免造成對向駕駛人眩光危險"],"answer":3},{"id":844,"q":"夜間跟隨前車行駛之車輛：","options":["用近光燈","用遠光燈","不必開燈"],"answer":1},{"id":845,"q":"汽車在夜間行經市區照明情況良好處應該：","options":["開近光燈","開遠光燈","多鳴喇叭"],"answer":1},{"id":846,"q":"當我車前燈遠光將要照射到來車駕駛人眼睛前，應：","options":["改用近光燈","燈光全熄","仍開遠光燈"],"answer":1},{"id":847,"q":"汽車行駛至交岔路口欲轉彎時，應距交岔路口多少公尺前顯示方向燈：","options":["10 公尺","20 公尺","30 公尺"],"answer":3},{"id":848,"q":"夜間會車，應使用：","options":["遠光燈","近光燈","熄燈避讓即可"],"answer":2},{"id":849,"q":"汽車起駛前，應：","options":["不必顯示方向燈","按鳴喇叭 3 短聲","顯示方向燈"],"answer":3},{"id":850,"q":"汽車行駛中遇濃霧，應該：","options":["使用方向燈","使用煞車燈","開亮頭燈"],"answer":3},{"id":851,"q":"汽車行進中，發現鄰側車道車輛已開啟方向燈，有變換車道意圖時應：","options":["加速行駛阻擋超越","適度減低車速禮讓","併行競駛"],"answer":2},{"id":854,"q":"燈光照射距離突然變遠，表示可能正行駛在下坡路段，為防不測應：","options":["減速慢行","加速前進","關閉大燈"],"answer":1},{"id":857,"q":"有關貨車裝載，以下何者為錯誤？","options":["不可以前伸超過車頭以外","廂式貨車裝載貨物，可以超出車廂以外","不符合規定之傾卸式大貨車，不得裝載砂石、土方"],"answer":2},{"id":860,"q":"貨車裝載的規定下列何者正確？","options":["裝載貨物寬度，可以超出車身半公尺","裝載依自己方便，沒特別規定","裝載貨物寬度，不得超過車身"],"answer":3},{"id":862,"q":"廂式貨車裝載貨物，下列何者正確？","options":["裝載貨物可略為超出車廂，但須固定","裝載貨物之長度、寬度均不得超出車廂","在不影響行車安全前題下可以超出"],"answer":2},{"id":865,"q":"關於貨車裝載貨物之長度規定，下列敘述何者正確？","options":["貨物無論多長皆可裝載，只要有綁緊即可","長度不得前伸超過車頭","長度可以前伸超過車頭 2 公尺"],"answer":2},{"id":867,"q":"貨車裝載貨物寬度：","options":["可以超出車身半公尺","可以超出車身 1 公尺","不得超出車身"],"answer":3},{"id":869,"q":"裝載危險物品車輛，發現外洩或滲漏時應即：","options":["趕快加速開往目的地","停車予以妥善處理","沒有法令規定"],"answer":2},{"id":876,"q":"裝載危險物品之車輛，在橋樑、隧道、火場多少公尺範圍內，嚴禁停車：","options":["100 公尺","200 公尺","300 公尺"],"answer":1},{"id":882,"q":"汽車在高速行駛時，載重的重心愈低，其穩定性：","options":["愈佳","不佳","不受影響"],"answer":1},{"id":888,"q":"汽車於國道高速公路發生事故或其他緊急情況無法繼續行駛時，如車輛無法滑離車道，除顯示危險警告燈外，為防範二次事故，應於車輛後方多少公尺處設置車輛故障標誌？","options":["30 至 50 公尺","50 至 100 公尺","100 公尺以上"],"answer":3},{"id":889,"q":"在國道發生輕微擦撞事故(無人傷亡)，當事人下列作為何者正確？","options":["為處理人員蒐證、調查之需，應保留現場，直到警察抵達才可移動","拍照錄影後應儘速將車移置安全處所","在車道上放置車輛故障標誌後，等待警察到場處理"],"answer":2},{"id":890,"q":"當車輛發生道路交通事故時，依規定應於車後方放置車輛故障標誌或其他明顯警告設施，其距離何者正確？","options":["在快速道路於事故地點後方 70 公尺處","在高速公路於事故地點後方 100 公尺處","在最高速限 50 公里以下之路段於事故地點後方 20 公尺處"],"answer":2},{"id":893,"q":"關於高速公路的路肩使用與故障應變，下列哪一種情境處理方式是正確且能有效預防二次事故的？","options":["為了趕時間，若前方主線塞車，可以暫時行駛路肩","車輛若在行駛中發生故障，應緩慢駛向路肩停靠，並在車後方 50~100 公尺處放置車輛故障標誌，且人員應到護欄外等待救援","發生事故後，為了保護車輛財產，所有乘客應留在車內並反鎖車門"],"answer":2},{"id":894,"q":"發生交通事故後，放置車輛故障標誌的主要目的是什麼？","options":["警告後方來車，防止警察開單","警告後方來車，預防二次事故追撞","作為理賠時計算車損的基準點"],"answer":2},{"id":896,"q":"駕駛人發生交通事故，若無人傷亡且車輛尚能行駛，應如何初步處理以防止二次事故？","options":["應先標繪或攝、錄影車輛位置及衝撞點，並將車輛移置路邊","留在原地等待警察到場，不得移動車輛","直接離開現場，事後再報警即可"],"answer":1},{"id":897,"q":"車輛發生事故後，為防止二次事故，應優先採取何項措施？","options":["立即移動車輛","開啟危險警告燈並設置車輛故障標誌","關閉所有燈光"],"answer":2},{"id":903,"q":"發生交通事故後，第一步應該做什麼？","options":["馬上報警","為避免影響交通，應立即移動車輛","停車、開啟危險警示燈並於車後方放置車輛故障標誌"],"answer":3},{"id":904,"q":"為防止交通事故，行駛中最重要的做法是：","options":["保持安全車距","超速行駛以快到目的地","只注意前方車輛"],"answer":1},{"id":906,"q":"在高速公路發生交通事故或車輛故障時，若需透過專責客服系統通報並請求協助，應撥打下列哪一專線？","options":["1968 APP(警政報案)","1996","1999"],"answer":1},{"id":907,"q":"汽車駕駛人駕駛汽車肇事，無人受傷或死亡且汽車尚能行駛時，下列處理程序何者正確？","options":["應先標繪車輛位置及拍攝相關證據後，將車輛移置不妨礙交通之處","不得任意移動車輛，於現場等待警察到場","僅需與對方達成口頭協議後，即可各自離開現場"],"answer":1},{"id":921,"q":"汽油發生火災時，下列何種處置方式正確？","options":["應以大量清水直接潑灑，以迅速降低火勢","使用滅火器、泥沙或以濕棉被、衣物覆蓋撲滅火源","應先移動燃燒物，再以風吹方式使火勢減弱"],"answer":2},{"id":924,"q":"在行車途中，如目睹發生車禍，你應該：","options":["儘速駛離現場","暫留現場協助救護，並向處理人員作證","如有查詢謊稱未看到"],"answer":2},{"id":925,"q":"行車中，發覺煞車失靈應：","options":["立即變換低速檔，並亮右側方向燈，作靠邊停車準備","立即向路旁停靠","開亮車頭燈，並鳴喇叭，促使前方人車注意避讓"],"answer":1},{"id":926,"q":"行駛前發現煞車或方向盤失靈，駕駛人應：","options":["減速慢行","照往常一樣行駛","停止行駛，車輛送修"],"answer":3},{"id":946,"q":"汽車肇事，傷者有休克現象時臉色呈：","options":["蒼白","鉛灰色","潮紅症狀"],"answer":1},{"id":947,"q":"血色鮮紅血液連續作噴狀流出係：","options":["靜脈出血","微血管出血","動脈出血"],"answer":3},{"id":948,"q":"汽車因碰撞起火燃燒，而致空氣中氧氣不足或呼吸道被物阻塞都會造成：","options":["休克","窒息","嘔吐"],"answer":2},{"id":949,"q":"斷骨穿出皮外大量流血時，應先：","options":["企圖把斷骨推回原位","止血","送醫治療"],"answer":2},{"id":951,"q":"汽車穿越積水路面後，應特別注意：","options":["試開燈光","試踩離合器","試踩煞車"],"answer":3},{"id":952,"q":"以下敘述何者正確：","options":["儀錶板如警告燈有亮起的狀況，可不用理會，繼續行駛車輛","發現引擎有冒煙，可持續行駛至車輛沒有冒煙的狀況","發現煞車失靈，應立即變換低速檔，開啓右側方向燈，向路邊空曠處停靠"],"answer":3},{"id":953,"q":"汽車駕駛人駕駛汽車肇事，無人受傷或死亡且汽車尚能行駛，應優先：","options":["等待警察前來處理","將汽車位置標繪後並迅速移置路邊","通知保險公司"],"answer":2},{"id":956,"q":"汽車肇事時，若以路權責任歸屬，下列何者為正確：","options":["直行車應讓轉彎車","先到路口者先行","轉彎車應讓直行車"],"answer":3},{"id":957,"q":"發生交通事故時，當事人應儘量在現場尋找：","options":["親朋好友","目擊證人","法律人士。以利協助案情釐清"],"answer":2},{"id":970,"q":"汽車駕駛人開車前應進行車輛檢查。根據五油、六燈、三水及輪胎安全規範，下列哪一項做法是正確且安全的？","options":["檢查三水時，只需確認雨刷水充足即可","檢查輪胎時，若發現胎紋深度磨損至低於 1.6mm 或磨損至胎面磨耗指示點，應立即更換以防爆胎或雨天打滑","五油檢查只包括引擎機油與燃汽油，其餘屬於專業維修項目，行車前不必檢查"],"answer":2},{"id":971,"q":"汽車駕駛人行車前，以下何者為正確？","options":["白天行車無需檢查燈光","應詳細檢查相關安全設備確實有效，方可上路","平時已依原廠規定時間、里程保養，開車前無須再檢查機油、水及輪胎"],"answer":2},{"id":973,"q":"關於手煞車與腳煞車之操作觀念，下列敘述何者正確？","options":["兩者構造相似，可擇一使用","上坡起步時可併用以防車輛後滑","兩者同時併用將導致變速箱損壞"],"answer":2},{"id":976,"q":"行車時若發現水溫錶指針超過上限，正確的處置方式為何？","options":["將車輛安全停靠後熄火，並馬上打開水箱蓋檢查水量","繼續行駛至目的地，再進行檢查","將車輛安全停靠後熄火，待引擎冷卻再檢查水箱"],"answer":3},{"id":977,"q":"檢查水箱內冷卻水量、水質及是否有漏水現象時，最適當的時機為何？","options":["引擎冷卻後(冷車狀態)","引擎正常工作溫度時，以確認循環正常","引擎發動中，以便觀察有無漏水"],"answer":1},{"id":979,"q":"電腦控制汽油噴射引擎低溫發動時，正確的操作方式為何？","options":["不踩油門直接啟動","連踩油門三次後啟動","邊踩油門邊啟動"],"answer":1},{"id":980,"q":"汽車電瓶液不足時，應補充何種液體？","options":["自來水","蒸餾水或純水","稀硫酸溶液"],"answer":2},{"id":982,"q":"儀表板上以每分鐘來表示引擎之旋轉數的設備稱為？","options":["轉速表","時速表","里程表"],"answer":1},{"id":983,"q":"汽車安裝雪胎或加裝雪鏈於結冰路面行駛時，下列敘述何者最安全？","options":["依照速限行駛即可","慢速行駛並拉大與前車安全距離","輪胎已不會打滑可加速行駛"],"answer":2},{"id":984,"q":"自排車發動引擎時，排檔桿應置於何檔位？","options":["D 或 R 檔","P 或 N 檔","任何檔位皆可"],"answer":2},{"id":985,"q":"關於引擎工作溫度與油耗的關係，下列何者正確？","options":["低溫較省油","低溫較耗油","溫度與油耗無關"],"answer":2},{"id":987,"q":"正確檢查機油量的時機為何？","options":["引擎發動中即可檢查","熄火並待數分鐘後","熄火後立即檢查"],"answer":2},{"id":988,"q":"引擎運轉中，車上電器(如大燈、冷氣)的主要供電來源為何？","options":["電瓶","發電機","點火線圈"],"answer":2},{"id":989,"q":"汽車儀表板燃油錶指針指向 E 時，代表什麼意義？","options":["油量充足","油量極低","油量適當"],"answer":2},{"id":992,"q":"針對汽車用電腦控制 ABS 煞車系統敘述，下列何者為非？","options":["當 ABS 煞車系統燈號亮起時，表示防鎖死煞車功能已被開啟","汽車用電腦控制 ABS 煞車系統，當高速行駛緊急煞車時，煞車踏板會自動上下震動，表示正常現象","車用 ABS 煞車系統，最主要優點為當緊急煞車時，使煞車及轉向仍能保持正常"],"answer":1},{"id":994,"q":"高速行駛緊急煞車的過程，車輛裝設何種裝置，且駕駛人冷靜地操作方向盤，可能會閃過障礙物？","options":["ABS 防鎖死煞車裝置","LDWS 車道偏離警示系統","ACC 主動式車距巡航系統"],"answer":1},{"id":1003,"q":"汽車行至長坡道下坡時，為了行車安全及減少煞車系統負荷，駕駛人應如何操作？","options":["適當運用引擎煞車(換入低速檔)","持續輕踩煞車，保持車速","熄火下滑以節省燃料"],"answer":1},{"id":1005,"q":"檢查電瓶液若不足時，應補充何者?","options":["礦泉水","硫酸","蒸餾水"],"answer":3},{"id":1013,"q":"水冷式引擎在無冷卻水情況下，下列何者正確？","options":["可發動引擎短程行駛","不得發動引擎，以免造成引擎過熱損壞","降低車速繼續行駛，可避免引擎過熱問題"],"answer":2},{"id":1014,"q":"汽車配備 ABS 防鎖死煞車系統，主要功能為何？","options":["在緊急煞車時提高煞車力道，使車輛能更快停止","在緊急煞車時防止車輪鎖死，使駕駛仍能維持轉向與煞車控制","在煞車時自動降低車速，以避免車輛打滑"],"answer":2},{"id":1016,"q":"輪胎胎壓過高時，對行車可能造成之影響，下列何者正確？","options":["可提升輪胎抓地力，使煞車更穩定","可能降低輪胎與地面接觸面積，影響煞車性能與操控性","對行車安全無明顯影響"],"answer":2},{"id":1021,"q":"汽車夜間在市區道路行駛，如遇照明清楚之狀況時，應使用何種燈光？","options":["近光燈","遠光燈","霧燈"],"answer":1},{"id":1024,"q":"關於煞車系統保養與煞車操作之敘述，選項何者正確？","options":["將煞車油超越上限加滿可增強煞車力道","緊急狀況時應將煞車一腳踩死使輪胎鎖死，可獲得最短煞車距離","煞車油應加至上、下限之間；而防鎖死煞車系統可防止重踩時輪胎鎖死，維持車輛轉向能力"],"answer":3},{"id":1031,"q":"行車前，應對方向盤、煞車等機件：","options":["詳細檢查","不必檢查","檢查或不檢查都不會影響行駛安全"],"answer":1},{"id":1042,"q":"引擎機油除定期檢查外：","options":["應定期更換","不必更換","看機油廠牌而定"],"answer":1},{"id":1043,"q":"添加機油時，應由何處加入：","options":["機油尺孔","引擎上機油蓋口","水箱蓋口"],"answer":2},{"id":1046,"q":"汽車使用中電瓶水不足時，應加入：","options":["稀硫酸","蒸餾水","電水"],"answer":2},{"id":1048,"q":"夜間黑暗處，檢查電瓶液時，不可使用之照明工具：","options":["手電筒","打火機","車上電源工作燈"],"answer":2},{"id":1051,"q":"起動馬達使用之電源係來自：","options":["發電機供給","電瓶供給","發電機和電瓶供給"],"answer":2},{"id":1056,"q":"引擎溫度錶指針偏向 H 處，表示溫度：","options":["正常","過高","過低"],"answer":2},{"id":1058,"q":"動力轉向裝置的主要優點，為：","options":["可改變減速比","可增大轉向角度","轉向時可減少駕駛人的操作力"],"answer":3},{"id":1065,"q":"汽油引擎正常之排氣顏色為：","options":["黑色","藍白色","無色"],"answer":3},{"id":1066,"q":"汽油引擎排氣顏色為黑色，表示：","options":["燃燒完全","燃燒不完全","燃燒引擎機油"],"answer":2},{"id":1067,"q":"自排車要發動引擎時，應將排檔桿放在：","options":["D","R","P。之位置上"],"answer":3},{"id":1068,"q":"自排車要將排檔桿從 P 檔排到 R 檔或 D 檔時，須先：","options":["踩油門","踩煞車","直接排入"],"answer":2},{"id":1069,"q":"自排車輛停車，駕駛人離開座位前，除應將手煞車拉緊外，排檔桿位置應置於：","options":["D 檔","R 檔","P 檔。以防止車輛滑動"],"answer":3},{"id":1071,"q":"駕車時由前進檔換入倒檔，或是由倒檔換入前進檔時：","options":["不一定要車輛完全停止後再操作","一定要車輛完全停止後再操作","停不停都不影響操作"],"answer":2},{"id":1072,"q":"檢查輪胎氣壓必須在：","options":["隨時均可","開車後輪胎高於常溫時","未開車前輪胎處於常溫時"],"answer":3},{"id":1073,"q":"輪胎氣壓不足時，易造成：","options":["輪胎兩側磨損","輪胎中央磨損","轉向變輕"],"answer":1},{"id":1074,"q":"輪胎氣壓太低會造成：","options":["省油","方向盤較輕","方向盤變重及耗油"],"answer":3},{"id":1076,"q":"輪胎構造中，那一部份強度最弱：","options":["胎面","胎邊(側面)","胎唇"],"answer":2},{"id":1077,"q":"輪胎胎面中央的花紋有較嚴重摩耗，其原因為：","options":["輪胎氣壓過高","輪胎氣壓過低","負載過多"],"answer":1},{"id":1078,"q":"車胎過度的磨損：","options":["車輛行駛會更四平八穩","會影響車輛的轉向及煞車距離","只要不爆胎，就可繼續行駛"],"answer":2},{"id":1079,"q":"連續使用煞車導致煞車鼓溫度升高後，煞車效果將：","options":["變大","變小","不變"],"answer":2},{"id":1081,"q":"下長陡坡聞到有燒焦臭味，其原因可能是：","options":["排氣管過熱","離合器打滑","煞車使用過度"],"answer":3},{"id":1082,"q":"使用煞車時，車頭向右偏或左偏，是因為：","options":["煞車油太多","兩前輪可能有一輪煞車失常","煞車油管內有空氣"],"answer":2},{"id":1085,"q":"駕駛人開車時應攜帶之重要證件為：","options":["行車執照、駕駛執照及強制責任保險卡","車輛故障標誌","隨車維修工具"],"answer":1}],"carTips":[{"title":"車燈使用時機","items":["頭燈：夜間、隧道地下道調撥車道、遇濃霧雨雪天色昏暗視線不清時，均應開亮。白天開頭燈可增加被看見的機會。","方向燈：轉彎前 30 公尺或變換車道時顯示，須持續到完成動作。三步驟——先打方向燈→看後照鏡→擺頭察看有無人車。","危險警告燈：大雨濃霧、車輛故障（車後 50-100 公尺放故障三角架）、暫時停靠路邊時開啟。","霧燈：僅照明用，若無雨霧不得使用。晝行燈引擎發動即自動開啟（辨識用）。倒車燈打倒車檔自動亮起。"]},{"title":"輪胎安檢三重點","items":["外觀檢查：胎紋深度是否不足、是否有外傷龜裂老化裂痕變形、確認輪胎壽命。","胎壓檢查：胎壓值參考原廠使用手冊，過高或過低都會降低輪胎壽命。應在未開車、輪胎常溫時檢查。","行駛中爆胎處理：①放開油門 ②緊握方向盤 ③滑行至路邊並開啟警告燈。切勿猛踩煞車。","新輪胎超過製造日期 6 年不得安裝於汽車；建議使用期限自製造日起最長 10 年。"]},{"title":"排檔與踏板","items":["自排車 P/R/N/D/2/1：駐車檔 / 倒車檔 / 空檔 / 前進檔 / 低速檔 / 低速檔。發動引擎須排在 P 或 N 檔。","手排車 1-5 檔 + R + N：1、2 為低速檔，3 以上為高速檔，N 為空檔。","三踏板（由左至右）：離合器、煞車、油門。","下長坡善用低速檔引擎煞車，避免過度使用腳煞車導致煞車過熱失靈。"]},{"title":"儀表板燈號（依顏色）","items":["紅色（危險）：引擎冷卻水溫、氣囊、未繫安全帶、低機油壓力、充電、車門開啟、危險警告、煞車系統警示燈。看到應儘速安全停車檢查。","橙色（警告）：低燃油油位、ABS 防鎖死煞車系統、引擎故障、O/D OFF 超速傳動檔。","綠色：方向燈。藍色：遠光燈。","四大儀表：引擎冷卻水溫度錶、燃油錶、速率錶、引擎轉速錶（X1000 r/min）。"]},{"title":"燈與雨刷開關操作","items":["燈開關：行車燈→旋轉、近光燈→旋轉、遠光燈→向外推。","雨刷 MIST→刷一次、OFF→關閉、INT→間歇、LOW→均慢速、HIGH→均快速。"]}],"motoStages":[{"num":"01","name":"直線平衡駕駛","tag":"可複試 1 次","desc":"通過 15 公尺長的窄道，全程腳不著地、車輪不可壓管線。通過時間需 7 秒以上。","fatal":true,"fatalDesc":"時間低於 7 秒、壓線或腳著地，皆扣 32 分。"},{"num":"02","name":"斑馬線行人穿越道","tag":"","desc":"閃雙黃燈時應停止，前輪不得超過停止線，待燈號熄滅才前行；若無閃燈，應停車查看左右有無行人再起步。","fatal":false,"fatalDesc":""},{"num":"03","name":"交叉路口兩段式轉彎","tag":"待轉","desc":"依標線進入待轉區，遵守號誌。前輪不可超越停止線。","fatal":true,"fatalDesc":"前輪超越停止線扣 32 分。"},{"num":"04","name":"變換車道","tag":"","desc":"打方向燈、轉頭確認後方安全，再平順變換。不可壓線。","fatal":false,"fatalDesc":""},{"num":"05","name":"直角轉彎","tag":"","desc":"彎道中保持平衡，車輪不壓線、雙腳不著地。","fatal":false,"fatalDesc":""},{"num":"06","name":"停車再開","tag":"","desc":"完全停妥後，確認安全再起步。起步前左右轉頭。","fatal":false,"fatalDesc":""},{"num":"07","name":"鐵路平交道","tag":"","desc":"進入前停車，看、聽兩方無火車再通過。前輪不可超越停止線。","fatal":true,"fatalDesc":"平交道區塊失誤扣 32 分。"}],"motoTips":["行進中雙腳不可落地","轉彎一定要打方向燈","起步前左右轉頭確認安全","遵守交通號誌與標線指示","車輪不可壓到管線或標線","全程注意左右來車與行人"],"carHazard":[{"id":1,"code":"危感-01","q":"對向的車輛持續顯示方向燈並未減速接近路口，你應該？","options":["先減速，並確認安全後再行駛。","按鳴喇叭或變換燈光，提醒該車輛讓你先通過。","直行車優先，預判對方會讓我先行。"],"answer":1,"video":"videos/202601.mp4"},{"id":2,"code":"危感-02","q":"行經無號誌路口時，發現橫向有機車接近且未減速，你應該？","options":["加速通過避免與對方衝突。","直行車優先，應預判對方會讓我先行。","減速並預作停車之準備。"],"answer":3,"video":"videos/202602.mp4"},{"id":3,"code":"危感-03","q":"從照後鏡中發現有車輛接近並顯示方向燈，你應該？","options":["加速駛離避免與對方衝突。","放開油門減速因應。","對方不一定會影響我，不必理會。"],"answer":2,"video":"videos/202603.mp4"},{"id":4,"code":"危感-04","q":"綠燈起步時，發現橫向的車輛似乎沒有減速跡象，並快速逼近路口，你應該？","options":["暫緩起步並煞停，確認該橫向車輛停下或通過後再行駛。","預判對方會於路口煞停，維持正常速度起步即可。","因為我是綠燈，應立即起步並按喇叭提醒對方停車。" const $ = (id)=>document.getElementById(id);
const enc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let S = { vehicle:null, screen:"home", quiz:[], answers:{}, current:0, onlyWrong:false };

function loadWrong(key){ try{ return JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){ return []; } }
function saveWrong(key,list){ try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){} }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function cfg(){
  const isMoto = S.vehicle==="moto";
  return {
    isMoto,
    bank: isMoto?DATA.moto:DATA.car,
    wrongKey: isMoto?"motoWrong":"carWrong",
    accent: isMoto?"#8b2121":"#1a4d6e",
    label: isMoto?"普通重型機車":"普通小型車",
    pick: isMoto?100:50,
    name: isMoto?"機車":"汽車",
  };
}

function hazardCfg(){
  return {
    isMoto:false,
    bank: DATA.carHazard,
    wrongKey: "carHazardWrong",
    accent: "#1a4d6e",
    label: "危險感知影片題",
    pick: DATA.carHazard.length,
    name: "汽車危險感知",
  };
}

function activeCfg(){ return S.hazardMode ? hazardCfg() : cfg(); }

function startExam(source){
  S.hazardMode=false;
  const c=cfg(); let pool=c.bank;
  const wrong=loadWrong(c.wrongKey);
  if(source==="wrong" && wrong.length>0){ const ids=new Set(wrong); pool=c.bank.filter(q=>ids.has(q.id)); }
  const n=Math.min(c.pick,pool.length);
  S.quiz=shuffle(pool).slice(0,n); S.answers={}; S.current=0; S.onlyWrong=false; S.screen="exam"; render();
}

function startHazardExam(){
  S.hazardMode=true;
  const c=hazardCfg();
  S.quiz=shuffle(c.bank); S.answers={}; S.current=0; S.onlyWrong=false; S.screen="exam"; render();
}

function submitExam(){
  const c=activeCfg(); let wrong=loadWrong(c.wrongKey);
  const wrongIds=S.quiz.filter(q=>S.answers[q.id]!==q.answer).map(q=>q.id);
  const correctIds=S.quiz.filter(q=>S.answers[q.id]===q.answer).map(q=>q.id);
  let merged=Array.from(new Set(wrong.concat(wrongIds)));
  merged=merged.filter(id=>correctIds.indexOf(id)<0);
  saveWrong(c.wrongKey,merged); S.screen="result"; render();
}

function stats(){
  const total=S.quiz.length;
  const answered=S.quiz.filter(q=>S.answers[q.id]!==undefined).length;
  const correct=S.quiz.filter(q=>S.answers[q.id]===q.answer).length;
  const wrong=S.quiz.filter(q=>S.answers[q.id]!==undefined&&S.answers[q.id]!==q.answer).length;
  const score=total?Math.round(correct/total*100):0;
  return {total,answered,correct,wrong,score,passed:score>=85};
}

function render(){
  if(!S.vehicle){ return renderVehicle(); }
  if(S.screen==="home") return renderHome();
  if(S.screen==="exam") return renderExam();
  if(S.screen==="result") return renderResult();
  if(S.screen==="review") return renderReview();
  if(S.screen==="tips") return renderTips();
}

      <div style="font-size:13px;color:#666;line-height:1.7">${c.isMoto?"場地考七關卡與通關要訣速查。純參考，不計入測驗。":"車燈、輪胎、排檔、儀表板燈號速查。純參考，不計入測驗。"}</div>
    </div>
    <div class="sans" style="font-size:10px;color:#aaa;text-align:center;margin-top:24px;line-height:1.8">題庫來源：交通部公路局官方題庫</div>
  </div>`;
}

function renderExam(){
  const c=activeCfg(); const q=S.quiz[S.current]; const sel=S.answers[q.id];
  const answered=Object.keys(S.answers).length;
  const pad=(n,l)=>String(n).padStart(l,"0");
  let opts="";
  q.options.forEach((opt,idx)=>{
    const num=idx+1; const on=sel===num;
    opts+=`<button class="opt" style="background:${on?'#1a1a1a':'#f5f1e8'};color:${on?'#f5f1e8':'#1a1a1a'};border:1px solid ${on?'#1a1a1a':'#d4c9b0'}" onclick="S.answers[${q.id}]=${num};render()">
      <span class="onum sans" style="border:1px solid ${on?'#f5f1e8':c.accent};color:${on?'#f5f1e8':c.accent}">${num}</span>
      <span style="flex:1">${enc(opt)}</span></button>`;
  });
  let jump="";
  S.quiz.forEach((qq,i)=>{ const done=S.answers[qq.id]!==undefined; const cur=i===S.current;
    jump+=`<button class="sans" style="padding:6px 0;font-size:11px;border:1px solid #d4c9b0;background:${cur?c.accent:done?'#1a1a1a':'#fff'};color:${(cur||done)?'#f5f1e8':'#999'}" onclick="S.current=${i};render()">${i+1}</button>`; });
  const last=S.current===S.quiz.length-1;
  $("app").innerHTML = `
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #d4c9b0">
      <button style="background:transparent;border:none;font-size:13px;color:#666" onclick="if(confirm('確定要離開測驗？目前進度將消失。')){S.screen='home';render();}">← 離開</button>
      <div class="sans" style="font-size:12px;color:#666">已作答 <b style="color:${c.accent}">${answered}</b><span style="color:#999"> / ${S.quiz.length}</span></div>
    </div>
    <div style="margin-bottom:24px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <div class="sans" style="font-size:11px;letter-spacing:2px;color:${c.accent}">第 ${pad(S.current+1,2)} / ${pad(S.quiz.length,2)} 題</div>
        <div class="sans" style="font-size:11px;color:#aaa">官方題號 #${q.code||q.id}</div>
      </div>
      <div style="height:3px;background:#e5dfc9"><div style="height:100%;width:${(S.current+1)/S.quiz.length*100}%;background:${c.accent}"></div></div>
    </div>
    ${q.video?`<div class="card" style="padding:10px">
      <video controls playsinline preload="metadata" style="width:100%;display:block;background:#000" src="${q.video}"></video>
      <div class="sans" style="font-size:11px;color:#999;margin-top:8px;letter-spacing:1px">請先觀看影片，再作答下方題目</div>
    </div>`:''}
    <div class="card" style="padding:32px 24px">
      <div style="font-size:24px;line-height:1.7;margin-bottom:28px">${enc(q.q)}</div>
      ${opts}
    </div>
    <div style="display:flex;gap:10px">
      <button style="flex:1;padding:14px 0;background:transparent;border:1px solid #d4c9b0;color:${S.current===0?'#ccc':'#666'};font-size:14px;letter-spacing:2px" ${S.current===0?'disabled':''} onclick="S.current=Math.max(0,S.current-1);render()">上一題</button>
      ${last
        ? `<button style="flex:2;padding:14px 0;background:${c.accent};color:#f5f1e8;border:none;font-size:14px;letter-spacing:4px;font-weight:600" onclick="if(${answered}<${S.quiz.length}&&!confirm('還有 '+(${S.quiz.length}-${answered})+' 題未作答，確定交卷？'))return;submitExam()">交 卷</button>`
        : `<button style="flex:2;padding:14px 0;background:#1a1a1a;color:#f5f1e8;border:none;font-size:14px;letter-spacing:4px;font-weight:600" onclick="S.current++;render()">下 一 題</button>`}
    </div>
    <details style="margin-top:28px">
      <summary class="sans" style="font-size:12px;color:#666;padding:8px 0;letter-spacing:1px">跳至題號</summary>
      <div class="grid10" style="margin-top:12px">${jump}</div>
    </details>
  </div>`;
}

function renderResult(){
  const c=activeCfg(); const st=stats(); const pc=st.passed?"#3a6e3a":"#8b2121";
  let cells="";
  S.quiz.forEach((qq,i)=>{ const ans=S.answers[qq.id]; const ok=ans===qq.answer; const done=ans!==undefined;
    cells+=`<div class="sans" style="padding:6px 0;font-size:11px;text-align:center;border:1px solid #d4c9b0;background:${!done?'#eee':ok?'#3a6e3a':'#8b2121'};color:${!done?'#999':'#f5f1e8'}">${i+1}</div>`; });
  $("app").innerHTML = `
  <div class="wrap" style="padding:32px 20px">
    <div style="text-align:center;margin-bottom:36px">
      <div class="sans" style="display:inline-block;padding:4px 14px;border:1.5px solid ${pc};color:${pc};font-size:11px;letter-spacing:4px;margin-bottom:18px">${st.passed?"PASSED · 及 格":"FAILED · 不 及 格"}</div>
      <div class="sans" style="font-size:12px;color:#666;margin-bottom:6px;letter-spacing:2px">成績</div>
      <div style="font-size:96px;font-weight:700;line-height:1;color:${pc};letter-spacing:-3px">${st.score}</div>
      <div class="sans" style="font-size:13px;color:#666;margin-top:14px;letter-spacing:1px">答對 ${st.correct} · 答錯 ${st.wrong} · 未答 ${st.total-st.answered}</div>
      <div class="sans" style="font-size:10px;color:#aaa;margin-top:6px;letter-spacing:1px">及格標準 85 分</div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:24px">
      <button style="flex:1;padding:14px 0;background:#1a1a1a;color:#f5f1e8;border:none;font-size:14px;letter-spacing:4px;font-weight:600" onclick="S.screen='review';render()">檢 討 答 案</button>
      <button style="flex:1;padding:14px 0;background:transparent;color:#666;border:1px solid #d4c9b0;font-size:14px;letter-spacing:4px" onclick="S.screen='home';render()">回 首 頁</button>
    </div>
    <div class="card">
      <div class="sans" style="font-size:12px;color:${c.accent};font-weight:600;margin-bottom:14px;letter-spacing:2px">作答一覽</div>
      <div class="grid10">${cells}</div>
      <div class="sans" style="display:flex;gap:14px;margin-top:14px;font-size:11px;color:#666;letter-spacing:1px">
        <span><span style="display:inline-block;width:10px;height:10px;background:#3a6e3a;margin-right:5px;vertical-align:middle"></span>答對</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#8b2121;margin-right:5px;vertical-align:middle"></span>答錯</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#eee;border:1px solid #d4c9b0;margin-right:5px;vertical-align:middle"></span>未答</span>
      </div>
    </div>
  </div>`;
}

function renderReview(){
  const c=activeCfg(); const st=stats();
  const displayed=S.onlyWrong?S.quiz.filter(qq=>S.answers[qq.id]!==qq.answer):S.quiz;
  let cards="";
  displayed.forEach(qq=>{ const ans=S.answers[qq.id]; const ok=ans===qq.answer; const done=ans!==undefined;
    const oi=S.quiz.findIndex(x=>x.id===qq.id);
    let opts="";
    qq.options.forEach((opt,idx)=>{ const num=idx+1; const isC=num===qq.answer; const isU=num===ans;
      let bg="#faf7ed",bd="#e5dfc9",col="#666",extra="";
      if(isC){bg="#edf5ed";bd="#3a6e3a";col="#2a4e2a";extra='<span class="sans" style="font-size:10px;margin-left:8px;color:#3a6e3a;font-weight:600;letter-spacing:1px;align-self:center">正解</span>';}
      if(isU&&!isC){bg="#fbecec";bd="#8b2121";col="#8b2121";extra='<span class="sans" style="font-size:10px;margin-left:8px;color:#8b2121;font-weight:600;letter-spacing:1px;align-self:center">你的答案</span>';}
      opts+=`<div style="display:flex;align-items:flex-start;padding:12px 14px;margin-bottom:6px;font-size:18px;line-height:1.55;border:1px solid ${bd};background:${bg};color:${col};${isU&&!isC?'text-decoration:line-through;':''}${isC?'font-weight:500;':''}">
        <span class="sans" style="display:inline-block;width:26px;height:26px;min-width:26px;line-height:24px;text-align:center;border:1px solid ${isC?'#3a6e3a':isU&&!isC?'#8b2121':'#d4c9b0'};color:${isC?'#3a6e3a':isU&&!isC?'#8b2121':'#999'};font-size:13px;margin-right:10px;font-weight:600;background:#fff">${num}</span>
        <span style="flex:1">${enc(opt)}</span>${extra}</div>`;
    });
    cards+=`<div style="background:#fff;border:1px solid ${!done?'#d4c9b0':ok?'#b8cfb8':'#e0b0b0'};border-left:4px solid ${!done?'#999':ok?'#3a6e3a':'#8b2121'};padding:18px 18px 20px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
        <div class="sans" style="font-size:11px;color:#999;letter-spacing:1px">第 ${oi+1} 題 · 題號 #${qq.code||qq.id}</div>
        <div class="sans" style="font-size:11px;font-weight:600;padding:2px 10px;background:${!done?'#e5dfc9':ok?'#3a6e3a':'#8b2121'};color:${!done?'#666':'#f5f1e8'};letter-spacing:2px">${!done?'未作答':ok?'答對':'答錯'}</div>
      </div>
      <div style="font-size:21px;line-height:1.65;margin-bottom:16px">${enc(qq.q)}</div>${opts}</div>`;
  });
  if(displayed.length===0) cards='<div class="sans" style="text-align:center;padding:40px;color:#999">全部答對，沒有錯題 ✓</div>';
  $("app").innerHTML = `
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #d4c9b0">
      <button style="background:transparent;border:none;font-size:13px;color:#666" onclick="S.screen='result';render()">← 返回成績</button>
      <div class="sans" style="font-size:12px;color:#666;letter-spacing:2px">答案檢討</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="sans" style="flex:1;padding:10px 0;font-size:12px;letter-spacing:2px;background:${!S.onlyWrong?'#1a1a1a':'#fff'};color:${!S.onlyWrong?'#f5f1e8':'#666'};border:1px solid ${!S.onlyWrong?'#1a1a1a':'#d4c9b0'}" onclick="S.onlyWrong=false;render()">全部 ${S.quiz.length}</button>
      <button class="sans" style="flex:1;padding:10px 0;font-size:12px;letter-spacing:2px;background:${S.onlyWrong?'#8b2121':'#fff'};color:${S.onlyWrong?'#f5f1e8':'#666'};border:1px solid ${S.onlyWrong?'#8b2121':'#d4c9b0'}" onclick="S.onlyWrong=true;render()">僅錯題 ${st.wrong+(st.total-st.answered)}</button>
    </div>
    ${cards}
    <button style="width:100%;margin-top:16px;padding:14px 0;background:#1a1a1a;color:#f5f1e8;border:none;font-size:14px;letter-spacing:4px;font-weight:600" onclick="S.screen='home';render()">回 首 頁</button>
  </div>`;
}

function renderTips(){
  const c=cfg();
  let body="";
  if(c.isMoto){
    body+=`<div style="text-align:center;margin-bottom:24px"><h2 style="font-size:26px;font-weight:700;margin:4px 0;letter-spacing:1px">場地考 · 七大關卡</h2><div class="sans" style="font-size:13px;color:#666;margin-top:8px;line-height:1.7">及格 70 分 · 標示 <span style="color:#8b2121;font-weight:600">致命項</span> 者一犯即扣 32 分</div></div>`;
    DATA.motoStages.forEach(s=>{
      body+=`<div style="background:#fff;border:1px solid ${s.fatal?'#e0b0b0':'#d4c9b0'};border-left:4px solid ${s.fatal?'#8b2121':'#d4c9b0'};padding:18px 18px 20px;margin-bottom:12px">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap">
          <span class="sans" style="font-size:22px;font-weight:700;color:${s.fatal?'#8b2121':'#1a1a1a'};letter-spacing:1px">${s.num}</span>
          <span style="font-size:19px;font-weight:600">${enc(s.name)}</span>
          ${s.tag?`<span class="sans" style="font-size:11px;color:#888;border:1px solid #d4c9b0;padding:1px 7px">${enc(s.tag)}</span>`:''}
          ${s.fatal?`<span class="sans" style="font-size:11px;color:#f5f1e8;background:#8b2121;padding:2px 8px;letter-spacing:1px;margin-left:auto">致命項</span>`:''}
        </div>
        <div style="font-size:16px;line-height:1.7;color:#333">${enc(s.desc)}</div>
        ${s.fatal?`<div class="sans" style="font-size:13px;color:#8b2121;margin-top:10px;line-height:1.6">⚠ ${enc(s.fatalDesc)}</div>`:''}</div>`;
    });
    let tips="";
    DATA.motoTips.forEach(t=>{ tips+=`<div style="font-size:15px;line-height:1.6;margin-bottom:8px;display:flex;align-items:flex-start"><span style="color:#c98a8a;margin-right:10px;font-weight:700">·</span><span style="flex:1">${enc(t)}</span></div>`; });
    body+=`<div style="background:#1a1a1a;color:#f5f1e8;padding:22px 20px;margin-top:8px;margin-bottom:14px"><div class="sans" style="font-size:14px;font-weight:600;margin-bottom:14px;letter-spacing:3px">通 關 要 訣</div>${tips}</div>`;
    body+=`<div style="background:#fff8e8;border:1px solid #e0d4a0;padding:16px 18px;margin-bottom:20px"><div class="sans" style="font-size:12px;color:#9a7a1a;font-weight:600;margin-bottom:6px;letter-spacing:1px">新制提醒</div><div style="font-size:14px;color:#6a5a2a;line-height:1.7">目前為場地考（考場內七關）。政府規劃自 2027 年 10 月起改為實際上路的道路路考。</div></div>`;
  } else {
    body+=`<div style="text-align:center;margin-bottom:24px"><h2 style="font-size:26px;font-weight:700;margin:4px 0;letter-spacing:1px">考場重點整理</h2><div class="sans" style="font-size:13px;color:#666;margin-top:8px;line-height:1.7">駕訓班教學海報精華 · 筆試常考</div></div>`;
    DATA.carTips.forEach(sec=>{
      let items="";
      sec.items.forEach(it=>{ items+=`<div style="font-size:15px;line-height:1.75;margin-bottom:12px;display:flex;align-items:flex-start;color:#333"><span style="color:${c.accent};margin-right:10px;font-weight:700">·</span><span style="flex:1">${enc(it)}</span></div>`; });
      body+=`<div style="background:#fff;border:1px solid #d4c9b0;border-left:4px solid ${c.accent};padding:20px 18px;margin-bottom:12px"><div style="font-size:18px;font-weight:700;margin-bottom:14px;color:${c.accent}">${enc(sec.title)}</div>${items}</div>`;
    });
  }
  $("app").innerHTML = `
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #d4c9b0">
      <button style="background:transparent;border:none;font-size:14px;color:#666" onclick="S.screen='home';render()">← 返回</button>
      <div class="sans" style="font-size:12px;color:#666;letter-spacing:2px">${c.isMoto?'路考重點':'重點整理'}</div>
    </div>
    ${body}
    <button style="width:100%;padding:14px 0;background:#1a1a1a;color:#f5f1e8;border:none;font-size:14px;letter-spacing:4px;font-weight:600" onclick="S.screen='home';render()">回 首 頁</button>
  </div>`;
}

render();
</script>
