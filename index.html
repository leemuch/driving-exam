<script>
const DATA = {"moto":[{"id":1,"q":"機車附載物品，高度不可超過駕駛人","options":["頭部","肩部","腰部"],"answer":2},{"id":2,"q":"機車附載物品，寬度不可超過車輛把手外緣","options":["10 公分","2 公尺","1 公尺半"],"answer":1},{"id":3,"q":"重型機車，附載物品重量，不得超過","options":["50 公斤","80 公斤","90 公斤"],"answer":2},{"id":4,"q":"機車附載物品，長度規定伸出車尾部分，自後輪軸起，不得超過","options":["半公尺","1 公尺","3 公尺"],"answer":1},{"id":5,"q":"普通輕型機車附載物件，重量規定","options":["以 40 公斤為限","以 50 公斤為限","以 20 公斤為限"],"answer":2},{"id":6,"q":"關於機車載物的規定，下列何者不正確？","options":["得載運高於騎士肩膀以上之貨物","寬度不得超過把手外緣 10 公分","伸出車尾部分，自後輪軸起不得超過 50 公分"],"answer":1},{"id":7,"q":"機車附載人員或物品，下列何者不正確？","options":["小型輕型機車不得附載人員，重型及普通輕型機車在駕駛人後設有固定座位者，得附載 1 人","附載坐人後，不得另載物品","附載坐人可以側坐"],"answer":3},{"id":8,"q":"機車附載乘客之原則，何者不正確?","options":["附載乘客不可側坐","普通輕型機車不可附載乘客","重型機車限載 1 人"],"answer":2},{"id":10,"q":"機車所附載之貨物，長度規定下列何者正確？","options":["自座位後部起不得向前超伸","自座位後部起向前不得伸出超過一公尺","自座位後部起向前不得伸出超過二十公分"],"answer":1},{"id":11,"q":"機車附載物品超過車尾，最長不得超過多少？","options":["自後輪軸起不得超過半公尺","自後輪軸起不得超過一公尺","自車尾（車身）起不得伸出超過半公尺"],"answer":1},{"id":12,"q":"機車載物之長度，自座位後部起有何規定？","options":["不得向前超伸","得向前伸出但不得超過把手","無相關限制"],"answer":1},{"id":13,"q":"機車載物時，所載貨物的最大寬度限制為何？","options":["不得超過把手外緣 10 公分","不得超過把手外緣 15 公分","不得超過機車把手寬度"],"answer":1},{"id":14,"q":"機車載運貨物時，關於裝載規定，下列敘述何者正確？","options":["貨物以繩索確實固定且未遮蔽車尾燈號者，得不受尺寸限制","貨物寬度未超出車把手且重量在駕駛人可控制範圍內，即符合規定","載運貨物應遵守法定之寬度、長度、高度及重量限制，不得超載"],"answer":3},{"id":15,"q":"機車附載人員或物品，以下規定何者正確？","options":["小型輕型機車、重型及普通輕型機車在駕駛人後設有固定座位者，得附載一人","載物者，小型輕型不得超過三十公斤；普通輕型不得超過六十公斤；重型不得超過九十公斤","附載坐人後，不得另載物品。但零星物品不影響駕駛人及附載人員之安全者，不在此限"],"answer":3},{"id":16,"q":"若機車附載人員或物品違反規定，將處罰誰？","options":["乘客","機車駕駛人","機車駕駛人及乘客"],"answer":2},{"id":17,"q":"機車附載人員或物品未依規定者，將處駕駛人多少罰鍰？","options":["新臺幣 300 元~600 元罰鍰","新臺幣 600 元~1,200 元罰鍰","新臺幣 1,200 元~2,400 元罰鍰"],"answer":1},{"id":18,"q":"車禍中不醒人事的骨折傷患，","options":["除非情況緊急，否則不得任意移動","搬動傷患前，應先處理呼吸困難、出血、骨折等情形","以上皆是"],"answer":3},{"id":19,"q":"車禍肇事時，傷者有休克現象時臉色呈","options":["蒼白","鉛灰色","潮紅症狀"],"answer":1},{"id":20,"q":"前方路上發生事故，警察已到現場處理，應如何做比較好？","options":["停在路旁觀看","繞道離開，不可好奇在現場停留觀看","留下幫忙順便打卡"],"answer":2},{"id":21,"q":"速度愈高停車距離：","options":["不變","愈小","愈長"],"answer":3},{"id":22,"q":"如遇油料著火，應即：","options":["用水撲滅","用滅火器及泥沙或用水浸濕棉被衣服覆蓋撲滅","就近取樹枝撲滅"],"answer":2},{"id":23,"q":"發生交通事故時，當事人應儘量在現場尋找：","options":["親朋好友","目擊證人","法律人士 以利協助案情釐清"],"answer":2},{"id":24,"q":"下坡行駛時","options":["可以關閉電門，空檔滑行","不得將引擎熄火空檔滑行","無規定"],"answer":2},{"id":25,"q":"下列哪些地方是高危險區，應避免停駐？","options":["路面正落下小石塊","有防落石柵處或路邊護欄受撞擊扭曲變形","以上皆是"],"answer":3},{"id":26,"q":"駕駛人駕駛汽車肇事致人受傷或死亡者，應即採取救護措施及依規定處置，並通知警察機關處理，不得任意移動肇事汽車及現場痕跡證據，違反者","options":["應處以罰鍰","車輛沒入","記違規紀錄 1 次"],"answer":1},{"id":27,"q":"道路交通事故係指以下何者在道路上行駛，致有人受傷或死亡？","options":["車輛","動力機械","以上皆是"],"answer":3},{"id":28,"q":"下列何者非屬重大道路交通事故？","options":["死亡人數在 3 人以上","死亡及受傷人數在 10 人以上","受傷人數在 14 人以下"],"answer":3},{"id":29,"q":"下列何者係屬重大交通事故？","options":["死亡人數在 3 人以上或死亡及受傷人數在 10 人以上或受傷人數在 15 人以上","運送之危險物品發生爆炸燃燒或有毒液氣體放射性物質洩漏等事故","以上皆是"],"answer":3},{"id":30,"q":"駕駛人駕車肇事，無人受傷或死亡且機車尚能行駛，應優先","options":["等待警察前來處理","將車輛位置標繪後並迅速移置路邊","通知保險公司"],"answer":2},{"id":31,"q":"肇事後在地面標繪相關證物位置後，下列何種狀況應將車輛立即移至路邊，切勿妨礙交通？","options":["輕微事故無人傷亡","有人重傷","有人死亡"],"answer":1},{"id":32,"q":"駕駛人駕駛機車肇事無人受傷或死亡，且機車尚能行駛而不儘速將位置標繪移置路邊，致妨礙交通者處罰","options":["留置該機車","罰鍰","扣留牌照"],"answer":2},{"id":33,"q":"肇事時，若以路權責任歸屬，下列何者為正確：","options":["直行車應讓轉彎車","先到路口者先行","轉彎車應讓直行車"],"answer":3},{"id":34,"q":"有關呼吸、心跳停止的急救常識：暢通呼吸道，檢查呼吸不超過","options":["5 秒鐘","10 秒鐘","30 秒鐘"],"answer":2},{"id":35,"q":"進行 CPR(心肺復甦術)，胸外按壓與人工呼吸之比率，成人為","options":["30：2","15：2","5：1"],"answer":1},{"id":36,"q":"確定傷患無意識時，需進行心肺復甦術，胸部按壓之頻率約為","options":["18 次/每分鐘","72 次/每分鐘","100 次/每分鐘"],"answer":3},{"id":37,"q":"發現傷者哪個部位受傷時，應告知並維持他不受移動？","options":["頸部","脊椎","以上皆是"],"answer":3},{"id":38,"q":"維持呼吸道暢通是急救的首要任務，但如果傷者頸椎受傷，適合哪個方法維持呼吸道暢通？","options":["推下顎法","抬下巴壓額法","壓下巴抬額法"],"answer":1},{"id":39,"q":"下列何者為正確的心外按摩位置？","options":["胸骨外緣","胸骨上緣","兩乳頭連線中央胸骨上"],"answer":3},{"id":40,"q":"下列哪個表徵顯示個案有呼吸道阻塞？","options":["手抱肚子，彎腰一直喊痛","手抓住頸部無法說話","手按住胸口無法說話"],"answer":2},{"id":41,"q":"下列何者需執行哈姆立克氏施救法？","options":["個案昏迷時","懷疑呼吸道阻塞時","懷疑心肌梗塞時"],"answer":2},{"id":42,"q":"當發生車禍時，有名傷者大量出血，下列急救處理方式中何者錯誤?","options":["確定出血位置，剪開衣物，加壓止血","使用止血帶止血法，並且每隔 15~20 分鐘就鬆開一次","將出血患肢放置低於心臟的位置，這樣血才不會流太多"],"answer":3},{"id":43,"q":"CPR(心肺復甦術)在心跳停止多久後必須馬上執行，以免造成腦部不可逆的傷害?","options":["在 10~15 分鐘內","在 8~10 分鐘內","在 4~6 分鐘內"],"answer":3},{"id":44,"q":"施行哈姆立克急救法時，雙手應握拳施力於病人的何處?","options":["肚臍左方","肚臍下方","肚臍與胸骨的中間位置"],"answer":3},{"id":45,"q":"急救的優先做法為何?","options":["把頭擺正","輕拍病患，並評估意識","聽診呼吸音"],"answer":2},{"id":46,"q":"在化學傷害的緊急處理的措施為何?","options":["沖洗患部","找中和劑","脫除衣物"],"answer":1},{"id":47,"q":"因外傷導致腿部出血，下列措施何者適當?","options":["不可使用止血帶，以防患肢壞死","宜在傷口上加壓止血","避免抬高患肢"],"answer":2},{"id":48,"q":"請依急救原則，決定急救順序：A 止血 B 維持呼吸道通暢 C 固定骨折。","options":["A→B→C","B→C→A","B→A→C"],"answer":3},{"id":49,"q":"下列有關一氧化碳中毒的敘述，下列何者錯誤?","options":["瓦斯外漏、汽車引擎排出的廢氣都是造成一氧化碳中毒的原因","患者的皮膚呈黑色","一氧化碳中毒時，須馬上將患者移出危險環境，並給予 100%氧氣吸入"],"answer":2},{"id":50,"q":"CPR(心肺復甦術)時觀察患者有無呼吸的方法，不包括下列何者?","options":["看胸部有無起伏","感覺有無氣體呼出","摸有無頸動脈跳動"],"answer":3},{"id":51,"q":"如患者有骨折，下列何者為不適當的急救處置?","options":["移動患者骨折處，擺出能使患者舒服的臥位","優先處理出血或休克，再以夾板固定患部","不要隨意移動患者的骨折部位"],"answer":1},{"id":52,"q":"關於一般傷口的急救法，下列何者錯誤?","options":["先不要做任何處置，應靜待急救人員","使用流動的水或生理食鹽水來清理傷口","大量流血時，應用止血法"],"answer":1},{"id":53,"q":"當發現有人昏迷時，下列何者為首要措施?","options":["直接進行 CPR(心肺復甦術)","確認患者的意識狀態與脈搏","立刻使用自動體外去顫器 （AED)"],"answer":2},{"id":54,"q":"對於意識不清的患者，最好的姿位為下列何者?","options":["半坐臥","復甦姿勢","平躺"],"answer":2},{"id":55,"q":"執行 CPR(心肺復甦術)後，患者已逐漸恢復呼吸及心跳，請問依照現在此患者的狀況，最適合的姿勢為何者?","options":["復甦姿勢","平躺","半坐臥"],"answer":1},{"id":56,"q":"有名患者為大面積的嚴重燒傷，下列處置何者錯誤?","options":["馬上大量沖水","不管是否傷口沾黏立即脫去衣物","靜脈注射補充電解質"],"answer":2},{"id":57,"q":"對於昏迷或是意識不清的患者，要如何幫助其維持體溫?","options":["給予患者熱飲","使用熱水","給予覆蓋毛毯"],"answer":3},{"id":58,"q":"進行 CPR(心肺復甦術)每 2 分鐘，評估效果，應先檢查哪一項？","options":["呼吸","脈搏","意識"],"answer":2},{"id":59,"q":"成人有效的人工呼吸法為何?","options":["口對鼻","隔空傳氣","口對口"],"answer":3},{"id":60,"q":"開始施行心肺復甦術後，不可中斷超過幾秒鐘以上？","options":["10 秒","13 秒","15 秒"],"answer":1},{"id":61,"q":"施行 CPR(心肺復甦術)時，在給予人工呼吸時，若無法吹入氣體則應如何處理？","options":["重新打開呼吸道，再吹 1 口氣","放棄急救","馬上施行胸部按壓"],"answer":1},{"id":62,"q":"CPR(心肺復甦術)實施程序：「叫→叫→C→A→B→D」中的「D」是指","options":["壓額提下巴","取得 AED(自動體外心臟去顫器)去顫","死亡"],"answer":2},{"id":63,"q":"停止施行 CPR(心肺復甦術)的理由為何？","options":["救護人員到達接替救護工作","傷患已恢復心跳","以上皆是"],"answer":3},{"id":64,"q":"血色鮮紅血液連續作噴狀流出係：","options":["靜脈出血","微血管出血","動脈出血"],"answer":3},{"id":65,"q":"斷骨穿出皮外大量流血時，應先","options":["企圖把斷骨推回原位","止血","送醫"],"answer":2},{"id":66,"q":"騎車途中，目睹車禍發生應","options":["儘速駛離現場","暫留現場協助救護，並向警方處理人員作證","如有查詢謊稱未看到，以免波及官司"],"answer":2},{"id":73,"q":"機車發生交通事故後，關於事故現場清除作業，下列敘述何者正確？","options":["事故雙方已完成拍照存證且對責任歸屬無爭議時，得逕行清除現場恢復交通","應等待肇事處理機關指示後，方可進行現場清除作業","僅造成車輛輕微損傷且未妨礙交通之事故，得自行清除現場後再行報案"],"answer":2},{"id":74,"q":"機車發生道路交通事故後，關於車輛移置及報警義務，下列敘述何者正確？","options":["無人傷亡且車輛尚能行駛時，應先標繪車輛位置或以攝影記錄後，將車輛移置不妨礙交通處，並仍應通知警察機關","無人傷亡且雙方當場和解者，應先標繪車輛位置後移置車輛，但得免通知警察機關","有人受傷時，無論當事人是否同意，均不得移動車輛，應維持現場完整等待警察到場"],"answer":1},{"id":75,"q":"機車駕駛人肇事致他人受傷時，關於現場處置之優先順序，下列敘述何者正確？","options":["應先報警並保持現場完整，待警方指示後再對傷者進行救護，以免影響肇責釐清","應立即對傷者採取救護措施並通知消防機關，同時依規定進行現場標示及報警","應先以攝影完整記錄現場及傷者位置後，再行救護並報警處理"],"answer":2},{"id":76,"q":"機車發生交通事故後，關於通報處理之方式，下列敘述何者正確？","options":["應立即撥打 110 報案，簡要說明事故地點、傷亡情形，並依指示進行後續處置","應先完成現場拍照蒐證及車輛位置標繪後，再行報案以提供較完整之事故資訊","應先與對方確認雙方損害程度及責任歸屬後，再視情況決定是否報案"],"answer":1},{"id":77,"q":"駕駛人因違反道路交通管理處罰條例規定，其駕駛執照被吊銷後，除特定重大違規情形外，多久時間內不得重新考領？","options":["應經 1 年","應經 3 年","應經 5 年"],"answer":1},{"id":78,"q":"實行心肺復甦術（CPR）時，關於傷患的姿勢，下列何者正確？","options":["傷患的頭部要高於心臟","確保傷患仰臥於堅硬的平面上","可隨意搬動傷患以利急救"],"answer":2},{"id":79,"q":"當病患疑似頸椎受傷時，急救時應如何處理呼吸道？","options":["使用壓額抬下巴法暢通呼吸道","小心固定傷患頭頸部後，使用下顎推拉法暢通呼吸道","先確認是否清醒，再進行心肺復甦術"],"answer":2},{"id":80,"q":"在行車中途，精神疲勞，稍有睡意，你應該怎麼辦：","options":["繼續駕駛","擦抹萬金油及藥物，助長精神照常行駛","到最近安全處所停車，下車稍作休息，消除疲勞再駕駛"],"answer":3},{"id":81,"q":"酒後駕車，對駕駛人會產生「視覺之隧道效應」，駕駛者猶如在隧道中行車，前有亮光但四周漆黑，故酒後駕車：","options":["視野不變","視野變廣","視野變窄"],"answer":3},{"id":82,"q":"行駛於公路時，亂拋擲物品、煙蒂或火種：","options":["是極不道德的危險行為","只要我高興有什麼不可以","避免車子髒亂，應該丟棄"],"answer":1},{"id":83,"q":"機車駕駛人以後輪著地、蛇行駕駛因而肇事者，應","options":["僅勸導之","罰鍰並沒入車輛","罰鍰並吊銷其駕駛執照"],"answer":3},{"id":84,"q":"酒精濃度超過規定標準，駕車肇事致人重傷或死亡者，經吊銷駕駛執照後，依規定：","options":["終身不得考領駕駛執照，且無重新考領之機會","終身不得考領駕駛執照，但符合特定條件得重新考領","3 年後得重新考領駕駛執照"],"answer":1},{"id":85,"q":"駕駛人在道路上以蛇行或僅以後輪著地等危險方式駕車因而肇事者，應處","options":["罰鍰並吊銷駕照","吊扣駕照","罰鍰"],"answer":1},{"id":86,"q":"機車駕駛人行駛於道路時，以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為者，將受何種處分？","options":["處罰鍰","僅施以道安講習","勸導"],"answer":1},{"id":87,"q":"機車駕駛人患病影響安全駕駛、或飲用酒類後其吐氣所含酒精濃度達每公升 0.15 毫克者，","options":["不得開車","照常可以駕駛","開車時不可太快"],"answer":1},{"id":88,"q":"機車所有人，明知駕駛人有酒後駕車之情形而不予禁止，除處以罰鍰外，並應吊扣其機車牌照","options":["3 個月","1 年","2 年"],"answer":3},{"id":89,"q":"駕駛人駕駛汽車經測試檢定，其吐氣所含酒精濃度不得達每公升","options":["0.15 毫克","0.25 毫克","0.55 毫克"],"answer":1},{"id":90,"q":"酒精、麻醉劑及興奮劑中毒者，可否參加駕駛執照考驗？","options":["可以","不可以","須先通過直線平衡測試才可以"],"answer":2},{"id":91,"q":"任意以迫近、驟然變換車道或其他不當方式，迫使他車讓道等危險方式駕車因而肇事者，應處","options":["罰鍰","吊扣駕照","罰鍰並吊銷駕照"],"answer":3},{"id":92,"q":"非遇突發狀況，在行駛途中任意驟然減速、煞車或於車道中暫停等危險方式駕車因而肇事者，應處","options":["罰鍰","吊扣駕照","罰鍰並吊銷駕照"],"answer":3},{"id":93,"q":"駕駛人駕駛汽車行經警察機關設有告示執行酒測或毒品檢定之處所，不依指示停車接受稽查，或拒絕接受該項測試之檢定者","options":["處罰鍰，並當場移置保管該汽車","吊銷該駕駛執照及施以道路交通安全講習","以上皆是"],"answer":3},{"id":94,"q":"騎乘機車遭舉發違規酒駕，於何種違規樣態將處駕駛人新臺幣 9 萬元罰鍰、吊銷駕照 3 年及施以道路交通安全講習","options":["於 10 年內第 2 次再次遭舉發違規酒駕","不依指示停車接受酒測稽查或拒絕酒測","以上皆是"],"answer":1},{"id":95,"q":"騎乘機車遭舉發違規酒駕，於幾年內再次遭舉發違規酒駕，將處罰鍰 9 萬元、吊銷駕照 3 年，及施以道安講習之處分?","options":["5 年","10 年","12 年"],"answer":2},{"id":96,"q":"機車駕駛人於下列何種情況下，可以使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊？","options":["行進中","等待紅燈的時候","將機車停靠於路邊"],"answer":3},{"id":97,"q":"機車駕駛人於 10 年內，經測試檢定酒後駕車第 2 次，當場移置保管該機車及吊銷其駕駛執照 3 年，並處罰鍰新臺幣","options":["6 萬元","9 萬元","12 萬元"],"answer":2},{"id":98,"q":"駕駛人任意以迫近、驟然變換車道或其他不當方式，迫使他車讓道者，除罰鍰外，並當場禁止其駕駛及吊扣該汽車牌照","options":["3 個月","6 個月","12 個月"],"answer":2},{"id":99,"q":"有關機車號牌規定下列何者不正確？","options":["應正面懸掛於車輛後端之明顯適當位置","不得變造損毀、塗抹或粘貼其他材料、加裝邊框或霓虹燈、裝置旋轉架","可裁剪或扭曲懸掛"],"answer":3},{"id":100,"q":"於身心障礙專用停車位違規停車者","options":["罰鍰","吊扣牌照","勸導"],"answer":1},{"id":101,"q":"駕駛人不在未劃分標線道路之中央右側駕車者，應處：","options":["吊扣駕駛執照","罰鍰","吊扣行車執照"],"answer":2},{"id":102,"q":"汽車駕駛人於道路上併排停車，依規定應處罰鍰新臺幣：","options":["1,200 元以上 2,400 元以下","2,400 元以上 3,600 元以下","1,800 元以上 3,000 元以下"],"answer":3},{"id":103,"q":"汽機車駕駛人經酒精濃度測試檢定超過標準值，第 1 次違規除罰鍰、當場移置保管該汽機車外，並吊扣駕駛執照：","options":["3 個月","6 個月","1~2 年"],"answer":3},{"id":104,"q":"機車所有人已領有號牌而不懸掛或不依指定位置懸掛者，應處罰：","options":["罰鍰並吊扣牌照","罰鍰並吊銷牌照","罰鍰並禁止其行駛及吊銷牌照"],"answer":3},{"id":105,"q":"牌照借供他車使用或使用他車牌照行駛者，除罰鍰外，並應：","options":["吊扣牌照","吊銷牌照","沒入車輛"],"answer":2},{"id":106,"q":"機車所有人明知駕駛人酒精濃度超過規定標準，仍不予禁止其駕駛該機車，應處罰鍰新臺幣：","options":["15,000 元以上 90,000 元以下","30,000 元以上 120,000 元以下","6,000 元以上 12,000 元以下"],"answer":1},{"id":107,"q":"四輪以上車輛駕駛人於 10 年內，經測試檢定酒後駕車第 2 次，當場移置保管該汽車及吊銷其駕駛執照 3 年，並處罰鍰新臺幣","options":["6 萬元","9 萬元","12 萬元"],"answer":3},{"id":108,"q":"駕駛人若拒絕接受酒精濃度測試檢定者，除處罰鍰新臺幣 180,000 元，並：","options":["吊銷其駕駛執照","吊扣其駕駛執照","吊扣其行車執照"],"answer":1},{"id":109,"q":"酒精濃度超過規定標準駕車之違規人，於 10 年內違反酒後駕車之規定 2 次以上者，除處罰鍰，及當場移置保管該機車，並應：","options":["吊扣其行車執照","吊銷其駕駛執照","吊扣其駕駛執照"],"answer":2},{"id":110,"q":"駕駛人在快車道上依規定行駛，因行人或慢車不依規定，擅自進入快車道，而致人受傷或死亡，依法應負刑事責任者：","options":["一樣不變","減輕其刑","加重其刑"],"answer":2},{"id":111,"q":"駕駛人無照駕駛或酒醉駕車因而致人受傷或死亡，依法應負刑事責任者，加重其刑至","options":["三分之一","二分之一","一倍"],"answer":2},{"id":112,"q":"拼裝車輛未經核准領用牌證行駛或報廢車仍行駛道路者，除禁止其行駛外，其車輛","options":["沒入之並罰鍰","公告拍賣之","繳清罰鍰後始得領回"],"answer":1},{"id":113,"q":"下列何種違規行為得對車輛所有人逕行舉發處罰：","options":["無照駕駛","酒醉駕車","違規停車而駕駛人不在場"],"answer":3},{"id":114,"q":"哪些駕駛行為，得以科學儀器取得證據資料，逕行舉發處罰：","options":["超速","未保持安全距離","以上皆是"],"answer":3},{"id":115,"q":"騎乘機車在設有快慢車道分隔線之慢車道，時速不得超過","options":["30 公里","40 公里","50 公里"],"answer":2},{"id":116,"q":"行駛於有劃分島劃分快慢車道之道路，","options":["在慢車道行駛車輛不得左轉","在快車道行駛車輛不得右轉","以上皆是"],"answer":3},{"id":117,"q":"機車駕駛人，行經有燈光號誌管制之大眾捷運系統車輛共用通行交岔路口闖紅燈，經當場舉發者：","options":["罰鍰新臺幣 1,800～5,400 元並予違規記點","吊扣駕照 1 個月","罰鍰新臺幣 3,600～10,800 元並予違規記點"],"answer":3},{"id":118,"q":"公園出入口設有禁止機車進入標誌，但未設置車（路）阻，請問機車駕駛人可以騎車進公園嗎？","options":["可以","不可以","不一定，視情況而定"],"answer":2},{"id":121,"q":"小型輕型、普通輕型及普通重型機車後座附載人員的規定，何者正確？","options":["在駕駛人後設有固定座位者，得附載 1 人","小型輕型機車禁止附載人員","僅有重型機車可以附載人員"],"answer":2},{"id":122,"q":"關於「騎車或停等紅燈時使用手機」的敘述，下列何者正確？","options":["只要車輛沒有移動，就能安全使用手機","視情況而定，只要不被警察看到即可","這樣做會分心，屬於錯誤且危險的行為"],"answer":3},{"id":123,"q":"機車短小輕便且機動性高，下列駕駛行為敘述何者正確？","options":["可以併行競駛","可以快速穿越車縫及行人穿越道","應減速慢行並遠離大型車，避免進入內輪差及視野死角"],"answer":3},{"id":124,"q":"行車中，突然有疲倦感想睡覺，下列行為何者正確？","options":["應尋覓適當地點休息，待精神恢復再上路","增加行車速率，以提振精神","只要降低行車速度，就不會影響行車安全"],"answer":1},{"id":125,"q":"駕駛人服用感冒藥或鎮定劑後，關於駕駛車輛之安全考量，下列敘述何者正確？","options":["服用後若未感到明顯嗜睡或不適，經短暫休息後即可駕駛","此類藥物可能影響反應力與判斷力，服用後應避免駕駛","一般非處方感冒藥劑量較低，對駕駛能力無顯著影響，可正常駕駛"],"answer":2},{"id":126,"q":"駕駛人因身體或精神狀況影響安全駕駛能力時，關於是否得駕駛車輛，下列敘述何者正確？","options":["輕微疲勞或身體不適時，只要提高警覺並縮短行駛距離，仍可駕駛","精神不濟或患有影響安全駕駛之疾病者，不得駕駛車輛","服用感冒藥或止痛藥後若未感到明顯嗜睡，仍可正常駕駛"],"answer":2},{"id":127,"q":"機車駕駛人行車時，以手持方式使用行動電話或其他電訊設備，將受何種處罰？","options":["免處罰鍰","處罰鍰","吊扣駕照"],"answer":2},{"id":128,"q":"機車在單一車道內，與他車並行，被現場舉發將處以何種處罰？","options":["只記點不罰鍰","處罰鍰並記違規點數","罰鍰不記點"],"answer":2},{"id":129,"q":"機車變換車道或轉彎時，未依規定顯示方向燈，經當場舉發，會造成何種處罰？","options":["不會處罰","處罰鍰並吊銷駕照","處罰鍰並記違規點數"],"answer":3},{"id":130,"q":"依道路交通管理處罰條例規定，機車對於人行道之使用，下列何者正確？","options":["機車得以低速在有人行道之路段通行","機車不得在人行道行駛","機車於特殊狀況（如壅塞）得暫時行駛人行道"],"answer":2},{"id":131,"q":"關於機車附載後座乘客之乘坐方式，下列敘述何者正確？","options":["後座乘客穿著裙裝或行動不便時，得採側坐方式以維護乘坐便利","後座乘客應正面跨坐，不得側坐","後座乘客於低速行駛或短程接送時，得採側坐方式乘坐"],"answer":2},{"id":132,"q":"機車駕駛人若感到疲倦或連續駕車時間過長時，應如何處置？","options":["只要精神狀況尚可，仍可繼續駕駛","應以降低車速的方式，繼續保持行駛，避免疲勞","應立即尋找安全地點停車休息，待體力恢復後方得繼續駕駛"],"answer":3},{"id":133,"q":"機車駕駛人行經設有學校、醫院標誌之路段，不減速慢行，經交通勤務警察攔截，若未嚴重危害交通安全、秩序，且情節輕微，依法如何處罰？","options":["交通勤務警察得對其施以勸導，免予舉發","應處罰鍰，並上道安講習 3 小時","僅處罰鍰"],"answer":1},{"id":134,"q":"關於機車安全駕駛行為，下列敘述何者正確？","options":["行經路口時若號誌為綠燈，應加速通過以減少滯留路口之時間","行經路口時應依規定減速慢行，並注意左右來車及行人動態","行經路口前應變換至車陣前方位置，以確保擁有較佳視野及優先起步"],"answer":2},{"id":135,"q":"闖紅燈經逕行舉發之處罰，下列何者正確？","options":["不罰鍰，只記違規點數","處罰鍰，並記違規點數","處罰鍰，但不記違規點數"],"answer":3},{"id":136,"q":"闖紅燈未肇事經當場舉發，對駕駛人應給予什麼處罰？","options":["吊銷其駕照","處以罰鍰並記違規點數","吊扣其駕照"],"answer":2},{"id":137,"q":"機車駕駛人酒後駕車，下列何者正確？","options":["不會受罰","只會處罰鍰","會處罰鍰、吊扣駕照及參加道安講習"],"answer":3},{"id":138,"q":"機車駕駛人因酒精濃度超過規定標準而駕車，致人受傷或死亡者，應處以何種處罰？","options":["處罰鍰並吊扣駕照","處罰鍰並吊銷駕照","依刑法規定處理（如公共危險罪），並吊銷駕照"],"answer":3},{"id":139,"q":"機車駕駛人酒駕違規 10 年內第 2 次違規者，其罰鍰處分為？","options":["處新臺幣 3 萬元罰鍰","處新臺幣 6 萬元罰鍰","處新臺幣 9 萬元罰鍰"],"answer":3},{"id":140,"q":"駕駛人因酒醉駕車而肇事致人重傷死亡，對其駕駛執照之處分，下列何者正確？","options":["吊銷駕駛人駕駛執照 3 年","吊銷駕駛人駕駛執照，並終身不得再考領","吊扣駕駛人駕駛執照 2 至 4 年，期滿得再次考領"],"answer":2},{"id":141,"q":"駕駛人騎乘機車經酒測值超過規定標準時，關於其行政處罰，下列敘述何者正確？","options":["初次違規且酒測值輕微超標者，得以勸導講習代替吊扣駕照處分","違規當下未發生交通事故者，僅處罰鍰，免予吊扣駕照","初犯應處罰鍰及吊扣駕照"],"answer":3},{"id":142,"q":"機車駕駛人經測試檢定酒精濃度超過規定標準，且未肇事致人受傷或死亡者，除處以罰鍰外，其駕駛執照應處以何種處分？","options":["吊扣其駕駛執照 1 年至 2 年，並當場移置保管該機車","吊扣其駕駛執照 6 個月，並處以道安講習","吊銷其駕駛執照，且 3 年內不得重新考領"],"answer":1},{"id":143,"q":"機車駕駛人若初次拒絕接受酒精濃度測試之檢定（拒絕酒測），將面臨何種處罰？","options":["處新臺幣 12 萬元罰鍰，並吊扣其駕駛執照 1 年","處新臺幣 18 萬元罰鍰，並當場吊銷其駕駛執照","處新臺幣 9 萬元罰鍰，並施以道路交通安全講習"],"answer":2},{"id":144,"q":"機車駕駛人酒精濃度超過規定標準而駕車者，第一次違規最高可處多少罰鍰？","options":["新臺幣 6 萬元","新臺幣 9 萬元","新臺幣 12 萬元"],"answer":2},{"id":145,"q":"機車駕駛人酒駕且附載未滿 12 歲兒童者，會面臨何種處罰？","options":["僅處以罰鍰","吊扣其駕駛執照 3 個月","除罰鍰外，並吊扣其駕駛執照"],"answer":3},{"id":146,"q":"吐氣酒精濃度達每公升 0.25 毫克或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，致不能安全駕駛動力交通工具而駕駛者，處何種刑罰？","options":["處 1 年以下有期徒刑","處 3 年以下有期徒刑","處 5 年以下有期徒刑"],"answer":2},{"id":147,"q":"檢查機車的煞車時，輕抓煞車拉桿，應有保留多少間隙？","options":["不應有間隙","應要有 1 至 2 公分間隙","應要有 3 至 4 公分以上間隙"],"answer":2},{"id":148,"q":"機車消音器損壞後，不加修復仍然行駛者，依道路交通管理處罰條例應處","options":["罰鍰並責令改正","交通警察告誡","吊扣牌照"],"answer":1},{"id":149,"q":"駕駛機車起駛前","options":["應顯示方向燈，注意前後左右有無障礙或車輛行人","看側方有無車輛通過","看清前方路面"],"answer":1},{"id":150,"q":"駕駛人在起駛前應","options":["鳴按喇叭","顯示方向燈，儘快駛入車道","顯示方向燈，注意前後左右有無障礙或車輛行人"],"answer":3},{"id":151,"q":"遇有緊急或危險情況按鳴喇叭時，應以單響為原則，並","options":["不得連續按鳴 3 次","每次時間不得超過半秒鐘","以上皆是"],"answer":3},{"id":152,"q":"於下列何種情形行駛時應開亮頭燈？","options":["遇濃霧、雨、天色昏暗或視線不清時","行經隧道時","以上皆是"],"answer":3},{"id":153,"q":"有關機車煞車燈燈色，下列何者正確？","options":["紅色","橙色","黃色"],"answer":1},{"id":154,"q":"機車裝設霧燈之規定，以下何者正確？","options":["前後霧燈應為 1 盞或 2 盞","前霧燈限用黃色或淡黃色或白色，後霧燈限用紅色","以上皆是"],"answer":3},{"id":155,"q":"機車頭燈之燈色應為","options":["白色或淡黃色","藍色","沒有規定"],"answer":1},{"id":156,"q":"煞車燈之規定，何者不正確？","options":["燈色應為淡黃色","煞車作用時，應為續亮，不得閃爍","應為紅色"],"answer":1},{"id":157,"q":"方向燈燈色應為","options":["紅色","黃色","橙色"],"answer":3},{"id":158,"q":"小型輕型機車之輪胎直徑之規定為何？應在","options":["300 公釐以上，420 公釐以下","200 公釐以上，400 公釐以下","250 公釐以上，350 公釐以下"],"answer":1},{"id":159,"q":"小型輕型機車車輛空重（含電池)應在","options":["75 公斤以下","70 公斤以下","65 公斤以下"],"answer":2},{"id":160,"q":"機車排氣管隔熱防護裝置","options":["不影響騎車操作所以可不裝","隨興可裝可不裝","為避免燙傷他人，規定均需安裝"],"answer":3},{"id":161,"q":"機車設備下列何者不正確？","options":["不得裝設可發出不同音調之喇叭","左右兩側之照後鏡不得拆除","擋泥板可以不裝"],"answer":3},{"id":162,"q":"現行機車出廠滿幾年辦理轉讓過戶時需要參加臨時檢驗？","options":["5 年","7 年","10 年"],"answer":1},{"id":163,"q":"機車因故辦理停駛，期限最多不得超過","options":["1 年","1 年半","2 年"],"answer":1},{"id":164,"q":"報廢之車輛","options":["不得再行申請登記檢驗領照使用","修復後可申請登記檢驗領照使用","無規定"],"answer":1},{"id":165,"q":"機車發生交通事故遭受重大損壞，經修復後應實施","options":["定期檢驗","臨時檢驗","申請牌照檢驗"],"answer":2},{"id":166,"q":"機車全高不得超過：","options":["2 公尺","2.5 公尺","3 公尺"],"answer":1},{"id":167,"q":"機車裝置照後鏡，其功能為","options":["增加車輛平衡","方便駕駛人整理儀容","幫助駕駛人增加兩側視野"],"answer":3},{"id":168,"q":"速克達型（無段變速型）機車之煞車拉桿","options":["右手控制前輪、左手控制後輪","左手控制前輪、右手控制後輪","左手、右手同時控制前、後輪"],"answer":1},{"id":169,"q":"車輛長時間停放未使用，最好多久發動 1 次，每次 3-5 分鐘，以維持車輛引擎最佳啟動狀況？","options":["每季","每週","每月"],"answer":2},{"id":170,"q":"汽油引擎正常之排氣顏色為","options":["黑色","藍白色","無色"],"answer":3},{"id":171,"q":"機車引擎之排氣顏色為黑色，可能為","options":["汽油完全燃燒","汽油燃燒不完全","燃燒引擎機油"],"answer":2},{"id":172,"q":"機車排放廢氣中會造成地球溫室效應的主要氣體是哪一種?","options":["一氧化碳","二氧化碳","水蒸氣"],"answer":2},{"id":173,"q":"檢查機車引擎機油時","options":["引擎熄火","停在平坦地面","以上皆是"],"answer":3},{"id":174,"q":"機車引擎機油除定期檢查外","options":["應定期更換","不須更換","視機油廠牌而定"],"answer":1},{"id":175,"q":"添加機油時，應由何處加入?","options":["機油尺孔","引擎上機油蓋口","汽油箱蓋口"],"answer":2},{"id":176,"q":"機車是否更換機油濾清器?","options":["視機油廠牌而定","不須更換","按照機車使用手冊規範而定"],"answer":3},{"id":177,"q":"夜間或黑暗處，檢查電瓶液時，不可使用之照明工具為","options":["手電筒","打火機","電源工作燈"],"answer":2},{"id":178,"q":"電瓶樁頭塗上何物，可以防止腐蝕並使導電良好?","options":["油漆","黃油","柏油"],"answer":2},{"id":179,"q":"機車起動馬達使用之電源來自","options":["發電機供給","電瓶供給","引擎供給"],"answer":2},{"id":180,"q":"機車安裝空氣濾清器的主要目的是","options":["避免吸入空氣中沙塵損傷汽缸","減少機車運轉噪音","過濾排放廢氣，減少污染"],"answer":1},{"id":181,"q":"輪胎氣壓不足時，易造成","options":["輪胎兩側磨損","輪胎中央磨損","轉向變輕"],"answer":1},{"id":182,"q":"輪胎氣壓不足時，易造成","options":["輪胎兩側磨損","行駛耗油增加","以上皆是"],"answer":3},{"id":183,"q":"輪胎氣壓太高時，易造成","options":["輪胎兩側磨損","輪胎中央磨損","行駛耗油增加"],"answer":2},{"id":184,"q":"輪胎氣壓過高時，易造成","options":["車輛避震器加速損壞","輪胎中央磨損","以上皆是"],"answer":3},{"id":185,"q":"輪胎胎面中央的花紋有較嚴重磨耗，其原因為","options":["輪胎氣壓太低","輪胎氣壓太高","車輛載重過大"],"answer":2},{"id":186,"q":"車胎過度磨損","options":["不致危險","乘坐較舒適","會影響車輛轉向及煞車距離"],"answer":3},{"id":187,"q":"機車輪胎之胎紋深度小於多少應即更換？","options":["2 公釐","1.5 公釐","達到輪胎的磨耗指示點"],"answer":3},{"id":189,"q":"駕駛人檢查輪胎之內容主要為","options":["檢查胎壓是否正常","檢查輪胎外表是否龜裂、損傷或異常磨損","以上皆是"],"answer":3},{"id":190,"q":"輪胎構造中，哪一部分強度最弱?","options":["胎面","胎邊(胎腹)","胎唇"],"answer":2},{"id":191,"q":"檢查輪胎氣壓必須於","options":["行駛後輪胎胎溫高於常溫時","行駛前輪胎胎溫處於常溫時","隨時均可"],"answer":2},{"id":192,"q":"輪胎氣壓太低會造成","options":["胎邊容易受損而造成爆胎","增加摩擦阻力而增加油耗","以上皆是"],"answer":3},{"id":193,"q":"輪胎應受保護","options":["避免接近熱源","避免接觸礦油類相關油質","以上皆是"],"answer":3},{"id":194,"q":"建議使用之輪胎，以輪胎製造後不超過","options":["3 年","6 年","9 年為原則"],"answer":2},{"id":195,"q":"機車輪胎上的胎紋最主要功能為何?","options":["排水及增加摩擦力","增加行駛速度","防止輪胎表面龜裂"],"answer":1},{"id":197,"q":"輪胎胎紋太淺之危險性：","options":["影響輪胎摩擦力及抓地力，易延長煞車距離而發生事故","雨天行駛時輪胎排水性變差，易發生打滑失控","以上皆是"],"answer":3},{"id":198,"q":"機車照後鏡之使用，何者不適當?","options":["行進中與前車距離很近時，需觀看照後鏡以利超車","行駛前應將照後鏡調整至容易觀察後方車輛或道路狀況之角度與位置","可利用等待紅燈時間調整照後鏡"],"answer":1},{"id":199,"q":"購買安全帽","options":["必須貼有標準檢驗局之認證合格標籤","應選擇顏色鮮明或有反光材料之安全帽","以上皆是"],"answer":3},{"id":200,"q":"安全帽經強力碰撞後","options":["不宜再使用","外觀無損壞可繼續使用","製造日期於 3 年內外觀無損壞可繼續使用"],"answer":1},{"id":201,"q":"機車附載成員未戴安全帽","options":["處罰駕駛人","處罰附載成員","不處罰"],"answer":1},{"id":203,"q":"下列何者非騎車出發前之必要動作","options":["檢查燈光","確認胎壓","暖車"],"answer":3},{"id":204,"q":"機車照後鏡之敘述，何者錯誤?","options":["大多為凸面鏡","幫助騎士掌握車輛後方狀況","行進中若發現照後鏡無法順利觀察後方狀況，行駛中應即刻進行調整"],"answer":3},{"id":205,"q":"機車駐車架之敘述，何者錯誤?","options":["可分為主腳架與側腳架","屬於需作經常性更換之零件","側腳架較不穩固，僅建議於短暫停車時使用"],"answer":2},{"id":206,"q":"機車方向燈之敘述，下列何者錯誤?","options":["用以提醒前後方來車，本車欲轉彎之方向","燈色應為橙色","可依路況決定轉彎前是否顯示"],"answer":3},{"id":207,"q":"機車基本配件及功能下列何者正確?","options":["照後鏡會阻礙機車於車陣中穿梭之流暢，必要時可拆除","頭燈包含遠光燈與近光燈","照後鏡屬於凹面鏡"],"answer":2},{"id":208,"q":"騎乘機車如果爆胎，第一時間應","options":["立即煞車","放鬆油門","轉動方向把手"],"answer":2},{"id":209,"q":"機車改裝，下列何者有違規定？","options":["擅自裝設高亮度 HID 頭燈","將排氣管往上翹","以上皆有違規定"],"answer":3},{"id":210,"q":"選用安全帽之原則","options":["愈緊愈好，避免被風吹走","選深色的，比較不易髒","以上皆非"],"answer":3},{"id":211,"q":"下列何項不會顯示於機車儀表板？","options":["遠光燈指示","輪胎磨耗指示","行車速度指示"],"answer":2},{"id":212,"q":"以下何者非機車懸吊裝置之主要功能?","options":["減少輪胎磨損","能增加引擎動力","使車輛能更安全與舒適的操控"],"answer":2},{"id":213,"q":"機車煞車方式要隨外在環境調整，在乾燥或下坡路段","options":["前輪煞車為主、後輪煞車為輔","後輪煞車為主、前輪煞車為輔","前、後輪煞車平均分配"],"answer":1},{"id":214,"q":"機車煞車方式要隨外在環境調整，在濕滑或上坡路段","options":["前輪煞車為主、後輪煞車為輔","後輪煞車為主、前輪煞車為輔","前、後輪煞車平均分配"],"answer":2},{"id":215,"q":"更換機車電瓶時，先將主開關鑰匙轉至〝OFF〞位置，再拆卸電瓶，步驟為：","options":["先拆負極線，再拆正極線","先拆正極線，再拆負極線","先拆後拆都可以"],"answer":1},{"id":216,"q":"空氣濾清器如堆積塵埃，造成：","options":["馬力降低","耗油","以上皆是"],"answer":3},{"id":221,"q":"使用機車時，除了注意是否有汽油外，下列敘述何者正確？","options":["不需要額外做基本保養","需額外做基本保養，以確保車況","只需要檢查輪胎胎紋深度"],"answer":2},{"id":222,"q":"機車煞車時出現異常聲響，關於處置方式，下列敘述何者正確？","options":["若異音僅於潮濕天氣出現且煞車功能正常，屬正常現象無須特別處理","應儘速至合格機車行由專業技師檢查煞車系統，確認異常原因並進行必要檢修","可自行檢視來令片厚度，若尚未磨損至警示線則無安全疑慮"],"answer":2},{"id":223,"q":"機車行車前應實施安全檢查，關於檢查項目，下列敘述何者正確？","options":["主要檢查煞車及輪胎狀況，確認制動系統正常即可安全上路","機車出廠前已通過安全檢驗，日常騎乘僅需於定期保養時進行全面檢查","應檢查燈光、方向燈、煞車、輪胎、喇叭及照後鏡等項目，確保各系統正常運作"],"answer":3},{"id":224,"q":"有關安全帽的注意事項，下列敘述何者錯誤？","options":["受過撞擊之安全帽，如外觀無損壞，則可正常使用不必更換","頭帶長度不宜過長或過短，約留 1 指空間大小","扣子應該在下巴後方，保留 1 指縫的空間，並且旋鈕緊固"],"answer":1},{"id":225,"q":"機車駕駛人及附載乘客配戴安全帽時，關於帽帶之扣繫方式，下列敘述何者正確？","options":["帽帶扣繫後應保留約一至二指寬之鬆緊度，以兼顧舒適性與透氣需求","安全帽應正面配戴並將帽帶確實扣緊，使安全帽穩固貼合頭部","短程騎乘或低速行駛時，帽帶僅需輕扣固定，無須緊繫"],"answer":2},{"id":226,"q":"關於機車安全帽之選購，下列敘述何者正確？","options":["選購時應以配戴舒適度及通風散熱性能為首要考量","應選購貼有經濟部標準檢驗局商品檢驗標識之合格安全帽","進口品牌安全帽通過國際安全認證者，其防護性能較國內檢驗標準更為嚴格，可安心選購"],"answer":2},{"id":227,"q":"關於機車車燈之改裝或加工，下列敘述何者正確？","options":["車燈黏貼透明保護膜以防止刮傷，且不影響燈光亮度者，符合規定","加裝經檢審驗合格之高亮度燈泡以提升夜間照明效果，符合規定","車燈不得噴色、黏貼膠紙或加裝燈罩，以免影響辨識效果"],"answer":3},{"id":228,"q":"關於機車排氣管之改裝規定，下列敘述何者正確？","options":["更換為通過環保署認證且排放值合格之排氣管，符合改裝規定","使用原廠同型號零件更換排氣管位置，因未變更規格故符合規定","排氣管不得變更數量及位置，亦不得拆除消音器或觸媒裝置"],"answer":3},{"id":229,"q":"機車在引擎發動前，應檢查的項目為何？","options":["僅須檢查汽油量","僅須檢查機油量","須檢查機油及汽油量"],"answer":3},{"id":230,"q":"下列何者是量測機車機油量最準確的時機？","options":["剛停車熄火時","機車發生傾斜時","機車靜置於平坦處，引擎熄火一段時間後"],"answer":3},{"id":231,"q":"關於機車輪胎氣壓的敘述，下列何者正確？","options":["充氣氣壓愈高愈佳","胎壓應當低於原廠規定，以增加抓地力","胎壓應符合原廠規定，且胎紋深度足夠"],"answer":3},{"id":232,"q":"若車輛輪胎胎壓「過高」，則輪胎何處磨損會最嚴重？","options":["胎紋的兩側","胎紋的內側部分","胎紋的中央部分"],"answer":3},{"id":233,"q":"機車儀錶板上用以表示行駛里程累積數的是下列何者？","options":["里程計","速度表","轉速表"],"answer":1},{"id":234,"q":"機車油量表顯示「E」時，表示什麼意思？","options":["油量充足，可以繼續行駛","表示油量已不高，應儘速加油","機油不足，應添加機油"],"answer":2},{"id":235,"q":"關於大型重型機車（逾 250c.c.）的定期檢驗規定，下列敘述何者正確？","options":["出廠滿 1 年後，每年應至少檢驗 1 次","出廠年份未滿 5 年者，免予定期檢驗","出廠滿 5 年以上者，每滿半年應檢驗 1 次"],"answer":2},{"id":236,"q":"夜間騎乘機車，對向來車持續開啟遠光燈造成眩目，下列何種做法最能確保安全？","options":["以遠光燈回應示意對方切換近光燈","視線略偏向右側路緣標線，維持穩定車速與車道，避免直視對向燈光","減速至路邊停車，等待對向車輛通過"],"answer":2},{"id":237,"q":"行車速度愈快，則煞車距離愈長，速度若增加 1 倍，煞車距離即會增為","options":["2 倍","4 倍","8 倍"],"answer":2},{"id":238,"q":"行車速度愈快，駕駛人的視野","options":["不變","愈狹窄","愈寬廣"],"answer":2},{"id":239,"q":"行駛在積水路段，應","options":["低速行駛","快速通過","多使用煞車"],"answer":1},{"id":240,"q":"對肇事責任鑑定有異議，","options":["絕對服從","向覆議機關申請覆議","向警察機關提出告訴"],"answer":2},{"id":241,"q":"下列何者最接近防衛駕駛觀念?","options":["即使自己遵守交通規則，還是必須小心防範他人違規對自己造成傷害","選購耐撞車種，並加強安全配備","騎在路中間，大家都看得到"],"answer":1},{"id":242,"q":"行車安全距離的描述，下列何者錯誤?","options":["因機車車身小，故行駛其後所保持的安全距離與同車速的汽車相比，可以再縮短一些","即使停車時也該保持安全距離","被超車後應該略為減速重新取得安全距離"],"answer":1},{"id":243,"q":"關於「購買安全帽注意事項」，下列何者錯誤?","options":["必須貼有標準檢驗局之認證合格標籤","安全帽受過強力撞擊後，若外觀沒有損壞則不必更換","應選擇顏色鮮明或有反光材料之安全帽"],"answer":2},{"id":244,"q":"請問應如何選購機車安全帽較為適當?","options":["用工程用安全帽，又輕又透風","選擇貼有標準檢驗局之認證合格標籤，比較有保障","選深色的，比較不容易髒"],"answer":2},{"id":245,"q":"關於內輪差的敘述，何者錯誤?","options":["車輛在轉彎時，後輪向內偏移","軸距越長的車輛內輪差越大","小客車沒有內輪差"],"answer":3},{"id":246,"q":"機車駕駛人行經路面積水路段時應如何操作較恰當?","options":["低速行駛","多使用煞車","快速通過"],"answer":1},{"id":247,"q":"以下何者「不是」騎乘機車時的危險行為?","options":["騎車後座載人","參加車隊夜間狂飆","聚餐酒後夜遊"],"answer":1},{"id":248,"q":"車輛行駛彎道時速度愈高，所產生的離心力","options":["愈大","愈小","不變"],"answer":1},{"id":249,"q":"機車緊急煞車時切記不可以用力過猛而鎖死輪胎，並採取","options":["放開油門後控制後輪煞車","放開油門後使用前後輪煞車","放開油門後控制前輪煞車"],"answer":2},{"id":250,"q":"騎乘機車時良好的手肘姿勢為何？","options":["向前伸直","向身體靠攏","向外張開"],"answer":2},{"id":251,"q":"騎車穿越積水路段後，應特別注意","options":["試開燈光","試拉煞車","試轉動油門加油"],"answer":2},{"id":252,"q":"人的身體哪個部位一經撞擊，所產生死亡和後遺症是最高的?","options":["四肢","頭部","背部"],"answer":2},{"id":253,"q":"路面上積有油污，你騎車因而滑倒，你應該","options":["自認倒霉駛離","不必向最近警察派出所報案","用樹枝或其他標識放置兩端，提醒來往車輛注意，並通知警察機關處理"],"answer":3},{"id":254,"q":"在郊外駕車如發現鵝群橫越道路時應","options":["大鳴喇叭促其趕快通過","加速通過鵝群","減速慢行待其通過後再行前進"],"answer":3},{"id":255,"q":"汽機車強制保險針對車禍當事人死亡或全殘最高給付新臺幣","options":["10 萬元","20 萬元","200 萬元"],"answer":3},{"id":256,"q":"駕駛人行車速度，超過規定之最高時速經當場舉發者，應處","options":["罰鍰並記違規點數","吊扣行車執照","吊扣駕駛執照"],"answer":1},{"id":257,"q":"駕駛人因違規而被處罰鍰並記點，以後應","options":["不予理會","遵守交通規則，勿再違規","小心駕駛，以躲避警察取締"],"answer":2},{"id":258,"q":"不服從執行交通勤務之警察或依法令執行交通稽查任務人員之指揮或稽查，經當場舉發者，應處","options":["吊扣駕照 1 個月","吊扣駕照 2 個月","罰鍰並予記點"],"answer":3},{"id":259,"q":"領用牌照不需使用時，","options":["可以借供他車使用","得向當地公路監理機關申請繳銷","自行保存"],"answer":2},{"id":260,"q":"領有重型機車駕駛執照者，可駕駛","options":["輕型機車","小型貨車","小客車"],"answer":1},{"id":261,"q":"駕駛人允許無駕駛執照之人駕駛其車輛者，應吊扣駕駛執照","options":["2 個月","3 個月","4 個月"],"answer":2},{"id":262,"q":"駕駛人使用偽照、變造或矇領之駕駛執照駕車時，應處","options":["罰鍰","吊銷駕照","罰鍰並扣繳駕照"],"answer":3},{"id":264,"q":"聞消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號，不立即避讓者，應處","options":["吊扣駕駛執照 3 個月","罰鍰並吊銷駕照","罰鍰"],"answer":2},{"id":265,"q":"違反道路交通管理事件行為人，接獲違反道路交通管理事件通知單後，應於幾天內得不經裁決，逕依罰鍰基準規定，向指定之處所繳納結案？","options":["10 天內","20 天內","30 天內"],"answer":3},{"id":266,"q":"駕駛人駕車撞傷正執行交通勤務中之警察時，","options":["吊銷駕照並處罰鍰","吊扣駕照並處罰鍰","處最高罰鍰"],"answer":1},{"id":267,"q":"駕駛執照破損不易辨明時，要","options":["申請換發","重行考領","仍可持以行駛"],"answer":1},{"id":268,"q":"駕駛人超速駕車者，但行車速度未超過規定之最高時速 40 公里以上，經當場舉發，應處以","options":["罰鍰","罰鍰並吊扣駕照 1 個月","罰鍰並記違規點數 1 點"],"answer":3},{"id":269,"q":"將駕照借供他人駕車，處罰吊扣駕照","options":["1 個月","2 個月","3 個月"],"answer":3},{"id":270,"q":"利用機車犯罪，經判決有期徒刑以上之刑確定者，除吊銷駕駛執照外","options":["1 年內不得考領","3 年內不得考領","終身不得考領（但符合特定條件，且所受吊銷駕駛執照處分，執行已逾相關規定時間者，不在此限）"],"answer":3},{"id":271,"q":"違反道路交通安全規則，因而肇事致人重傷者，吊扣其駕照","options":["3 個月至 6 個月","1 個月至 2 個月","2 個月至 4 個月"],"answer":1},{"id":272,"q":"駕駛人如肇事致人重傷或死亡，應即時處理，並向警察機關報告，不得逃逸，違者應處罰","options":["吊銷駕駛執照，並終身不得再考領（但符合特定條件，且所受吊銷駕駛執照處分，執行已逾相關規定時間者，不在此限）","應予罰鍰","吊扣駕駛執照 1 年"],"answer":1},{"id":273,"q":"駕駛人在 1 年內，違規記點每達 12 點以上者，吊扣駕駛執照","options":["6 個月","2 個月","1 年"],"answer":2},{"id":274,"q":"駕駛人因違規記點，2 年內經吊扣駕駛執照 2 次，再經記違規點數者，處以：","options":["罰鍰","吊扣駕照 1 個月","吊銷駕照"],"answer":3},{"id":275,"q":"臨時停車規定時間","options":["不得超過 3 分鐘，並保持立即行駛之狀態","不得超過 10 分鐘，駕駛人亦可離開座位","只要不超過 5 分鐘即可"],"answer":1},{"id":276,"q":"註銷之駕照，應","options":["自行保留","繳回公路監理機關","繼續使用"],"answer":2},{"id":277,"q":"在車站或其他公共場所出、入口","options":["可以停車","不得停車","無規定"],"answer":2},{"id":278,"q":"重型機車在駕駛人後設有固定座位者，可附載","options":["1 人","2 人","3 人"],"answer":1},{"id":279,"q":"聞有消防車、警備車、救護車、工程救險車、毒性化學物質災害事故應變車等之警號時，不論來自何方，應該","options":["不須避讓","只要不跨線行駛，就不必避讓","均應立即避讓，並不得在後跟隨急駛"],"answer":3},{"id":280,"q":"機車路考不合格，申請再考驗者，距上次考驗時間，不得少於","options":["7 天","15 天","30 天"],"answer":1},{"id":281,"q":"機車車主及駕駛人有住址變更","options":["應持有關證件向公路監理機關辦理變更登記","不必辦理變更登記","向附近警察派出所辦理登記"],"answer":1},{"id":282,"q":"機車報廢，應填具異動登記書，向公路監理機關辦理報廢登記，並同時繳還","options":["駕駛執照","號牌及行車執照","行車執照"],"answer":2},{"id":283,"q":"機車未經登記檢驗又未領用牌照","options":["不准行駛","可以行駛","可在郊外行駛"],"answer":1},{"id":285,"q":"依現行規定，持普通重型機車駕駛執照，不得駕駛汽缸排氣量","options":["50 立方公分以上 250 立方公分以下","50 立方公分以下","逾 250 立方公分以上之二輪機車"],"answer":3},{"id":286,"q":"下列何者氣象資訊與道路災害息息相關，應多加留意？","options":["潮汐","降雨","氣溫"],"answer":2},{"id":287,"q":"下列哪種駕駛行為有誤？","options":["隨時收聽警察廣播電台，掌握即時路況訊息","如於道路上受困可利用路側之公路里程牌確認目前位置並求援","遭遇落石阻道時，可隨意將車輛停放路邊，不用特別觀察附近是否安全"],"answer":3},{"id":288,"q":"假設不幸受困於山區道路應如何處置？","options":["利用公路里程牌確認目前位置後向外聯繫呼救","確認最近之安全停駐空間或緊急暫停空間，前往避險等待救援","以上皆是"],"answer":3},{"id":289,"q":"下列何者「非」公路單位執行封橋封路等交通管制之目的？","options":["道路橋樑致災風險提升，行駛該路段可能造成人車危害，故提前封閉道路避免人車進入危險區域而造成生命財產損失","因施工或已發生災害造成道路阻斷，為加速搶修及確保用路人安全","封路封橋只是為了造成用路人不便，行程受阻"],"answer":3},{"id":290,"q":"機車駕駛人如果未隨身攜帶駕駛執照、未隨車攜帶行車執照及強制汽車責任保險卡者：","options":["處罰鍰","勸導、告誡","免處罰鍰"],"answer":3},{"id":291,"q":"普通重型機車附載物件之重量規定","options":["以 80 公斤為限","以 40 公斤為限","以 30 公斤為限"],"answer":1},{"id":292,"q":"駕駛汽機車未隨身攜帶駕駛執照不再處罰，主要原因為何？","options":["執法人員可透過電腦系統即時查詢駕駛資格","駕駛執照已全面電子化","駕駛執照已與國民身分證合併"],"answer":1},{"id":293,"q":"自中華民國 95 年 6 月 15 日起，機車出廠五年以上辦理轉讓過戶者，應申請實施","options":["臨時檢驗","定期檢驗","變更檢驗"],"answer":1},{"id":294,"q":"考領輕型機車或普通重型機車駕駛執照須年滿","options":["16 歲","18 歲","20 歲"],"answer":2},{"id":295,"q":"駕駛執照業經吊銷、註銷仍駕駛機車者，除處罰鍰、當場禁止其駕駛外，該駕照並應","options":["自行銷毀","扣繳","無另外規定"],"answer":2},{"id":296,"q":"駕駛執照吊扣期間仍駕駛機車者，除處罰鍰、當場禁止其駕駛外，並應","options":["處違規記點","處違規紀錄","吊銷駕駛執照"],"answer":3},{"id":297,"q":"領有聯結車、大客車、大貨車或小型車駕駛執照，駕駛重型機車者，應處","options":["罰鍰","當場禁止其駕駛","以上皆是"],"answer":3},{"id":298,"q":"機車駕駛人佔用自行車專用道行駛，經當場舉發者，應處","options":["加以勸導","罰鍰並記違規點數 1 點","無規定"],"answer":2},{"id":299,"q":"下列何者不得參加駕駛執照考驗","options":["有酒精、麻醉劑、興奮劑中毒者","未取得醫師出具最近兩年以上未發作診斷證明書之癲癇疾病者","以上皆是"],"answer":3},{"id":303,"q":"駕駛人行經泥濘或積水道路，不減速慢行，致污濕他人身體、衣物者","options":["罰鍰","記違規點數 1 點","吊扣駕照 1 個月"],"answer":1},{"id":304,"q":"駕駛人因雨、霧視線不清或道路上臨時發生障礙，不減速慢行者","options":["罰鍰","記違規點數 1 點","吊扣駕照 1 個月"],"answer":1},{"id":305,"q":"駕駛人在起駛前，不讓行進中之車輛、行人優先通行，經當場舉發者","options":["吊扣駕照 1 個月","施以道路交通安全講習","罰鍰並記違規點數 1 點"],"answer":3},{"id":306,"q":"不服從交通勤務警察或依法令執行交通指揮、稽查任務人員之指揮或稽查，經當場舉發者","options":["吊扣駕照 1 個月","罰鍰並記違規點數 1 點","施以道路交通安全講習"],"answer":2},{"id":307,"q":"依據現行法規，投保義務人於強制汽車責任保險期間屆滿後，逾多久仍未重新訂立保險契約者，主管機關得移請公路監理機關註銷其牌照？","options":["3 個月","6
